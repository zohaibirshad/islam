<!doctype html>
<html lang="ur-Latn" dir="ltr" data-l="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5f4a">
<meta name="description" content="Mera Deen Safar — roz ke chhote amal se deen ko zindagi mein laayein">
<title>Mera Deen Safar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a26;--mute:#7a857f;--line:#ebe7dc;--pri:#0f5f4a;--pri2:#e3f0eb;--gold:#c79a3b;--gold2:#fbf3e1;--ok:#1e8a63;--r:22px;--sh:0 1px 2px rgba(20,40,30,.04),0 6px 24px rgba(20,40,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#16201d;--ink:#e8efe9;--mute:#8d9a94;--line:#24302c;--pri:#4cc79b;--pri2:#173129;--gold:#e0b65c;--gold2:#2a2416;--ok:#4cc79b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:76px;resize:vertical}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
header .hi{flex:1;min-width:0}
.hi small{display:block;color:var(--mute);font-size:13px}
.hi h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;font-size:20px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.icon svg,.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;gap:10px;margin:14px 0 22px}
.pill{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.pill b{font-size:20px;display:block;line-height:1.2}
.pill span{font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));border-radius:6px;transition:width .5s}
.card{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 14px;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.card h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--pri);font-weight:600}
.big{font-size:19px;font-weight:600;margin:0 0 6px;line-height:1.45}
.mute{color:var(--mute);font-size:13px}
.ref{color:var(--mute);font-size:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;transition:transform .1s}
@media (prefers-color-scheme:dark){.btn{color:#08130f}}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.done{background:var(--pri2);color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.namaz{display:flex;justify-content:space-between;gap:6px}
.nz{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.nz .c{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;transition:all .2s;position:relative}
.nz.on .c{background:var(--pri);border-color:var(--pri);color:#fff}
.nz.goal .c:after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.nz b{font-size:13px;font-weight:600}
.nz span{font-size:11px;color:var(--mute);margin-top:-6px}
.next{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.next b{color:var(--ink)}
.ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:26px;line-height:2;margin:4px 0 10px}
.ar.c{text-align:center}
.tr{font-style:italic;color:var(--pri);font-size:14px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--mute);border-radius:14px}
.tab.on{color:var(--pri)}
.tab.on svg{stroke-width:2.3}
.view{display:none;animation:f .25s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.li:last-child{border-bottom:0}
.li .e{font-size:22px;width:28px;text-align:center}
.li .t{flex:1;font-weight:500}
.chev{color:var(--mute);display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.tile{background:var(--card);border-radius:var(--r);padding:20px 18px;text-align:start;box-shadow:var(--sh);min-height:128px;display:flex;flex-direction:column;gap:6px}
.tile .e{font-size:28px}
.tile b{font-size:16px}
.tile span{font-size:12px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;padding-bottom:40px}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;z-index:2}
.sheet .top h3{flex:1;margin:0;font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}
.chk{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.chk:last-child{border-bottom:0}
.chk .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:#fff}
.chk.on .bx{background:var(--pri);border-color:var(--pri)}
.chk .t{flex:1}
.chk .t small{display:block;color:var(--mute);font-size:12px}
.counter{width:180px;height:180px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:var(--pri2);color:var(--pri);font-size:44px;font-weight:700;position:relative;user-select:none;transition:transform .08s}
.counter:active{transform:scale(.96)}
.counter svg{position:absolute;inset:0;transform:rotate(-90deg)}
.counter small{display:block;font-size:13px;font-weight:500;color:var(--mute);text-align:center}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 18px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.gold{background:var(--gold2)}
.gold h2 em{color:var(--gold)}
.note{font-size:12px;color:var(--mute);text-align:center;margin:26px 0 8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;z-index:80;pointer-events:none;max-width:88vw;width:max-content;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.week{display:flex;gap:6px;align-items:flex-end;height:80px;margin:8px 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:8px;background:var(--pri);min-height:4px;opacity:.85}
.grid7{display:grid;grid-template-columns:56px repeat(7,1fr);gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.grid7 .d{width:100%;aspect-ratio:1;border-radius:8px;background:var(--line)}
.grid7 .d.on{background:var(--pri)}
.member{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.ring{width:48px;height:48px;flex:none;position:relative;display:grid;place-items:center;font-size:20px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:8px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-size:14px}
.stage{display:flex;gap:6px;margin:12px 0}
.stage i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.stage i.on{background:var(--gold)}
.stage i.cur{background:var(--pri)}
label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.15)}}
.hide{display:none!important}
/* ---- i18n: fonts + RTL ---- */
html[data-l=ur] body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",system-ui,serif;font-size:15px}
html[data-l=ur] body *{line-height:2.05}
html[data-l=ur] .nz span,html[data-l=ur] .pill span,html[data-l=ur] .tab{line-height:1.7}
html[data-l=ar] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
html[data-l=hi] body{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif}
html[data-l=bn] body{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda",system-ui,sans-serif}
html[data-l=ur] .ar,html[data-l=ar] .ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;line-height:2}
html:not([data-l=ru]):not([data-l=en]):not([data-l=id]) .card h2{letter-spacing:0}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] #shBack svg{transform:scaleX(-1)}
[dir=rtl] .ring svg,[dir=rtl] .counter svg{transform:rotate(-90deg) scaleY(-1)}
[dir=rtl] .bar i{background:linear-gradient(270deg,var(--pri),var(--gold))}
[dir=rtl] .tr,[dir=rtl] .ref{unicode-bidi:plaintext}
.chip{font-family:inherit}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .e{font-size:22px;width:28px;text-align:center}
.qrow .t{flex:1;min-width:0}
.qrow .t b{display:block;font-size:20px;line-height:1.2}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qgrid label.f{margin:8px 0 4px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;margin:6px 6px 0 0;color:var(--mute)}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat3 div{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:18px;line-height:1.3}
.stat3 span{font-size:11px;color:var(--mute)}
.qhome{display:flex;width:100%;align-items:center;gap:14px;text-align:start;padding:16px 22px}
.seg.sm{margin-bottom:12px}.seg.sm button{font-size:13px;padding:7px 4px}
/* ---- Bachon ka mode ---- */
body.kid .hi h1{white-space:normal;font-size:20px;line-height:1.3}
body:not(.kid) #v-kid,body:not(.kid) #knav,body:not(.kid) #hLock,body.kid #nav,body.kid #hSet{display:none!important}
body.kid .view:not(#v-kid){display:none!important}
#knav .tab{gap:0;font-size:12px}#knav .ke{font-size:24px;line-height:1.2;filter:grayscale(.6);opacity:.75;transition:all .2s}#knav .tab.on .ke{filter:none;opacity:1;transform:scale(1.12)}#knav .tab.on{font-weight:700}
.ktree{display:flex;align-items:center;gap:16px}.ktree .te{font-size:64px;line-height:1.1;flex:none}.ktree .kst{font-size:26px;font-weight:700}
.ktree.big{flex-direction:column;text-align:center}.ktree.big .te{font-size:96px}.ktree.big .bar{width:100%}.ktree.big .stat3{width:100%}
.kh{font-size:18px;margin:4px 4px 12px}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.ktile{position:relative;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:16px 12px 14px;box-shadow:var(--sh);min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.ktile:active{transform:scale(.96)}.ktile .e{font-size:46px;line-height:1.1}.ktile b{font-size:15px;line-height:1.3}
.ktile.on{background:var(--pri2);border-color:var(--pri)}.ktile .ok{position:absolute;top:8px;inset-inline-end:10px;font-style:normal;font-size:18px}
.kb-s .ktile b{font-size:17px}.kb-s .btn{padding:15px 24px;font-size:17px}
.kspk{position:absolute;top:6px;inset-inline-start:6px;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:16px}
.knz .kspk,.kflip .kspk,.kgold .kspk,.card .row .kspk,.kstoryv .kspk{position:static}
.knz .e{font-size:44px}.kbig{font-size:18px;display:block}
.pips{display:flex;gap:8px;margin-top:8px}.pips i{width:22px;height:22px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--gold)}
.kstory{display:flex;align-items:center;gap:14px;width:100%;text-align:start}.kstory .e{font-size:42px}.kstory b{display:block;font-size:17px}
.khint{margin:0 4px 14px}
.kflip{perspective:1200px;margin-bottom:8px}.kflip .in{display:grid;transition:transform .5s;transform-style:preserve-3d}
.kflip .card{grid-area:1/1;margin:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.kflip .back{transform:rotateY(180deg)}.kflip.on .in{transform:rotateY(180deg)}
.kflip .e{font-size:28px}.kmean{font-size:18px}
.krep{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.kstoryv .e{font-size:84px;text-align:center;line-height:1.2}.kstoryv>p{font-size:18px;line-height:1.7;margin:0 0 12px}.kstoryv.s>p{font-size:21px}
.kdone{text-align:center;color:var(--ok);font-weight:600}
.kq{padding:8px 0 12px;border-bottom:1px solid var(--line)}.kq:last-child{border-bottom:0}
.kopt{display:block;width:100%;text-align:start;padding:12px 16px;margin:8px 0;border-radius:14px;border:2px solid var(--line);font-size:15px}
.kopt.ok{border-color:var(--ok);background:var(--pri2);color:var(--ok);font-weight:600}.kopt.no{opacity:.55}.kopt:disabled{cursor:default}
.kfb{margin:4px 0 0;font-size:14px;color:var(--mute)}.kfb.ok{color:var(--ok);font-weight:600}
.kstk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kstk span{aspect-ratio:1;display:grid;place-items:center;font-size:30px;border-radius:16px;background:var(--bg);opacity:.45}.kstk span.on{opacity:1;background:var(--gold2)}
.kbd{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kbd div{background:var(--bg);border-radius:16px;padding:12px;text-align:center;opacity:.5;filter:grayscale(1)}.kbd div.on{opacity:1;filter:none;background:var(--gold2)}
.kbd span{font-size:32px;display:block}.kbd b{display:block;font-size:14px}.kbd small{font-size:11px;color:var(--mute)}
.kcele{text-align:center}.kcele .e{font-size:80px;animation:pop .6s}
.kring{background:var(--gold2);border-radius:50%}
.medit{font-size:18px;padding:6px;align-self:flex-start}
.party{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.party span{position:absolute;top:-50px;animation:fall 2s ease-in forwards}
html body .kstk span,html body .ktile .e,html body .kbd span,html body .ktree .te,html body .kstoryv .e,html body .kcele .e,html body #knav .ke,html body .knz .e,html body .kstory .e{line-height:1.15!important}
.kstk span{min-width:0;overflow:hidden}.kstoryv .e{margin:6px 0 18px}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg);opacity:.3}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <button class="av" data-act="go" data-a="family" id="hAv" aria-label="Profile">🌙</button>
  <div class="hi"><small id="hDate"></small><h1 id="hName">Assalam-o-Alaikum</h1></div>
  <button class="icon" id="hLock" data-act="kexit" aria-label="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  <button class="icon" id="hSet" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section class="view on" id="v-home"></section>
<section class="view" id="v-ibadat"></section>
<section class="view" id="v-duas"></section>
<section class="view" id="v-safar"></section>
<section class="view" id="v-family"></section>
<section class="view on" id="v-kid"></section>
</div>

<nav id="nav"><div class="in">
 <button class="tab on" data-act="go" data-a="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
 <button class="tab" data-act="go" data-a="ibadat"><svg viewBox="0 0 24 24"><path d="M12 2c-3 3-5 5-5 8h10c0-3-2-5-5-8zM5 10h14v11H5zM10 21v-5a2 2 0 0 1 4 0v5"/></svg><span>Ibadat</span></button>
