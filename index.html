<!doctype html>
<html lang="ur-Latn" dir="ltr" data-l="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5f4a">
<meta name="description" content="Mera Deen Safar — roz ke chhote amal se deen ko zindagi mein laayein">
<title>Mera Deen Safar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a26;--mute:#7a857f;--line:#ebe7dc;--pri:#0f5f4a;--pri2:#e3f0eb;--gold:#c79a3b;--gold2:#fbf3e1;--ok:#1e8a63;--r:22px;--sh:0 1px 2px rgba(20,40,30,.04),0 6px 24px rgba(20,40,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#16201d;--ink:#e8efe9;--mute:#8d9a94;--line:#24302c;--pri:#4cc79b;--pri2:#173129;--gold:#e0b65c;--gold2:#2a2416;--ok:#4cc79b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:76px;resize:vertical}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
header .hi{flex:1;min-width:0}
.hi small{display:block;color:var(--mute);font-size:13px}
.hi h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;font-size:20px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.icon svg,.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;gap:10px;margin:14px 0 22px}
.pill{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.pill b{font-size:20px;display:block;line-height:1.2}
.pill span{font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));border-radius:6px;transition:width .5s}
.card{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 14px;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.card h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--pri);font-weight:600}
.big{font-size:19px;font-weight:600;margin:0 0 6px;line-height:1.45}
.mute{color:var(--mute);font-size:13px}
.ref{color:var(--mute);font-size:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;transition:transform .1s}
@media (prefers-color-scheme:dark){.btn{color:#08130f}}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.done{background:var(--pri2);color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.namaz{display:flex;justify-content:space-between;gap:6px}
.nz{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.nz .c{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;transition:all .2s;position:relative}
.nz.on .c{background:var(--pri);border-color:var(--pri);color:#fff}
.nz.goal .c:after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.nz b{font-size:13px;font-weight:600}
.nz span{font-size:11px;color:var(--mute);margin-top:-6px}
.next{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.next b{color:var(--ink)}
.ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:26px;line-height:2;margin:4px 0 10px}
.ar.c{text-align:center}
.tr{font-style:italic;color:var(--pri);font-size:14px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--mute);border-radius:14px}
.tab.on{color:var(--pri)}
.tab.on svg{stroke-width:2.3}
.view{display:none;animation:f .25s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.li:last-child{border-bottom:0}
.li .e{font-size:22px;width:28px;text-align:center}
.li .t{flex:1;font-weight:500}
.chev{color:var(--mute);display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.tile{background:var(--card);border-radius:var(--r);padding:20px 18px;text-align:start;box-shadow:var(--sh);min-height:128px;display:flex;flex-direction:column;gap:6px}
.tile .e{font-size:28px}
.tile b{font-size:16px}
.tile span{font-size:12px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;padding-bottom:40px}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;z-index:2}
.sheet .top h3{flex:1;margin:0;font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}
.chk{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.chk:last-child{border-bottom:0}
.chk .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:#fff}
.chk.on .bx{background:var(--pri);border-color:var(--pri)}
.chk .t{flex:1}
.chk .t small{display:block;color:var(--mute);font-size:12px}
.counter{width:180px;height:180px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:var(--pri2);color:var(--pri);font-size:44px;font-weight:700;position:relative;user-select:none;transition:transform .08s}
.counter:active{transform:scale(.96)}
.counter svg{position:absolute;inset:0;transform:rotate(-90deg)}
.counter small{display:block;font-size:13px;font-weight:500;color:var(--mute);text-align:center}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 18px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.gold{background:var(--gold2)}
.gold h2 em{color:var(--gold)}
.note{font-size:12px;color:var(--mute);text-align:center;margin:26px 0 8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;z-index:80;pointer-events:none;max-width:88vw;width:max-content;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.week{display:flex;gap:6px;align-items:flex-end;height:80px;margin:8px 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:8px;background:var(--pri);min-height:4px;opacity:.85}
.grid7{display:grid;grid-template-columns:56px repeat(7,1fr);gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.grid7 .d{width:100%;aspect-ratio:1;border-radius:8px;background:var(--line)}
.grid7 .d.on{background:var(--pri)}
.member{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.ring{width:48px;height:48px;flex:none;position:relative;display:grid;place-items:center;font-size:20px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:8px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-size:14px}
.stage{display:flex;gap:6px;margin:12px 0}
.stage i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.stage i.on{background:var(--gold)}
.stage i.cur{background:var(--pri)}
label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.15)}}
.hide{display:none!important}
/* ---- i18n: fonts + RTL ---- */
html[data-l=ur] body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",system-ui,serif;font-size:15px}
html[data-l=ur] body *{line-height:2.05}
html[data-l=ur] .nz span,html[data-l=ur] .pill span,html[data-l=ur] .tab{line-height:1.7}
html[data-l=ar] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
html[data-l=hi] body{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif}
html[data-l=bn] body{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda",system-ui,sans-serif}
html[data-l=ur] .ar,html[data-l=ar] .ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;line-height:2}
html:not([data-l=ru]):not([data-l=en]):not([data-l=id]) .card h2{letter-spacing:0}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] #shBack svg{transform:scaleX(-1)}
[dir=rtl] .ring svg,[dir=rtl] .counter svg{transform:rotate(-90deg) scaleY(-1)}
[dir=rtl] .bar i{background:linear-gradient(270deg,var(--pri),var(--gold))}
[dir=rtl] .tr,[dir=rtl] .ref{unicode-bidi:plaintext}
.chip{font-family:inherit}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .e{font-size:22px;width:28px;text-align:center}
.qrow .t{flex:1;min-width:0}
.qrow .t b{display:block;font-size:20px;line-height:1.2}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qgrid label.f{margin:8px 0 4px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;margin:6px 6px 0 0;color:var(--mute)}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat3 div{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:18px;line-height:1.3}
.stat3 span{font-size:11px;color:var(--mute)}
.qhome{display:flex;width:100%;align-items:center;gap:14px;text-align:start;padding:16px 22px}
.seg.sm{margin-bottom:12px}.seg.sm button{font-size:13px;padding:7px 4px}
/* ---- Bachon ka mode ---- */
body.kid .hi h1{white-space:normal;font-size:20px;line-height:1.3}
body:not(.kid) #v-kid,body:not(.kid) #knav,body:not(.kid) #hLock,body.kid #nav,body.kid #hSet{display:none!important}
body.kid .view:not(#v-kid){display:none!important}
#knav .tab{gap:0;font-size:12px}#knav .ke{font-size:24px;line-height:1.2;filter:grayscale(.6);opacity:.75;transition:all .2s}#knav .tab.on .ke{filter:none;opacity:1;transform:scale(1.12)}#knav .tab.on{font-weight:700}
.ktree{display:flex;align-items:center;gap:16px}.ktree .te{font-size:64px;line-height:1.1;flex:none}.ktree .kst{font-size:26px;font-weight:700}
.ktree.big{flex-direction:column;text-align:center}.ktree.big .te{font-size:96px}.ktree.big .bar{width:100%}.ktree.big .stat3{width:100%}
.kh{font-size:18px;margin:4px 4px 12px}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.ktile{position:relative;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:16px 12px 14px;box-shadow:var(--sh);min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.ktile:active{transform:scale(.96)}.ktile .e{font-size:46px;line-height:1.1}.ktile b{font-size:15px;line-height:1.3}
.ktile.on{background:var(--pri2);border-color:var(--pri)}.ktile .ok{position:absolute;top:8px;inset-inline-end:10px;font-style:normal;font-size:18px}
.kb-s .ktile b{font-size:17px}.kb-s .btn{padding:15px 24px;font-size:17px}
.kspk{position:absolute;top:6px;inset-inline-start:6px;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:16px}
.knz .kspk,.kflip .kspk,.kgold .kspk,.card .row .kspk,.kstoryv .kspk{position:static}
.knz .e{font-size:44px}.kbig{font-size:18px;display:block}
.pips{display:flex;gap:8px;margin-top:8px}.pips i{width:22px;height:22px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--gold)}
.kstory{display:flex;align-items:center;gap:14px;width:100%;text-align:start}.kstory .e{font-size:42px}.kstory b{display:block;font-size:17px}
.khint{margin:0 4px 14px}
.kflip{perspective:1200px;margin-bottom:8px}.kflip .in{display:grid;transition:transform .5s;transform-style:preserve-3d}
.kflip .card{grid-area:1/1;margin:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.kflip .back{transform:rotateY(180deg)}.kflip.on .in{transform:rotateY(180deg)}
.kflip .e{font-size:28px}.kmean{font-size:18px}
.krep{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.kstoryv .e{font-size:84px;text-align:center;line-height:1.2}.kstoryv>p{font-size:18px;line-height:1.7;margin:0 0 12px}.kstoryv.s>p{font-size:21px}
.kdone{text-align:center;color:var(--ok);font-weight:600}
.kq{padding:8px 0 12px;border-bottom:1px solid var(--line)}.kq:last-child{border-bottom:0}
.kopt{display:block;width:100%;text-align:start;padding:12px 16px;margin:8px 0;border-radius:14px;border:2px solid var(--line);font-size:15px}
.kopt.ok{border-color:var(--ok);background:var(--pri2);color:var(--ok);font-weight:600}.kopt.no{opacity:.55}.kopt:disabled{cursor:default}
.kfb{margin:4px 0 0;font-size:14px;color:var(--mute)}.kfb.ok{color:var(--ok);font-weight:600}
.kstk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kstk span{aspect-ratio:1;display:grid;place-items:center;font-size:30px;border-radius:16px;background:var(--bg);opacity:.45}.kstk span.on{opacity:1;background:var(--gold2)}
.kbd{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kbd div{background:var(--bg);border-radius:16px;padding:12px;text-align:center;opacity:.5;filter:grayscale(1)}.kbd div.on{opacity:1;filter:none;background:var(--gold2)}
.kbd span{font-size:32px;display:block}.kbd b{display:block;font-size:14px}.kbd small{font-size:11px;color:var(--mute)}
.kcele{text-align:center}.kcele .e{font-size:80px;animation:pop .6s}
.kring{background:var(--gold2);border-radius:50%}
.medit{font-size:18px;padding:6px;align-self:flex-start}
.party{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.party span{position:absolute;top:-50px;animation:fall 2s ease-in forwards}
html body .kstk span,html body .ktile .e,html body .kbd span,html body .ktree .te,html body .kstoryv .e,html body .kcele .e,html body #knav .ke,html body .knz .e,html body .kstory .e{line-height:1.15!important}
.kstk span{min-width:0;overflow:hidden}.kstoryv .e{margin:6px 0 18px}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg);opacity:.3}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <button class="av" data-act="go" data-a="family" id="hAv" aria-label="Profile">🌙</button>
  <div class="hi"><small id="hDate"></small><h1 id="hName">Assalam-o-Alaikum</h1></div>
  <button class="icon" id="hLock" data-act="kexit" aria-label="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  <button class="icon" id="hSet" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section class="view on" id="v-home"></section>
<section class="view" id="v-ibadat"></section>
<section class="view" id="v-duas"></section>
<section class="view" id="v-safar"></section>
<section class="view" id="v-family"></section>
<section class="view on" id="v-kid"></section>
</div>

<nav id="nav"><div class="in">
 <button class="tab on" data-act="go" data-a="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
 <button class="tab" data-act="go" data-a="ibadat"><svg viewBox="0 0 24 24"><path d="M12 2c-3 3-5 5-5 8h10c0-3-2-5-5-8zM5 10h14v11H5zM10 21v-5a2 2 0 0 1 4 0v5"/></svg><span>Ibadat</span></button>

<script>
"use strict";
const D={"azkar":[{"k":"kursi","t":"Ayat-ul-Kursi","ar":"اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ","tr":"","m":"Allah ke siwa koi mabood nahi, wo zinda aur sab ko thaamne wala hai… (Al-Baqarah 2:255). Subah padhne wala shaam tak, shaam ko padhne wala subah tak hifazat mein.","n":1,"ref":"Quran 2:255 · Nasai (Amal al-Yawm)"},{"k":"quls","t":"Teen Qul","ar":"بسم الله الرحمن الرحيم قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ. ۞ بسم الله الرحمن الرحيم قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ. ۞ بسم الله الرحمن الرحيم قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَ النَّاسِ","tr":"Qul huwallahu ahad · Qul a'oozu bi rabbil falaq · Qul a'oozu bi rabbin naas","m":"Surah Ikhlas, Falaq aur Naas — 3 dafa padhna har cheez ke liye kaafi hai.","n":3,"ref":"Abu Dawud 5082, Tirmidhi 3575"},{"k":"mulk","t":"Asbahna wa asbahal mulku lillah","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيرَ مَا بَعْدَهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","arE":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","tr":"Asbahna wa asbahal-mulku lillah, walhamdu lillah, la ilaha illallahu wahdahu la shareeka lah…","trE":"Amsayna wa amsal-mulku lillah, walhamdu lillah, la ilaha illallahu wahdahu la shareeka lah…","m":"Hum ne subah ki aur saari badshahi Allah ki hai. Ae Rab! Is din ki bhalai maangta hoon aur iski buraai, susti, burhape ki buraai, aag aur qabr ke azaab se panah maangta hoon.","n":1,"ref":"Sahih Muslim 2723"},{"k":"bika","t":"Allahumma bika asbahna","ar":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ","arE":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ","tr":"Allahumma bika asbahna, wa bika amsayna, wa bika nahya, wa bika namootu, wa ilaykan-nushoor","trE":"Allahumma bika amsayna, wa bika asbahna, wa bika nahya, wa bika namootu, wa ilaykal-maseer","m":"Ae Allah! Tere hi hukm se hum ne subah/shaam ki, tere hi hukm se jeete aur marte hain, aur tere hi taraf lautna hai.","n":1,"ref":"Tirmidhi 3391, Abu Dawud 5068"},{"k":"sayyid","t":"Sayyid-ul-Istighfar","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ","tr":"Allahumma anta rabbi la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika mastata't, a'oozu bika min sharri ma sana't, aboo-u laka bi ni'matika 'alayya, wa aboo-u bi dhanbi faghfir li, fa innahu la yaghfirudh-dhunooba illa ant","m":"Ae Allah! Tu mera Rab hai… main tere ehsaanat ka iqraar aur apne gunah ka eitraaf karta hoon, mujhe maaf kar de, tere siwa koi gunah maaf nahi karta. (Yaqeen se padhne wala us din/raat faut ho to Jannati hai.)","n":1,"ref":"Sahih Bukhari 6306"},{"k":"afini","t":"Allahumma 'afini fi badani","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ","tr":"Allahumma 'afini fi badani, Allahumma 'afini fi sam'i, Allahumma 'afini fi basari, la ilaha illa ant. Allahumma inni a'oozu bika minal-kufri wal-faqr, wa a'oozu bika min 'adhabil-qabr, la ilaha illa ant","m":"Ae Allah! Mere jism, kaan aur aankhon mein aafiyat de. Kufr, ghurbat aur qabr ke azaab se teri panah.","n":3,"ref":"Abu Dawud 5090"},{"k":"hasbi","t":"Hasbiyallahu","ar":"حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","tr":"Hasbiyallahu la ilaha illa huwa, 'alayhi tawakkaltu wa huwa rabbul-'arshil-'azeem","m":"Mujhe Allah kaafi hai, uske siwa koi mabood nahi, usi par bharosa hai aur wo Arsh-e-Azeem ka Rab hai.","n":7,"ref":"Abu Dawud 5081 (mauqoof)"},{"k":"bism","t":"Bismillahil-ladhi la yadurru","ar":"بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلاَ فِي السّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","tr":"Bismillahil-ladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa huwas-sami'ul-'aleem","m":"Allah ke naam se jiske naam ke saath zameen o aasmaan mein koi cheez nuqsaan nahi de sakti, wo sunne wala jaanne wala hai.","n":3,"ref":"Abu Dawud 5088, Tirmidhi 3388"},{"k":"radi","t":"Raditu billahi Rabba","ar":"رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيّاً","tr":"Raditu billahi rabba, wa bil-islami deena, wa bi Muhammadin (ﷺ) nabiyya","m":"Main Allah ko Rab, Islam ko deen aur Muhammad ﷺ ko Nabi maan kar raazi hoon.","n":3,"ref":"Abu Dawud 5072, Tirmidhi 3389"},{"k":"hayy","t":"Ya Hayyu ya Qayyum","ar":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","tr":"Ya Hayyu ya Qayyumu bi rahmatika astagheeth, aslih li sha'ni kullahu wa la takilni ila nafsi tarfata 'ayn","m":"Ae Zinda, ae Thaamne wale! Teri rehmat se madad maangta hoon, mera har kaam theek kar de aur mujhe palak jhapakne ke barabar bhi mere nafs ke hawale na kar.","n":1,"ref":"Nasai (Kubra), Hakim"},{"k":"kalimat","t":"A'oozu bi kalimatillah","ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","tr":"A'oozu bi kalimatillahit-tammati min sharri ma khalaq","m":"Allah ke kaamil kalimaat ki panah, har makhlooq ke shar se.","n":3,"ref":"Sahih Muslim 2709","only":"E"},{"k":"subhan","t":"SubhanAllahi wa bihamdihi","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","tr":"SubhanAllahi wa bihamdihi","m":"Allah paak hai apni tareef ke saath. 100 dafa padhne wale ke gunah maaf, chahe samundar ki jhaag ke barabar hon.","n":100,"ref":"Sahih Muslim 2692, Bukhari 6405"},{"k":"istighfar","t":"Astaghfirullaha wa atubu ilayh","ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","tr":"Astaghfirullaha wa atubu ilayh","m":"Main Allah se maafi maangta hoon aur uski taraf rujoo karta hoon. Nabi ﷺ din mein 100 dafa istighfar karte.","n":100,"ref":"Bukhari 6307, Muslim 2702"},{"k":"durood","t":"Durood","ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبَيِّنَا مُحَمَّدٍ","tr":"Allahumma salli wa sallim 'ala nabiyyina Muhammad","m":"Ae Allah! Hamare Nabi Muhammad ﷺ par rehmat aur salaamti naazil farma.","n":10,"ref":"Tabarani (Hasan — Albani)"}],"duas":[{"k":"neend","t":"Neend se uthna","e":"🌅","ar":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","tr":"Alhamdu lillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushoor","m":"Tamaam tareef us Allah ki jis ne hamein maut (neend) ke baad zinda kiya aur usi ki taraf uth kar jaana hai.","ref":"Bukhari 6312","hrs":[4,10]},{"k":"sona","t":"Sone se pehle","e":"🌙","ar":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","tr":"Bismika Allahumma amootu wa ahya","m":"Ae Allah! Tere naam se marta (sota) aur jeeta (jaagta) hoon.","ref":"Bukhari 6324","hrs":[21,24,0,2]},{"k":"khana1","t":"Khane se pehle","e":"🍽️","ar":"بِسْمِ اللَّهِ","tr":"Bismillah","m":"Allah ke naam se. Bhool jaayein to: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ (Bismillahi awwalahu wa akhirahu).","ref":"Abu Dawud 3767, Tirmidhi 1858","hrs":[7,9,12,15,19,21]},{"k":"khana2","t":"Khane ke baad","e":"🤲","ar":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","tr":"Alhamdu lillahil-ladhi at'amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah","m":"Tareef us Allah ki jis ne mujhe ye khilaya aur meri kisi taaqat ke baghair ata kiya. (Pichle gunah maaf hote hain.)","ref":"Abu Dawud 4023, Tirmidhi 3458","hrs":[]},{"k":"nikalna","t":"Ghar se nikalna","e":"🚪","ar":"بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","tr":"Bismillahi tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah","m":"Allah ke naam se, Allah par bharosa kiya, aur na koi taaqat hai na quwwat magar Allah se.","ref":"Abu Dawud 5095, Tirmidhi 3426","hrs":[7,9]},{"k":"dakhil","t":"Ghar mein dakhil hona","e":"🏠","ar":"بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا","tr":"Bismillahi walajna, wa bismillahi kharajna, wa 'ala Allahi rabbina tawakkalna","m":"Allah ke naam se hum daakhil hue aur nikle, aur apne Rab Allah par bharosa kiya. Phir ghar walon ko salam karein.","ref":"Abu Dawud 5096","hrs":[17,19]},{"k":"bath1","t":"Bathroom jaane se pehle","e":"🚻","ar":"بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","tr":"Bismillah, Allahumma inni a'oozu bika minal-khubuthi wal-khaba'ith","m":"Allah ke naam se. Ae Allah! Main napaak jinn mard o aurat (shayateen) se teri panah maangta hoon. (Pehle baayan paaon.)","ref":"Bukhari 142, Muslim 375; Bismillah: Tirmidhi 606","hrs":[]},{"k":"bath2","t":"Bathroom se nikalna","e":"✨","ar":"غُفْرَانَكَ","tr":"Ghufranak","m":"(Ae Allah) teri bakhshish chahta hoon. (Pehle daayan paaon.)","ref":"Abu Dawud 30, Tirmidhi 7","hrs":[]},{"k":"wudu","t":"Wudu ke baad","e":"💧","ar":"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","tr":"Ash-hadu an la ilaha illallahu wahdahu la shareeka lah, wa ash-hadu anna Muhammadan 'abduhu wa rasooluh","m":"Gawahi deta hoon Allah ke siwa koi mabood nahi… aur Muhammad ﷺ uske bande aur Rasool hain. Jannat ke 8 darwaze khul jaate hain. (Wudu se pehle: Bismillah)","ref":"Sahih Muslim 234","hrs":[]},{"k":"masjid1","t":"Masjid mein daakhil","e":"🕌","ar":"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","tr":"Allahummaf-tah li abwaba rahmatik","m":"Ae Allah! Mere liye apni rehmat ke darwaze khol de. (Daayan paaon pehle.)","ref":"Sahih Muslim 713","hrs":[]},{"k":"masjid2","t":"Masjid se nikalna","e":"🕌","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","tr":"Allahumma inni as'aluka min fadlik","m":"Ae Allah! Main tujh se tera fazl maangta hoon. (Baayan paaon pehle.)","ref":"Sahih Muslim 713","hrs":[]},{"k":"kapray","t":"Kapray pehenna","e":"👕","ar":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","tr":"Alhamdu lillahil-ladhi kasani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah","m":"Tareef us Allah ki jis ne mujhe ye pehnaya aur meri taaqat ke baghair ata kiya.","ref":"Abu Dawud 4023","hrs":[6,8]},{"k":"safar","t":"Sawari / safar","e":"🚗","ar":"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","tr":"Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrineen, wa inna ila rabbina lamunqaliboon","m":"Paak hai wo jis ne ise hamare qaabu mein diya, hum khud ise qaabu na kar sakte the, aur hum apne Rab ki taraf lautne wale hain.","ref":"Quran 43:13-14 · Muslim 1342","hrs":[7,8,17,18]},{"k":"azan","t":"Azaan ke baad","e":"📢","ar":"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","tr":"Allahumma rabba hadhihid-da'watit-tammah, was-salatil-qa'imah, ati Muhammadanil-waseelata wal-fadeelah, wab'ath-hu maqamam mahmoodanil-ladhi wa'adtah","m":"Ae Allah, is kaamil pukaar aur qaaim hone wali namaz ke Rab! Muhammad ﷺ ko waseela aur fazeelat ata kar aur unhein maqam-e-mahmood par utha jiska tu ne wada kiya. (Shafa'at naseeb hogi.)","ref":"Sahih Bukhari 614","hrs":[]},{"k":"cheenk","t":"Chheenk aaye","e":"🤧","ar":"الْحَمْدُ لِلَّهِ","tr":"Alhamdulillah — sunne wala kahe: Yarhamukallah (يَرْحَمُكَ اللَّهُ), phir chheenkne wala: Yahdeekumullahu wa yuslihu balakum (يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ)","m":"Tamaam tareef Allah ki · Allah tum par reham kare · Allah tumhein hidayat de aur tumhara haal durust kare.","ref":"Sahih Bukhari 6224","hrs":[]},{"k":"gussa","t":"Gussa aaye","e":"😤","ar":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","tr":"A'oozu billahi minash-shaytanir-rajeem","m":"Main mardood shaitan se Allah ki panah maangta hoon. Khade hon to baith jaayein, khamosh ho jaayein.","ref":"Bukhari 3282, Muslim 2610","hrs":[]},{"k":"fikr","t":"Pareshani / gham","e":"💭","ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","tr":"Allahumma inni a'oozu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-bukhli wal-jubn, wa dala'id-dayni wa ghalabatir-rijal","m":"Ae Allah! Fikr, gham, aajizi, susti, kanjoosi, buzdili, qarz ke bojh aur logon ke ghalbe se teri panah.","ref":"Sahih Bukhari 6369","hrs":[]},{"k":"musibat","t":"Musibat / nuqsaan","e":"🖤","ar":"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ","tr":"Inna lillahi wa inna ilayhi raji'oon","m":"Hum Allah hi ke hain aur usi ki taraf lautne wale hain.","ref":"Quran 2:156 · Muslim 918","hrs":[]},{"k":"yunus","t":"Mushkil waqt (Dua-e-Yunus)","e":"🐋","ar":"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","tr":"La ilaha illa anta subhanaka inni kuntu minaz-zalimeen","m":"Tere siwa koi mabood nahi, tu paak hai, beshak main hi zaalimon mein se tha.","ref":"Quran 21:87 · Tirmidhi 3505","hrs":[]},{"k":"majlis","t":"Majlis khatam hone par","e":"👥","ar":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ","tr":"Subhanaka Allahumma wa bihamdika, ash-hadu an la ilaha illa ant, astaghfiruka wa atubu ilayk","m":"Ae Allah tu paak hai apni tareef ke saath, tere siwa koi mabood nahi, tujh se maafi maangta aur tauba karta hoon. (Majlis ki ghaltiyon ka kaffara.)","ref":"Tirmidhi 3433","hrs":[]},{"k":"barish","t":"Barish ho","e":"🌧️","ar":"اللَّهُمَّ صَيِّبًا نَافِعًا","tr":"Allahumma sayyiban nafi'a","m":"Ae Allah! Ise faida dene wali barish bana.","ref":"Sahih Bukhari 1032","hrs":[]},{"k":"iftar","t":"Roza iftar","e":"🌇","ar":"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ","tr":"Dhahabaz-zama'u wabtallatil-'urooqu wa thabatal-ajru in sha Allah","m":"Pyaas chali gayi, ragein tar ho gayin aur InshaAllah ajr pakka ho gaya.","ref":"Abu Dawud 2357","hrs":[]},{"k":"jazak","t":"Koi bhalai kare","e":"🎁","ar":"جَزَاكَ اللَّهُ خَيْرًا","tr":"Jazakallahu khayran","m":"Allah tumhein behtareen badla de. (Ye kehna behtareen shukriya hai.)","ref":"Tirmidhi 2035","hrs":[]},{"k":"walidain","t":"Walidain ke liye","e":"👪","ar":"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","tr":"Rabbir-hamhuma kama rabbayani sagheera","m":"Ae Rab! Un dono par reham farma jaise unhon ne bachpan mein meri parwarish ki.","ref":"Quran 17:24","hrs":[]},{"k":"ilm","t":"Ilm ke liye","e":"📖","ar":"رَبِّ زِدْنِي عِلْمًا","tr":"Rabbi zidni 'ilma","m":"Ae mere Rab! Mere ilm mein izafa farma.","ref":"Quran 20:114","hrs":[]},{"k":"hasana","t":"Dunya o Aakhirat ki bhalai","e":"🌿","ar":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","tr":"Rabbana atina fid-dunya hasanah, wa fil-akhirati hasanah, wa qina 'adhaban-nar","m":"Ae Rab! Hamein dunya mein bhi bhalai de aur aakhirat mein bhi, aur aag ke azaab se bacha. (Nabi ﷺ ki sab se zyada maangi jaane wali dua.)","ref":"Quran 2:201 · Bukhari 6389","hrs":[]},{"k":"dil","t":"Deen par saabit qadmi","e":"❤️","ar":"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","tr":"Ya muqallibal-quloob, thabbit qalbi 'ala deenik","m":"Ae dilon ko pherne wale! Mera dil apne deen par jama de.","ref":"Tirmidhi 2140","hrs":[]}],"sunnah":[{"t":"Daayein haath se khaana aur peena","ref":"Muslim 2020"},{"t":"Khaane se pehle \"Bismillah\" kehna","ref":"Bukhari 5376"},{"t":"Salam mein pehal karna — pehle salam karne wala Allah ke zyada qareeb","ref":"Abu Dawud 5197"},{"t":"Bhai se muskura kar milna — ye bhi sadqa hai","ref":"Tirmidhi 1956"},{"t":"Miswak karna (khaas kar wudu/namaz se pehle)","ref":"Bukhari 887"},{"t":"Wudu ke baad 2 rakat Tahiyyat-ul-Wudu","ref":"Bukhari 1149"},{"t":"Daayein karwat par sona","ref":"Bukhari 6311"},{"t":"Sone se pehle wudu karna","ref":"Bukhari 6311"},{"t":"Baith kar paani peena, 3 saans mein","ref":"Muslim 2026, 2028"},{"t":"Joota pehle daayan pehenna, utaarte waqt pehle baayan","ref":"Bukhari 5855"},{"t":"Chheenk par \"Alhamdulillah\" kehna","ref":"Bukhari 6224"},{"t":"Azaan ka jawab dena aur baad ki dua padhna","ref":"Bukhari 614, Muslim 384"},{"t":"Fajr se pehle 2 sunnat — dunya o maafeeha se behtar","ref":"Muslim 725"},{"t":"Kisi bhai ke liye uski ghair-maujoodgi mein dua","ref":"Muslim 2733"},{"t":"Kisi mareez ki iyadat (ya phone par haal poochna)","ref":"Muslim 2568"},{"t":"Kisi ko tohfa dena — mohabbat barhti hai","ref":"Al-Adab al-Mufrad 594"},{"t":"Raaste se takleef deh cheez hata dena","ref":"Muslim 1914"},{"t":"Khaane ke baad plate saaf karna aur ungliyan chaatna","ref":"Muslim 2033"},{"t":"Har farz namaz ke baad Ayat-ul-Kursi","ref":"Nasai (Kubra) 9928"},{"t":"Sone se pehle teen Qul padh kar haathon par phoonk kar jism par pherna","ref":"Bukhari 5017"},{"t":"Sone se pehle Tasbeeh-e-Fatima: 33 SubhanAllah, 33 Alhamdulillah, 34 Allahu Akbar","ref":"Bukhari 3705"},{"t":"Gussa aaye to khamosh ho jaana / baith jaana","ref":"Abu Dawud 4782, Ahmad 2136"},{"t":"Achi baat kaho ya khamosh raho","ref":"Bukhari 6018"},{"t":"Ghar mein daakhil ho kar salam karna","ref":"Abu Dawud 5096"},{"t":"Ghar ke kaam mein haath batana","ref":"Bukhari 676"},{"t":"Mehmaan ki izzat karna","ref":"Bukhari 6018"},{"t":"Khushboo lagana","ref":"Nasai 3939"},{"t":"Peer ya Jumeraat ka nafli roza","ref":"Tirmidhi 747"},{"t":"Chasht (Duha) ki namaz — 2 rakat","ref":"Muslim 720"},{"t":"Majlis ke aakhir mein kaffara-e-majlis ki dua","ref":"Tirmidhi 3433"},{"t":"Neend se uth kar dua \"Alhamdulillahil-ladhi ahyana…\"","ref":"Bukhari 6312"},{"t":"Khaane mein aib na nikaalna","ref":"Bukhari 5409"},{"t":"Masjid mein daayan paaon pehle rakhna","ref":"Bukhari (tarjuma-tul-baab), Hakim"},{"t":"Durood kasrat se — ek durood par 10 rehmatein","ref":"Muslim 408"}],"ayat":[{"r":"2:152","ar":"فَٱذْكُرُونِىٓ أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ","s":"Al-Baqara","m":"Tum mujhe yaad karo, main tumhein yaad karunga, aur mera shukr karo.","a":"Aaj 5 minute sirf zikr karein — SubhanAllah, Alhamdulillah."},{"r":"2:153","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","s":"Al-Baqara","m":"Sabr aur namaz se madad lo, beshak Allah sabr karne walon ke saath hai.","a":"Aaj kisi pareshani par shikayat ke bajaye 2 rakat padh kar dua karein."},{"r":"2:186","ar":"وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ","s":"Al-Baqara","m":"Main qareeb hoon, pukaarne wale ki pukaar sunta hoon.","a":"Aaj apni zabaan mein Allah se dil khol kar ek dua maangein."},{"r":"2:286","ar":"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","s":"Al-Baqara","m":"Allah kisi par uski taaqat se zyada bojh nahi daalta.","a":"Aaj apne ek bojh ko Allah ke hawale karein aur ye ayat ki dua padhein."},{"r":"3:134","ar":"ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ","s":"Aal-i-Imraan","m":"Jo gussa pee jaate aur logon ko maaf kar dete hain — Allah mohsinon se mohabbat karta hai.","a":"Aaj kisi ek shakhs ko dil se maaf kar dein."},{"r":"3:159","ar":"فَبِمَا رَحْمَةٍۢ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ","s":"Aal-i-Imraan","m":"Allah ki rehmat se aap narm-dil hue; sakht hote to log door ho jaate.","a":"Aaj ghar walon se narmi se baat karein, awaaz oonchi na karein."},{"r":"4:36","ar":"۞ وَٱعْبُدُوا۟ ٱللَّهَ وَلَا تُشْرِكُوا۟ بِهِۦ شَيْـًۭٔا ۖ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًۭا وَبِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱلْجَارِ ذِى ٱلْقُرْبَىٰ وَٱلْجَارِ ٱلْجُنُبِ وَٱلصَّاحِبِ بِٱلْجَنۢبِ وَٱبْنِ ٱلسَّبِيلِ وَمَا مَلَكَتْ أَيْمَٰنُكُمْ ۗ إِنَّ ٱللَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالًۭا فَخُورًا","s":"An-Nisaa","m":"Allah ki ibadat karo, walidain, rishtedaaron, yateemon aur padosiyon se bhalai karo.","a":"Aaj kisi padosi ka haal poochein ya kuch bhejein."},{"r":"4:86","ar":"وَإِذَا حُيِّيتُم بِتَحِيَّةٍۢ فَحَيُّوا۟ بِأَحْسَنَ مِنْهَآ أَوْ رُدُّوهَآ ۗ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَىْءٍ حَسِيبًا","s":"An-Nisaa","m":"Jab tumhein salam kiya jaaye to us se behtar jawab do.","a":"Aaj har salam ka poora jawab dein: Wa alaikumus-salam wa rahmatullahi wa barakatuh."},{"r":"5:2","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُحِلُّوا۟ شَعَٰٓئِرَ ٱللَّهِ وَلَا ٱلشَّهْرَ ٱلْحَرَامَ وَلَا ٱلْهَدْىَ وَلَا ٱلْقَلَٰٓئِدَ وَلَآ ءَآمِّينَ ٱلْبَيْتَ ٱلْحَرَامَ يَبْتَغُونَ فَضْلًۭا مِّن رَّبِّهِمْ وَرِضْوَٰنًۭا ۚ وَإِذَا حَلَلْتُمْ فَٱصْطَادُوا۟ ۚ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ أَن صَدُّوكُمْ عَنِ ٱلْمَسْجِدِ ٱلْحَرَامِ أَن تَعْتَدُوا۟ ۘ وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ","s":"Al-Maaida","m":"Neki aur taqwa mein ek doosre ki madad karo, gunah aur zulm mein nahi.","a":"Aaj kisi ki ek nek kaam mein madad karein."},{"r":"7:31","ar":"۞ يَٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍۢ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ","s":"Al-A'raaf","m":"Khao piyo magar fuzool kharchi na karo.","a":"Aaj khaana zaaya na karein — plate mein utna lein jitna khana hai."},{"r":"13:28","ar":"ٱلَّذِينَ ءَامَنُوا۟ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ ٱللَّهِ ۗ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ","s":"Ar-Ra'd","m":"Suno! Allah ke zikr se hi dilon ko itminan milta hai.","a":"Bechaini ho to phone ke bajaye 33 dafa SubhanAllah padhein."},{"r":"14:7","ar":"وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِى لَشَدِيدٌۭ","s":"Ibrahim","m":"Agar shukr karoge to main tumhein aur zyada dunga.","a":"Aaj 3 naimatein likhein jin ka shukr ada karna hai."},{"r":"16:90","ar":"۞ إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ","s":"An-Nahl","m":"Allah adl, ehsaan aur rishtedaaron ko dene ka hukm deta hai.","a":"Aaj kisi rishtedaar ko phone karein ya milein."},{"r":"17:23","ar":"۞ وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوٓا۟ إِلَّآ إِيَّاهُ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا ۚ إِمَّا يَبْلُغَنَّ عِندَكَ ٱلْكِبَرَ أَحَدُهُمَآ أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَآ أُفٍّۢ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًۭا كَرِيمًۭا","s":"Al-Israa","m":"Walidain ko \"uff\" tak na kaho, unse izzat se baat karo.","a":"Aaj walidain se narmi se baat karein aur unke liye dua karein."},{"r":"17:36","ar":"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۚ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًۭا","s":"Al-Israa","m":"Jis baat ka ilm na ho uske peeche na pado; kaan, aankh, dil sab se sawal hoga.","a":"Aaj koi baat bina tehqeeq aage forward na karein."},{"r":"20:114","ar":"فَتَعَٰلَى ٱللَّهُ ٱلْمَلِكُ ٱلْحَقُّ ۗ وَلَا تَعْجَلْ بِٱلْقُرْءَانِ مِن قَبْلِ أَن يُقْضَىٰٓ إِلَيْكَ وَحْيُهُۥ ۖ وَقُل رَّبِّ زِدْنِى عِلْمًۭا","s":"Taa-Haa","m":"Kaho: Ae Rab! Mere ilm mein izafa farma.","a":"Aaj deen ki ek nayi baat seekhein aur kisi ko batayein."},{"r":"24:22","ar":"وَلَا يَأْتَلِ أُو۟لُوا۟ ٱلْفَضْلِ مِنكُمْ وَٱلسَّعَةِ أَن يُؤْتُوٓا۟ أُو۟لِى ٱلْقُرْبَىٰ وَٱلْمَسَٰكِينَ وَٱلْمُهَٰجِرِينَ فِى سَبِيلِ ٱللَّهِ ۖ وَلْيَعْفُوا۟ وَلْيَصْفَحُوٓا۟ ۗ أَلَا تُحِبُّونَ أَن يَغْفِرَ ٱللَّهُ لَكُمْ ۗ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌ","s":"An-Noor","m":"Maaf karo aur darguzar karo — kya tum nahi chahte Allah tumhein maaf kare?","a":"Aaj kisi purani naraazgi ko khatam karne ka pehla qadam uthayein."},{"r":"24:30","ar":"قُل لِّلْمُؤْمِنِينَ يَغُضُّوا۟ مِنْ أَبْصَٰرِهِمْ وَيَحْفَظُوا۟ فُرُوجَهُمْ ۚ ذَٰلِكَ أَزْكَىٰ لَهُمْ ۗ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا يَصْنَعُونَ","s":"An-Noor","m":"Momin mard apni nigaahein neechi rakhein — ye unke liye paakeezgi hai.","a":"Aaj nigaah ki hifazat karein, khaas kar phone par."},{"r":"25:63","ar":"وَعِبَادُ ٱلرَّحْمَٰنِ ٱلَّذِينَ يَمْشُونَ عَلَى ٱلْأَرْضِ هَوْنًۭا وَإِذَا خَاطَبَهُمُ ٱلْجَٰهِلُونَ قَالُوا۟ سَلَٰمًۭا","s":"Al-Furqaan","m":"Rehmaan ke bande zameen par aajizi se chalte hain, jahilon ko salam keh kar guzar jaate hain.","a":"Aaj kisi behes mein jawab dene ke bajaye \"salam\" keh kar chhod dein."},{"r":"29:45","ar":"ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَٰبِ وَأَقِمِ ٱلصَّلَوٰةَ ۖ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ ۗ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ ۗ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ","s":"Al-Ankaboot","m":"Namaz behayaai aur buraai se rokti hai, aur Allah ka zikr sab se bada hai.","a":"Aaj har namaz waqt par padhne ki koshish karein."},{"r":"31:18","ar":"وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا ۖ إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍۢ فَخُورٍۢ","s":"Luqman","m":"Logon se munh pher kar baat na karo aur akad kar na chalo.","a":"Aaj sab se — chhote bade — muskura kar aur tawajjoh se milein."},{"r":"33:41","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱذْكُرُوا۟ ٱللَّهَ ذِكْرًۭا كَثِيرًۭا","s":"Al-Ahzaab","m":"Ae imaan walo! Allah ko kasrat se yaad karo.","a":"Aaj kaam karte hue zabaan par zikr jaari rakhein."},{"r":"39:53","ar":"۞ قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ ۚ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ","s":"Az-Zumar","m":"Allah ki rehmat se mayoos na ho, Allah saare gunah maaf kar deta hai.","a":"Aaj sachchi tauba karein — 100 dafa istighfar."},{"r":"49:6","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَٰدِمِينَ","s":"Al-Hujuraat","m":"Koi khabar laaye to tehqeeq kar lo.","a":"Aaj WhatsApp par koi khabar bina tasdeeq share na karein."},{"r":"49:10","ar":"إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌۭ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ","s":"Al-Hujuraat","m":"Momin aapas mein bhai hain, apne bhaiyon mein sulah karwao.","a":"Aaj do naraaz logon mein sulah ki koshish ya khud sulah karein."},{"r":"49:11","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَسْخَرْ قَوْمٌۭ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًۭا مِّنْهُمْ وَلَا نِسَآءٌۭ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًۭا مِّنْهُنَّ ۖ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ ۖ بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ بَعْدَ ٱلْإِيمَٰنِ ۚ وَمَن لَّمْ يَتُبْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ","s":"Al-Hujuraat","m":"Koi qaum doosri qaum ka mazaaq na udaaye, na bure naam rakho.","a":"Aaj kisi ka mazaaq ya bura naam lene se bachein."},{"r":"49:12","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱجْتَنِبُوا۟ كَثِيرًۭا مِّنَ ٱلظَّنِّ إِنَّ بَعْضَ ٱلظَّنِّ إِثْمٌۭ ۖ وَلَا تَجَسَّسُوا۟ وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ تَوَّابٌۭ رَّحِيمٌۭ","s":"Al-Hujuraat","m":"Bad-gumaani se bacho, jasoosi na karo, gheebat na karo.","a":"Aaj gheebat se poora parhez — majlis mein ho to baat badal dein."},{"r":"59:18","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَلْتَنظُرْ نَفْسٌۭ مَّا قَدَّمَتْ لِغَدٍۢ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ","s":"Al-Hashr","m":"Har jaan dekhe ke us ne kal (aakhirat) ke liye kya aage bheja.","a":"Aaj raat muhasaba zaroor karein."},{"r":"65:3","ar":"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ ۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍۢ قَدْرًۭا","s":"At-Talaaq","m":"Jo Allah par bharosa kare, Allah use kaafi hai.","a":"Aaj ek fikr par \"Hasbiyallah\" padh kar bharosa karein."},{"r":"93:11","ar":"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","s":"Ad-Dhuhaa","m":"Apne Rab ki naimat ka zikr karo.","a":"Aaj kisi ko batayein Allah ne aap par kya ehsaan kiya."},{"r":"94:5","ar":"فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","s":"Ash-Sharh","m":"Beshak mushkil ke saath aasaani hai.","a":"Aaj kisi pareshan dost ko ye ayat suna kar hausla dein."},{"r":"103:3","ar":"إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ","s":"Al-Asr","m":"Siwaye un ke jo imaan laaye, nek amal kiye, haq aur sabr ki talqeen ki.","a":"Aaj kisi ko pyaar se ek neki ki yaad dihaani karein."},{"r":"2:43","ar":"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱرْكَعُوا۟ مَعَ ٱلرَّٰكِعِينَ","s":"Al-Baqara","m":"Namaz qaaim karo, zakat do aur rukoo karne walon ke saath rukoo karo.","a":"Aaj kam az kam ek namaz jamaat ke saath padhein."},{"r":"33:56","ar":"إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا","s":"Al-Ahzaab","m":"Allah aur uske farishte Nabi ﷺ par durood bhejte hain — tum bhi durood o salam bhejo.","a":"Aaj 100 dafa durood padhein."},{"r":"18:10","ar":"إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا","s":"Al-Kahf","m":"Ae Rab! Hamein apne paas se rehmat de aur hamare kaam mein hidayat muhayya kar.","a":"Aaj kisi faisle se pehle ye dua padhein."}],"neki":["Kisi bhooke ko khaana khilayein","Walidain ko phone karein ya unke paas baithein","Chhota sa sadqa dein — 10 rupay bhi","Kisi ko pyaas mein paani pilayein","Ghar walon ke liye chai/khaana banayein","Kisi bimar ka haal poochein","Kisi ki tareef karein jo sachchi ho","Masjid ya mohalle ki safai mein hissa","Parindon ke liye paani/daana rakhein","Kisi ka qarz ya bill ada karne mein madad","Chhote bachon ko ek kahani-e-Nabi sunayein","Kisi rishtedaar se jo naraaz hai sulah ki koshish","Kisi ko Quran ki ek ayat sikhayein","Kisi buzurg ka kaam kar dein","Apne kapray/cheezein jo istemal nahi, donate karein","Kisi ke liye dil se dua karein (bina bataye)","Raaste se kaanta/patthar hatayein","Kisi ko maaf kar dein","Ghar mein bachon/biwi/shohar ka shukriya ada karein","Kisi student ki padhai mein madad","Kisi naukar/mazdoor ko waqt par aur achi tarah ujrat dein","Ek ghanta phone se door reh kar family ko waqt dein","Kisi ko khana bhej dein — padosi pehle","Kisi ke aib par parda daalein","Mehmaan ki khidmat","Kisi pareshan ko hausla dein","Kisi yateem ki madad ya kafalat ki niyyat","Jumma ko kisi ko masjid saath le jaayein","Kisi se maafi maang lein jis ka dil dukhaya","Ghar mein ek saath namaz ya taleem ka halqa"]};

":"ماذا كان القوم يعبدون؟","k.s.ibrahim.q1o":"أصنامًا من حجارة|الشمس|الأشجار","k.s.ibrahim.q2":"أي صنم ترك إبراهيم عليه السلام؟","k.s.ibrahim.q2o":"أصغرها|أكبرها|لا شيء","k.s.ibrahim.q3":"ماذا حدث للنار؟","k.s.ibrahim.q3o":"ازدادت حرارة|صارت بردًا وسلامًا|لم يحدث شيء","k.s.yusuf.t":"عفو يوسف عليه السلام","k.s.yusuf.b":"ألقى إخوة يوسف عليه السلام أخاهم في بئر حسدًا.|فأخذته قافلة إلى مصر، ولقي هناك شدائد كثيرة حتى السجن، لكنه بقي صابرًا صادقًا.|فأكرمه الله وصار أمينًا على خزائن مصر.|وبعد سنين جاء القحط، وجاءه إخوته أنفسهم يطلبون الطعام.|كان يستطيع أن ينتقم، لكنه قال: ﴿لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ﴾","k.s.yusuf.m":"العفو مع القدرة على الانتقام من أعظم الحسنات.","k.s.yusuf.q1":"أين ألقى الإخوة يوسف عليه السلام؟","k.s.yusuf.q1o":"في بئر|في نهر|في غابة","k.s.yusuf.q2":"ماذا فعل في الشدائد؟","k.s.yusuf.q2o":"صبر وبقي صادقًا|اشتكى|تشاجر","k.s.yusuf.q3":"ماذا فعل عندما جاء إخوته؟","k.s.yusuf.q3o":"انتقم منهم|عفا عنهم|أعادهم","k.s.musa.t":"موسى عليه السلام والبحر","k.s.musa.b":"كان فرعون ملكًا ظالمًا يظلم بني إسرائيل.|وبأمر الله خرج موسى عليه السلام بقومه ليلًا.|كان البحر أمامهم وجيش فرعون خلفهم، فخاف الناس وقالوا: «إنا لمُدرَكون!»|فقال موسى عليه السلام بيقين: ﴿كَلَّا إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ﴾|فأمره الله أن يضرب البحر بعصاه — فانفلق البحر وظهر طريق يابس في وسطه.|فعبروا جميعًا بسلام.","k.s.musa.m":"حتى لو بدت كل الطرق مغلقة، توكّل على الله.","k.s.musa.q1":"من كان يلحق بهم من الخلف؟","k.s.musa.q1o":"جيش فرعون|أسد|عاصفة","k.s.musa.q2":"ماذا قال موسى عليه السلام؟","k.s.musa.q2o":"لقد أُدركنا|إن معي ربي|لنرجع","k.s.musa.q3":"ماذا حدث للبحر؟","k.s.musa.q3o":"تجمّد وصار جليدًا|ظهر في وسطه طريق يابس|لم يحدث شيء","k.s.bilal.t":"ثبات بلال رضي الله عنه","k.s.bilal.b":"كان بلال رضي الله عنه عبدًا في مكة.|فلما أسلم عذّبه سيده عذابًا شديدًا — ألقاه على الرمل الحار ووضع عليه صخرة ثقيلة.|وكان في كل ذلك يقول: «أحدٌ أحد!» — الله واحد!|فاشتراه أبو بكر رضي الله عنه وأعتقه.|وفيما بعد اختاره النبي ﷺ للأذان، فكان الأذان يعلو بصوته الندي.","k.s.bilal.m":"اثبت على ূজা করত।|তিনি ভালোবেসে বোঝালেন, এই মূর্তিগুলো শুনতেও পারে না, উপকারও করতে পারে না।|একদিন সবাই বাইরে গেলে তিনি মূর্তিগুলো ভেঙে দিলেন, শুধু সবচেয়ে বড়টা রেখে দিলেন।|লোকেরা জিজ্ঞেস করলে বললেন: “এই বড়টাকেই জিজ্ঞেস করো, যদি এরা কথা বলে!” তারা বুঝল মূর্তি কিছুই পারে না, তবুও জেদ ধরে রইল।|তারা ইবরাহীম (আ.)-কে আগুনে ফেলে দিল।|আল্লাহ আদেশ দিলেন: “হে আগুন! ইবরাহীমের জন্য শীতল ও নিরাপদ হয়ে যাও।” আর তিনি পুরোপুরি নিরাপদ রইলেন।","k.s.ibrahim.m":"শুধু আল্লাহর ইবাদত করো, আর সাহসের সাথে সত্যে অটল থাকো — আল্লাহ রক্ষা করেন।","k.s.ibrahim.q1":"লোকেরা কীসের পূজা করত?","k.s.ibrahim.q1o":"পাথরের মূর্তির|সূর্যের|গাছের","k.s.ibrahim.q2":"ইবরাহীম (আ.) কোন মূর্তিটি রেখে দিলেন?","k.s.ibrahim.q2o":"সবচেয়ে ছোটটা|সবচেয়ে বড়টা|কোনোটাই না","k.s.ibrahim.q3":"আগুনের কী হলো?","k.s.ibrahim.q3o":"আরও গরম হলো|শীতল ও নিরাপদ হয়ে গেল|কিছুই হলো না","k.s.yusuf.t":"ইউসুফ (আ.)-এর ক্ষমা","k.s.yusuf.b":"হিংসা করে ইউসুফ (আ.)-এর ভাইয়েরা তাঁকে একটি কূপে ফেলে দিল।|একটি কাফেলা তাঁকে মিসরে নিয়ে গেল। সেখানে অনেক কষ্ট এলো, এমনকি জেলেও যেতে হলো, কিন্তু তিনি ধৈর্য আর সততায় অটল রইলেন।|আল্লাহ তাঁকে সম্মান দিলেন, তিনি মিসরের ভাণ্ডারের দায়িত্বশীল হলেন।|বহু বছর পর দুর্ভিক্ষ এলো, আর সেই ভাইয়েরাই খাদ্য নিতে তাঁর কাছে এলো।|ইউসুফ (আ.) প্রতিশোধ নিতে পারতেন, কিন্তু বললেন: “আজ তোমাদের প্রতি কোনো অভিযোগ নেই। আল্লাহ তোমাদের ক্ষমা করুন।”","k.s.yusuf.m":"প্রতিশোধের ক্ষমতা থাকলেও ক্ষমা করা অনেক বড় নেকি।","k.s.yusuf.q1":"ভাইয়েরা ইউসুফ (আ.)-কে কোথায় ফেলেছিল?","k.s.yusuf.q1o":"কূপে|নদীতে|জঙ্গলে","k.s.yusuf.q2":"কষ্টের সময় তিনি কী করলেন?","k.s.yusuf.q2o":"ধৈর্য ধরলেন ও সত্যে রইলেন|অভিযোগ করলেন|ঝগড়া করলেন","k.s.yusuf.q3":"ভাইয়েরা এলে তিনি কী করলেন?","k.s.yusuf.q3o":"প্রতিশোধ নিলেন|ক্ষমা করে দিলেন|ফেরত পাঠালেন","k.s.musa.t":"মূসা (আ.) আর সাগর","k.s.musa.b":"ফেরাউন ছিল এক জালিম রাজা, যে বনি ইসরাঈলের উপর জুলুম করত।|আল্লাহর আদেশে মূসা (আ.) রাতে তাঁর জাতিকে নিয়ে বের হলেন।|সামনে সাগর আর পেছনে ফেরাউনের বাহিনী। লোকেরা ভয়ে বলল: “আমরা তো ধরা পড়ে গেলাম!”|মূসা (আ.) পূর্ণ বিশ্বাসে বললেন: “কখনো না! আমার রব আমার সাথে আছেন, তিনি আমাকে পথ দেখাবেন।”|আল্লাহ বললেন সাগরে লাঠি দিয়ে আঘাত করতে — সাগর ভাগ হয়ে মাঝখানে শুকনো পথ তৈরি হলো।|সবাই নিরাপদে পার হয়ে গেল।","k.s.musa.m":"সব পথ বন্ধ মনে হলেও আল্লাহর উপর ভরসা রাখো।","k.s.musa.q1":"পেছন থেকে কে আসছিল?","k.s.musa.q1o":"ফেরাউনের বাহিনী|একটি সিংহ|ঝড়","k.s.musa.q2":"মূসা (আ.) কী বললেন?","k.s.musa.q2o":"আমরা ধরা পড়লাম|আমার রব আমার সাথে আছেন|ফিরে চলো","k.s.musa.q3":"সাগরের কী হলো?","k.s.musa.q3o":"জমে বরফ হয়ে গেল|মাঝখানে শুকনো পথ তৈরি হলো|কিছুই হলো না","k.s.bilal.t":"বিলাল (রা.)-এর দৃঢ়তা","k.s.bilal.b":"বিলাল (রা.) মক্কায় একজন দাস ছিলেন।|ইসলাম গ্রহণ করলে তাঁর মালিক তাঁকে কঠিন কষ্ট দিল — গরম বালুতে শুইয়ে বুকে ভারী পাথর চাপা দিল।|প্রতিটি কষ্টে তিনি শুধু বলতেন: “আহাদ, আহাদ!” — আল্লাহ এক!|আবু বকর (রা.) তাঁকে কিনে মুক্ত করে দিলেন।|পরে নবী ﷺ তাঁকে আজান দেওয়ার জন্য বেছে নিলেন — তাঁর উঁচু কণ্ঠে আজান ধ্বনিত হতো।","k.s.bilal.m":"কঠিন হলেও ঈমানে দৃঢ় থাকো।","k.s.bilal.q1":"কষ্টের সময় বিলাল (রা.) কী বলতেন?","k.s.bilal.q1o":"আহাদ, আহাদ|বাঁচাও|কিছুই বলতেন না","k.s.bilal.q2":"কে তাঁকে মুক্ত করলেন?","k.s.bilal.q2o":"আবু বকর (রা.)|একজন ব্যবসায়ী|তাঁর মালিক নিজেই","k.s.bilal.q3":"পরে নবী ﷺ তাঁকে কোন কাজের জন্য বেছে নিলেন?","k.s.bilal.q3o":"ব্যবসা|আজান দেওয়া|চাষাবাদ","k.s.guest.t":"নিভানো প্রদীপ আর মেহমান","k.s.guest.b":"একবার নবী ﷺ-এর কাছে এক ক্ষুধার্ত মেহমান এলেন।|একজন আনসারী সাহাবী তাঁকে বাড়ি নিয়ে গেলেন, কিন্তু ঘরে শুধু বাচ্চাদের মতো খাবার ছিল।|তাঁরা আদর করে বাচ্চাদের ঘুম পাড়ালেন আর খাবারের সময় প্রদীপ নিভিয়ে দিলেন, যেন মেহমান ভাবেন তাঁরাও খাচ্ছেন।|মেহমান পেট ভরে খেলেন, আর ঘরের লোকেরা ক্ষুধার্ত ঘুমালেন।|সকালে নবী ﷺ জানালেন, আল্লাহ তাঁদের কাজে খুব খুশি হয়েছেন, আর কুরআনের আয়াত নাযিল হলো: “তারা নিজেদের প্রয়োজন থাকলেও অন্যদের অগ্রাধিকার দেয়।”","k.s.guest.m":"নিজের আগে অন্যের খেয়াল রাখা আল্লাহর কাছে খুব প্রিয়।","k.s.guest.q1":"ঘরে কতটুকু খাবার ছিল?","k.s.guest.q1o":"অনেক বেশি|শুধু বাচ্চাদের মতো|একদমই না","k.s.guest.q2":"তাঁরা প্রদীপ কেন নিভিয়েছিলেন?","k.s.guest.q2o":"ঘুমানোর জন্য|যেন মেহমান আরামে পেট ভরে খান|তেল বাঁচাতে","k.s.guest.q3":"আল্লাহ কী করলেন?","k.s.g show mercy.","k.s.camel.t":"The crying camel","k.s.camel.b":"Once our Prophet ﷺ went into a garden.|There was a camel there that began to cry when it saw him.|The Prophet ﷺ gently stroked its head and it became calm.|Then he told the camel's owner: fear Allah about this animal, do not keep it hungry and do not overwork it.","k.s.camel.m":"Animals are Allah's creation too — be gentle with them.","k.s.ibrahim.t":"Prophet Ibrahim (AS) and the fire","k.s.ibrahim.b":"The people of Prophet Ibrahim (AS) worshipped idols made of stone.|He kindly explained that idols can neither hear nor help anyone.|One day, when the people went out, he broke the idols and left only the biggest one.|When they asked, he said: “Ask this big one, if they can speak!” They understood the idols could do nothing, but they stayed stubborn.|They threw Prophet Ibrahim (AS) into a fire.|Allah commanded: “O fire! Be cool and safe for Ibrahim.” And he was completely safe.","k.s.ibrahim.m":"Worship Allah alone and stand firmly for the truth — Allah protects.","k.s.ibrahim.q1":"What did the people worship?","k.s.ibrahim.q1o":"Stone idols|The sun|Trees","k.s.ibrahim.q2":"Which idol did Prophet Ibrahim (AS) leave?","k.s.ibrahim.q2o":"The smallest|The biggest|None","k.s.ibrahim.q3":"What happened to the fire?","k.s.ibrahim.q3o":"It got even hotter|It became cool and safe|Nothing happened","k.s.yusuf.t":"Prophet Yusuf (AS) forgives","k.s.yusuf.b":"Out of jealousy, Prophet Yusuf's (AS) brothers threw him into a well.|A caravan took him to Egypt. He faced many hardships there, even prison, but he stayed patient and truthful.|Allah honoured him and he became the keeper of Egypt's stores.|Years later there was a famine, and the same brothers came to him for grain.|Prophet Yusuf (AS) could have taken revenge, but he said: “No blame on you today. May Allah forgive you.”","k.s.yusuf.m":"Forgiving, even when you could take revenge, is a very great good deed.","k.s.yusuf.q1":"Where did the brothers throw Prophet Yusuf (AS)?","k.s.yusuf.q1o":"Into a well|Into a river|Into a forest","k.s.yusuf.q2":"What did he do in hard times?","k.s.yusuf.q2o":"Stayed patient and truthful|Complained|Fought","k.s.yusuf.q3":"What did he do when the brothers came?","k.s.yusuf.q3o":"Took revenge|Forgave them|Sent them back","k.s.musa.t":"Prophet Musa (AS) and the sea","k.s.musa.b":"Pharaoh was a cruel king who treated the Children of Israel unjustly.|By Allah's command, Prophet Musa (AS) left at night with his people.|The sea was in front and Pharaoh's army was behind. The people panicked: “We will be caught!”|Prophet Musa (AS) said with full certainty: “Never! My Lord is with me; He will guide me.”|Allah told him to strike the sea with his staff — the sea split and a dry path appeared in the middle.|Everyone crossed safely.","k.s.musa.m":"Even when every way seems closed, trust Allah.","k.s.musa.q1":"Who was coming from behind?","k.s.musa.q1o":"Pharaoh's army|A lion|A storm","k.s.musa.q2":"What did Prophet Musa (AS) say?","k.s.musa.q2o":"We are caught|My Lord is with me|Let's go back","k.s.musa.q3":"What happened to the sea?","k.s.musa.q3o":"It froze into ice|A dry path opened in the middle|Nothing happened","k.s.bilal.t":"The strength of Bilal (RA)","k.s.bilal.b":"Bilal (RA) was a slave in Makkah.|When he accepted Islam, his master hurt him badly — he made him lie on hot sand and put a heavy rock on him.|Through all the pain he kept saying: “Ahad, Ahad!” — Allah is One!|Abu Bakr (RA) bought him and set him free.|Later the Prophet ﷺ chose him to call the adhan — the adhan rang out in his strong voice.","k.s.bilal.m":"Hold firmly to your faith, even when it is hard.","k.s.bilal.q1":"What did Bilal (RA) say when he was hurt?","k.s.bilal.q1o":"Ahad, Ahad|Help me|He said nothing","k.s.bilal.q2":"Who set him free?","k.s.bilal.q2o":"Abu Bakr (RA)|A trader|His own master","k.s.bilal.q3":"What job did the Prophet ﷺ later choose him for?","k.s.bilal.q3o":"Trading|Calling the adhan|Farming","k.s.guest.t":"The lamp that was put out","k.s.guest.b":"Once a hungry guest came to the Prophet ﷺ.|One of the Ansar Sahaba took him home, but there was only enough food for the children.|They lovingly put the children to sleep and put out the lamp at mealtime, so the guest would think they were eating too.|The guest ate until he was full, and the family slept hungry.|In the morning the Prophet ﷺ said that Allah was very pleased with what they did, and a verse of the Quran came down: “They prefer others over themselves, even when they are in need.”","k.s.guest.m":"Putting others before yourself is very beloved to Allah.","k.s.guest.q1":"How much food was in the house?","k.s.guest.q1o":"Lots|Only enough for the children|None at all","k.s.guest.q2":"Why did they put out the lamp?","k.s.guest.q2o":"To go to sleep|So the guest could eat his fill comfortably|To save oil","k.s.guest.q3":"What did Allah do?","k.s.guest.q3o":"Nothing|He was pleased and sent down a verse|He sent another guest","k.s.kab.t":"The truthfulness of Ka'b (RA)","k.s.kab.b":"Ka'b ibn Malik (RA) stayed behind from a journey (the expedition of Tabuk) without any excuse.|When the Prophet ﷺ returned, some people made up false excuses.|Ka'b (RA) thought: I will not lie. He honestly said that he had no excuse.|For a while things were very hard for him, but he kept patiently repenting.|Then Allah announced in the Quran that his repentance was accepted. He said: “Allah saved me because of the truth.”","k.s.kab.m":"Tell the truth, even when it feels hard — truth leads to success.","k.s.kab.q1":"What did Ka'b (RA) do?","k.s.kab.q1o":"Made a false excuse|Honestly told the truth|Hid away","k.s.kab.q2":"What did he do in the hard time?","k.s.kab.q2o":"Was patient and repented|Got angry|Left the city","k.s.kab.q3":"What happened in the end?","k.s.kab.q3o":"Allah accepted his repentance|Nothing happened|Everyone forgot","k.goalH":"My reward","k.goalReady":"Your reward is ready! Tell Mum and Dad 🎉","k.goalProg":"{a} / {b} ⭐ — you can di mana-mana.|Semua yang taat kepada Allah dan naik ke kapal, bersama pasangan-pasangan hewan, selamat.","k.s.nuh.m":"Taat kepada Allah selalu baik.","k.s.yunus.t":"Nabi Yunus (AS) dan ikan besar","k.s.yunus.b":"Nabi Yunus (AS) jatuh dari kapal ke laut.|Seekor ikan besar menelannya.|Dalam gelapnya perut ikan, beliau berdoa kepada Allah: “La ilaha illa Anta, Subhanaka, inni kuntu minazh-zhalimin.”|Allah mendengar doanya dan mengeluarkannya dengan selamat.","k.s.yunus.m":"Ingatlah Allah saat kesulitan — Dia selalu mendengar.","k.s.naml.t":"Nabi Sulaiman (AS) dan semut kecil","k.s.naml.b":"Nabi Sulaiman (AS) sedang berjalan bersama pasukannya.|Seekor semut kecil berkata: “Wahai semut! Masuklah ke sarangmu agar tidak terinjak!”|Nabi Sulaiman (AS) mendengarnya, tersenyum, dan bersyukur kepada Allah.|Beliau sama sekali tidak menyakiti semut-semut itu.","k.s.naml.m":"Sayangi makhluk sekecil apa pun, dan bersyukurlah kepada Allah.","k.s.dog.t":"Anjing yang haus dan air","k.s.dog.b":"Nabi kita ﷺ menceritakan sebuah kisah.|Seorang laki-laki sangat haus di perjalanan; ia turun ke sumur dan minum.|Saat naik, ia melihat seekor anjing menjilati tanah basah karena sangat haus.|Ia mengisi sepatunya dengan air dan memberi anjing itu minum. Allah sangat menyukainya hingga mengampuni orang itu.","k.s.dog.m":"Sayangi hewan — Allah mencintai orang yang penyayang.","k.s.camel.t":"Unta yang menangis","k.s.camel.b":"Suatu hari Nabi kita ﷺ masuk ke sebuah kebun.|Di sana ada seekor unta yang menangis saat melihat beliau.|Nabi ﷺ mengusap kepalanya dengan lembut, lalu unta itu tenang.|Kemudian beliau berkata kepada pemiliknya: bertakwalah kepada Allah tentang hewan ini, jangan biarkan ia lapar dan jangan bebani dengan kerja berlebihan.","k.s.camel.m":"Hewan juga ciptaan Allah — perlakukan mereka dengan lembut.","k.s.ibrahim.t":"Nabi Ibrahim (AS) dan api","k.s.ibrahim.b":"Kaum Nabi Ibrahim (AS) menyembah berhala dari batu.|Beliau menjelaskan dengan lembut bahwa berhala tidak bisa mendengar dan tidak bisa memberi manfaat.|Suatu hari saat orang-orang pergi, beliau menghancurkan berhala-berhala dan hanya menyisakan yang paling besar.|Ketika ditanya, beliau berkata: “Tanyakan saja kepada yang besar ini, kalau mereka bisa bicara!” Mereka sadar berhala tidak bisa apa-apa, tetapi tetap keras kepala.|Mereka melemparkan Nabi Ibrahim (AS) ke dalam api.|Allah berfirman: “Wahai api! Jadilah dingin dan keselamatan bagi Ibrahim.” Dan beliau selamat sepenuhnya.","k.s.ibrahim.m":"Sembahlah hanya Allah dan teguhlah di atas kebenaran — Allah melindungi.","k.s.ibrahim.q1":"Apa yang disembah kaumnya?","k.s.ibrahim.q1o":"Berhala dari batu|Matahari|Pohon","k.s.ibrahim.q2":"Berhala mana yang disisakan Nabi Ibrahim (AS)?","k.s.ibrahim.q2o":"Yang paling kecil|Yang paling besar|Tidak ada","k.s.ibrahim.q3":"Apa yang terjadi pada api?","k.s.ibrahim.q3o":"Makin panas|Menjadi dingin dan selamat|Tidak terjadi apa-apa","k.s.yusuf.t":"Nabi Yusuf (AS) memaafkan","k.s.yusuf.b":"Karena iri, saudara-saudara Nabi Yusuf (AS) melemparkannya ke dalam sumur.|Sebuah kafilah membawanya ke Mesir. Di sana banyak kesulitan, bahkan penjara, tetapi beliau tetap sabar dan jujur.|Allah memuliakannya dan beliau menjadi penjaga perbendaharaan Mesir.|Bertahun-tahun kemudian terjadi paceklik, dan saudara-saudara itu datang kepadanya meminta bahan makanan.|Nabi Yusuf (AS) bisa saja membalas, tetapi beliau berkata: “Tidak ada celaan atas kalian hari ini. Semoga Allah mengampuni kalian.”","k.s.yusuf.m":"Memaafkan saat mampu membalas adalah kebaikan yang sangat besar.","k.s.yusuf.q1":"Ke mana saudara-saudaranya melempar Nabi Yusuf (AS)?","k.s.yusuf.q1o":"Ke sumur|Ke sungai|Ke hutan","k.s.yusuf.q2":"Apa yang beliau lakukan saat kesulitan?","k.s.yusuf.q2o":"Sabar dan tetap jujur|Mengeluh|Bertengkar","k.s.yusuf.q3":"Apa yang beliau lakukan saat saudaranya datang?","k.s.yusuf.q3o":"Membalas|Memaafkan mereka|Mengusir mereka","k.s.musa.t":"Nabi Musa (AS) dan laut","k.s.musa.b":"Fir'aun adalah raja zalim yang menindas Bani Israil.|Dengan perintah Allah, Nabi Musa (AS) pergi malam hari bersama kaumnya.|Di depan ada laut dan di belakang pasukan Fir'aun. Orang-orang panik: “Kita pasti tertangkap!”|Nabi Musa (AS) berkata dengan yakin: “Sekali-kali tidak! Rabbku bersamaku, Dia akan memberiku petunjuk.”|Allah memerintahkannya memukul laut dengan tongkatnya — laut terbelah dan muncul jalan kering di tengahnya.|Semua menyeberang dengan selamat.","k.s.musa.m":"Saat semua jalan terasa tertutup, tetaplah bertawakal kepada Allah.","k.s.musa.q1":"Siapa yang mengejar dari belakang?","k.s.musa.q1o":"Pasukan Fir'aun|Seekor singa|Badai","k.s.musa.q2":"Apa yang dikatakan Nabi Musa (AS)?","k.s.musa.q2o":"Kita tertangkap|Rabbku bersamaku|Ayo kembali","k.s.musa.q3":"Apa yang terjadi pada laut?","k.s.musa.q3o":"Membeku jadi es|Muncul jalan kering di tengahnya|Tidak terjadi apa-apa","k.s.bilal.t":"Keteguhan Bilal (RA)","k.s.bilal.b":"Bilal (RA) adalah seorang budak di Makkah.|Ketika masuk Islam, tuannya menyiksanya dengan berat — menjemurnya di pasir panas dan menindihnya dengan batu besar.|Dalam semua siksaan itu ia terus berkata: “Ahad, Ahad!” — Allah Maha Esa!|Abu Bakar (RA) membelinya lalu memerdekakannya.|Kemudian Nabi ﷺ memilihnya untuk mengumandangkan azan — azan bergema dengan suaranya yang lantang.","k.s.bilal.m":"Teguhlah dalam iman, walaupun sulit.","k.s.bilal.q1":"Apa yang diucapkan Bilal (RA) saat disiksa?","k.s.bilal.q1o":"Ahad, Ahad|Tolong aku|Tidak berkata apa-apa","k.s.bilal.q2":"Siapa yang memerdekakannya?","k.s.bilal.q2o":"Abu Bakar (RA)|Seorang pedagang|Tuannya sendiri","k.s.bilal.q3":"Untuk tugas apa Nabi ﷺ kemudian memilihnya?","k.s.bilal.q3o":"Berdagang|Mengumandangkan azan|Bertani","k.s.guest.t":"Lampu yang dipadamkan dan tamu","k.s.guest.b":"Suatu hari seorang tamu yang lapar datang kepada Nabi ﷺ.|Seorang Sahabat Anshar membawanya pulang, tetapi di rumah hanya ada makanan untuk anak-anak.|Mereka menidurkan anak-anak dengan lembut dan memadamkan lampu saat makan, agar tamu mengira mereka ikut makan.|Tamu itu makan sampai kenyang, dan keluarga itu tidur dalam keadaan lapar.|Pagi harinya Nabi ﷺ berkata bahwa Allah sangat ridha dengan perbuatan mereka, dan turun ayat Al-Qur'an: “Mereka mengutamakan orang lain atas diri mereka sendiri, meskipun mereka membutuhkan.”","k.s.guest.m":"Mendahulukan orang lain (itsar) sangat dicintai Allah.","k.s.guest.q1":"Berapa banyak makanan di rumah?","k.s.guest.q1o":"Banyak sekali|Hanya untuk anak-anak|Tidak ada sama sekali","k.s.guest.q2":"Mengapa mereka memadamkan lampu?","k.s.guest.q2o":"Untuk tidur|Agar tamu makan sampai kenyang dengan nyaman|Untuk menghemat minyak","k.s.guest.q3":"Apa yang Allah lakukan?","k.s.guest.q3o":"Tidak ada|Ridha dan menurunkan ayat|Mengirim tamu lain","k.s.kab.t":"Kejujuran Ka'ab (RA)","k.s.kab.b":"Ka'ab bin Malik (RA) tertinggal dari sebuah perjalanan (Perang Tabuk) tanpa uzur.|Ketika Nabi ﷺ kembali, sebagian orang membuat alasan palsu.|Ka'ab (RA) berpikir: aku tidak akan berbohong. Ia berterus terang bahwa ia tidak punya uzur.|Beberapa waktu terasa sangat berat baginya, tetapi ia terus bertaubat dengan sabar.|Lalu Allah mengumumkan dalam Al-Qur'an bahwa taubatnya diterima. Ia berkata: “Allah menyelamatkanku karena kejujuran.”","k.s.kab.m":"Berkatalah jujur walaupun terasa berat — kejujuran membawa kepada keberhasilan.","k.s.kab.q1":"Apa yang dilakukan Ka'ab (RA)?","k.s.kab.q1o":"Membuat alasan palsu|Berterus terang dengan jujur|Bersembunyi","k.s.kab.q2":"Apa yang ia lakukan di masa sulit?","k.s.kab.q2o":"Sabar dan bertaubat|Marah|Meninggalkan kota","k.s.kab.q3":"Apa yang terjadi pada akhirnya?","k.s.kab.q3o":"Allah menerima taubatnya|Tidak terjadi apa-apa|Semua orang lupa","k.goalH":"Hadiahku","k.goalReady":"Hadiahmu sudah siap! Beri tahu Ibu dan Ayah 🎉","k.goalProg":"{a} / {b} ⭐ — kamu pasti bisa!","k.stickersH":"Stikerku","k.badgesH":"Lencanaku","k.bd.first.t":"Bintang pertama","k.bd.first.d":"Mendapat ⭐ pertama","k.bd.d7.t":"Perjalanan 7 hari","k.bd.d7.d":"Kebaikan 7 hari ber m se (shuru karta hoon).","k.du.khana2":"Shukr hai Allah ka jis ne mujhe ye khana khilaya aur diya, meri apni taqat ke baghair.","k.du.cheenk":"Sab tareef Allah ke liye hai.","k.du.sona":"Aye Allah! Tere naam ke saath main sota hoon aur jaagta hoon.","k.du.neend":"Shukr hai Allah ka jis ne humein neend ke baad dobara jagaya, aur usi ki taraf laut kar jaana hai.","k.du.bath1":"Allah ke naam se. Aye Allah! Main gandi aur buri cheezon se teri panah maangta hoon.","k.du.bath2":"Aye Allah! Main teri maafi chahta hoon.","k.du.nikalna":"Allah ke naam se, maine Allah par bharosa kiya; har taqat Allah hi se hai.","k.du.jazak":"Allah tumhein iska acha badla de! (Shukriya kehne ka sab se acha tareeqa)","k.du.ilm":"Aye mere Rab! Mera ilm barha de.","k.du.walidain":"Aye mere Rab! Mere Ammi Abbu par reham farma, jaise unhon ne mujhe bachpan mein pyar se pala.","k.storiesHint":"Kahani parho ya suno, aur sabaq yaad rakho 🌟","k.moral":"Sabaq","k.readBtn":"Kahani parh li ✓","k.readDone":"Parh li — MashaAllah!","k.quizH":"Chhota sa quiz 🧠","k.right":"Bilkul sahi! 🌟","k.tryAgain":"Koi baat nahi! Ek aur dafa socho 🙂","k.quizScore":"MashaAllah! Pehli koshish mein {n}/3 sahi ⭐","k.noImg":"Nabiyon aur Sahaba ki tasveerein nahi banayi jaatin — sirf kahani aur sabaq.","k.alim":"Kahaniyan aur duain Quran aur sahih ahadees se li gayi hain — kisi alim se tasdeeq karein.","k.s.nuh.t":"Nabi Nuh (AS) ki kashti","k.s.nuh.b":"Nabi Nuh (AS) bohat saal tak logon ko pyar se Allah ki taraf bulate rahe.|Allah ne unhein ek bari kashti banane ka hukm diya.|Phir bohat baarish aayi aur har taraf paani hi paani ho gaya.|Jo log Allah ki baat maan kar kashti mein baithe, aur janwaron ke jode bhi, sab mehfooz rahe.","k.s.nuh.m":"Allah ki baat maanna hamesha acha hota hai.","k.s.yunus.t":"Nabi Yunus (AS) aur bari machhli","k.s.yunus.b":"Nabi Yunus (AS) ek kashti se samandar mein gir gaye.|Ek bari machhli ne unhein nigal liya.|Machhli ke pait ke andhere mein unhon ne Allah ko pukara: “La ilaha illa Anta, Subhanaka, inni kuntu minaz-zalimeen.”|Allah ne unki dua suni aur unhein mehfooz bahar nikaal diya.","k.s.yunus.m":"Mushkil mein Allah ko yaad karo — woh hamesha sunta hai.","k.s.naml.t":"Nabi Sulaiman (AS) aur nanhi cheenti","k.s.naml.b":"Nabi Sulaiman (AS) apne lashkar ke saath ja rahe the.|Ek nanhi cheenti ne kaha: “Cheentiyo! Apne gharon mein chali jao, kahin kuchli na jao!”|Nabi Sulaiman (AS) uski baat sun kar muskuraye aur Allah ka shukr ada kiya.|Unhon ne cheentiyon ko koi nuqsan nahi pahunchaya.","k.s.naml.m":"Chhote se chhote janwar ka bhi khayal rakho, aur Allah ka shukr karo.","k.s.dog.t":"Pyasa kutta aur paani","k.s.dog.b":"Hamare Nabi ﷺ ne ek kahani sunayi.|Ek aadmi ko raste mein bohat pyaas lagi; usne kunwein mein utar kar paani piya.|Bahar aaya to dekha ke ek kutta pyaas se geeli mitti chaat raha hai.|Usne apne mozay mein paani bhar kar kutte ko pilaya. Allah ko ye baat itni pasand aayi ke usne us aadmi ko maaf kar diya.","k.s.dog.m":"Janwaron par reham karo — Allah reham karne walon se pyar karta hai.","k.s.camel.t":"Rota hua oont","k.s.camel.b":"Ek dafa hamare Nabi ﷺ ek baagh mein gaye.|Wahan ek oont tha jo unhein dekh kar rone laga.|Nabi ﷺ ne pyar se uske sar par haath phera to woh chup ho gaya.|Phir unhon ne oont ke maalik se farmaya: is janwar ke baare mein Allah se daro, ise bhooka na rakho aur is se zyada kaam na lo.","k.s.camel.m":"Janwar bhi Allah ki makhlooq hain — unke saath narmi karo.","k.s.ibrahim.t":"Nabi Ibrahim (AS) aur aag","k.s.ibrahim.b":"Nabi Ibrahim (AS) ki qaum patthar ke buton ki pooja karti thi.|Unhon ne pyar se samjhaya ke ye but na sun sakte hain, na faida de sakte hain.|Ek din jab log bahar gaye, unhon ne buton ko tod diya aur sirf sab se bada but chhod diya.|Logon ne poocha to farmaya: “Isi bade se poochh lo, agar ye bolte hain!” Log samajh gaye ke but kuch nahi kar sakte, phir bhi ziddi rahe.|Unhon ne Nabi Ibrahim (AS) ko aag mein daal diya.|Allah ne hukm diya: “Aye aag! Ibrahim par thandi aur salamati wali ban ja.” Aur woh bilkul mehfooz rahe.","k.s.ibrahim.m":"Sirf Allah ki ibadat karo aur sach par himmat se qaim raho — Allah hifazat karta hai.","k.s.ibrahim.q1":"Log kis ki pooja karte the?","k.s.ibrahim.q1o":"Patthar ke buton ki|Sooraj ki|Darakhton ki","k.s.ibrahim.q2":"Nabi Ibrahim (AS) ne kaun sa but chhoda?","k.s.ibrahim.q2o":"Sab se chhota|Sab se bada|Koi nahi","k.s.ibrahim.q3":"Aag ka kya hua?","k.s.ibrahim.q3o":"Aur garam ho gayi|Thandi aur salamati wali ban gayi|Kuch nahi hua","k.s.yusuf.t":"Nabi Yusuf (AS) ki maafi","k.s.yusuf.b":"Nabi Yusuf (AS) ke bhaiyon ne hasad mein unhein ek kunwein mein daal diya.|Ek qafila unhein Misr le gaya. Wahan bohat mushkilein aayin, yahan tak ke jail bhi jaana pada, magar woh sabr aur sachai par qaim rahe.|Allah ne unhein izzat di aur woh Misr ke khazanon ke nigraan ban gaye.|Saalon baad qahat pada aur wahi bhai ghalla lene unke paas aaye.|Nabi Yusuf (AS) badla le sakte the, magar unhon ne farmaya: “Aaj tum par koi malamat nahi. Allah tumhein maaf kare.”","k.s.yusuf.m":"Badla lene ki taqat ho tab bhi maaf kar dena bohat bari naiki hai.","k.s.yusuf.q1":"Bhaiyon ne Nabi Yusuf (AS) ko kahan daala?","k.s.yusuf.q1o":"Kunwein mein|Darya mein|Jungle mein","k.s.yusuf.q2":"Mushkilon mein unhon ne kya kiya?","k.s.yusuf.q2o":"Sabr kiya aur sach par rahe|Shikayatein kin|Jhagra kiya","k.s.yusuf.q3":"Jab bhai aaye to unhon ne kya kiya?","k.s.yusuf.q3o":"Badla liya|Maaf kar diya|Wapas bhej diya","k.s.musa.t":"Nabi Musa (AS) aur samandar","k.s.musa.b":"Firaun ek zalim badshah tha jo Bani Israel par zulm karta tha.|Allah ke hukm se Nabi Musa (AS) raat ko apni qaum ko le kar nikle.|Aage samandar tha aur peeche Firaun ka lashkar. Log ghabra kar bole: “Hum to pakde gaye!”|Nabi Musa (AS) ne poore yaqeen se kaha: “Hargiz nahi! Mera Rab mere saath hai, woh mujhe raasta dikhayega.”|Allah ne hukm diya ke samandar par apna asa (laathi) maaro — samandar phat gaya aur beech mein sookha raasta ban gaya.|Sab mehfooz paar ho gaye.","k.s.musa.m":"Jab sab raaste band lagein, tab bhi Allah par bharosa rakho.","k.s.musa.q1":"Peeche kaun aa raha tha?","k.s.musa.q1o":"Firaun ka lashkar|Ek sher|Toofan","k.s.musa.q2":"Nabi Musa (AS) ne kya kaha?","k.s.musa.q2o":"Hum pakde gaye|Mera Rab mere saath hai|Wapas chalo","k.s.musa.q3":"Samandar ka kya hua?","k.s.musa.q3o":"Jam kar barf ban gaya|Beech mein sookha raasta ban gaya|Kuch nahi hua","k.s.bilal.t":"Hazrat Bilal (RA) ki mazbooti","k.s.bilal.b":"Hazrat Bilal (RA) Makkah mein ek ghulam the.|Jab unhon ne Islam qubool kiya to unke maalik ne unhein sakht takleefein dein — garam ret par litaya aur upar bhaari patthar rakha.|Woh har takleef mein bas yahi kehte rahe: “Ahad, Ahad!” — Allah ek hai!|Hazrat Abu Bakr (RA) ne unhein khareed kar azad kar diya.|Baad mein Nabi ﷺ ne unhein azaan dene ke liye chuna — unki buland awaaz mein azaan goonjti thi.","k.s.bilal.m":"Imaan par mazbooti se qaim raho, chahe mushkil ho.","k.s.bilal.q1":"Hazrat Bilal (RA) takleef mein kya kehte the?","k.s.bilal.q1o":"Ahad, Ahad|Bachao|Kuch nahi kehte the","k.s.bilal.q2":"Unhein kis ne azad karaya?","k.s.bilal.q2o":"Hazrat Abu Bakr (RA)|Ek tajir ne|Unke maalik ne khud","k.s.bilal.q3":"Baad mein Nabi ﷺ ne unhein kis kaam ke liye chuna?","k.s.bilal.q3o":"Tijarat|Azaan dena|Kheti","k.s.guest.t":"Bujha hua chiragh aur mehmaan","k.s.guest.b":"Ek dafa Nabi ﷺ ke paas ek bhooka mehmaan aaya.|Ek Ansari Sahabi use apne ghar le gaye, magar ghar mein sirf bachon jitna khana tha.|Unhon ne bachon ko pyar se sula diya aur khane ke waqt chiragh bujha diya, taake mehmaan samjhe ke woh bhi kha rahe hain.|Mehmaan ne pet bhar kar khana khaya aur ghar wale bhooke so gaye.|Subah Nabi ﷺ ne bataya ke Allah unke is amal se bohat khush hua, aur Quran ki ayat utri: “Woh doosron ko apne upar tarjeeh dete hain, chahe khud zaroorat mand hon.”","k.s.guest.m":"Doosron ka khayal apne se pehle rakhna Allah ko bohat pasand hai.","k.s.guest.q1":"Ghar mein kitna khana tha?","k.s.guest.q1o":"Bohat zyada|Sirf bachon jitna|Bilkul nahi","k.s.guest.q2":"Unhon ne chiragh ky
