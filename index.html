قبل الطعام","su.2":"البدء بالسلام — فأولى الناس بالله من بدأهم بالسلام","su.3":"لقاء أخيك بوجه طلق — وهو صدقة","su.4":"السواك (خاصة قبل الوضوء والصلاة)","su.5":"ركعتا تحية الوضوء بعد الوضوء","su.6":"النوم على الشقّ الأيمن","su.7":"الوضوء قبل النوم","su.8":"شرب الماء جالسًا على ثلاثة أنفاس","su.9":"البدء باليمنى في لبس النعل واليسرى في خلعه","su.10":"قول «الحمد لله» عند العطاس","su.11":"إجابة المؤذن وقراءة الدعاء بعد الأذان","su.12":"ركعتا سنّة الفجر — خير من الدنيا وما فيها","su.13":"الدعاء لأخيك بظهر الغيب","su.14":"عيادة المريض (أو السؤال عنه بالهاتف)","su.15":"الإهداء — تهادَوا تحابّوا","su.16":"إماطة الأذى عن الطريق","su.17":"لعق الأصابع وتنظيف الصحن بعد الطعام","su.18":"آية الكرسي دبر كل صلاة مكتوبة","su.19":"قبل النوم: قراءة المعوّذات والنفث في الكفّين ومسح الجسد","su.20":"تسبيح فاطمة قبل النوم: 33 سبحان الله، 33 الحمد لله، 34 الله أكبر","su.21":"السكوت أو الجلوس عند الغضب","su.22":"قل خيرًا أو اصمت","su.23":"السلام عند دخول البيت","su.24":"المساعدة في أعمال البيت","su.25":"إكرام الضيف","su.26":"التطيّب","su.27":"صيام الاثنين أو الخميس تطوعًا","su.28":"صلاة الضحى — ركعتان","su.29":"دعاء كفارة المجلس في آخره","su.30":"دعاء الاستيقاظ «الحمد لله الذي أحيانا…»","su.31":"عدم عيب الطعام","su.32":"تقديم الرِّجل اليمنى عند دخول المسجد","su.33":"الإكثار من الصلاة على النبي ﷺ — بكل صلاة عشر رحمات","ay.0":{"m":"اذكروا الله يذكركم، واشكروا له.","a":"خصّص اليوم 5 دقائق للذكر فقط — سبحان الله، الحمد لله."},"ay.1":{"m":"الاستعانة بالصبر والصلاة، والله مع الصابرين.","a":"بدل الشكوى من همٍّ اليوم، صلِّ ركعتين وادعُ."},"ay.2":{"m":"الله قريب يجيب دعوة الداعي إذا دعاه.","a":"ادعُ الله اليوم بلغتك من قلبك."},"ay.3":{"m":"لا يكلّف الله نفسًا إلا وسعها.","a":"فوّض اليوم أحد همومك إلى الله واقرأ دعاء هذه الآية."},"ay.4":{"m":"الكاظمون الغيظ والعافون عن الناس، والله يحب المحسنين.","a":"اعفُ اليوم عن شخص واحد من قلبك."},"ay.5":{"m":"برحمة من الله لِنتَ لهم، ولو كنت فظًّا لانفضّوا من حولك.","a":"كلّم أهلك اليوم برفق ولا ترفع صوتك."},"ay.6":{"m":"عبادة الله والإحسان إلى الوالدين والأقارب واليتامى والجيران.","a":"اسأل اليوم عن جار أو أهدِه شيئًا."},"ay.7":{"m":"إذا حُيّيتم بتحية فحيّوا بأحسن منها.","a":"ردّ اليوم كل سلام كاملًا: وعليكم السلام ورحمة الله وبركاته."},"ay.8":{"m":"التعاون على البر والتقوى لا على الإثم والعدوان.","a":"أعِن اليوم أحدًا على عمل خير."},"ay.9":{"m":"كلوا واشربوا ولا تسرفوا.","a":"لا تُهدر الطعام اليوم — خذ في صحنك قدر ما تأكل."},"ay.10":{"m":"بذكر الله تطمئن القلوب.","a":"عند القلق قل «سبحان الله» 33 مرة بدل الهاتف."},"ay.11":{"m":"لئن شكرتم لأزيدنّكم.","a":"اكتب اليوم 3 نِعَم تشكر الله عليها."},"ay.12":{"m":"الله يأمر بالعدل والإحسان وإيتاء ذي القربى.","a":"اتصل اليوم بقريب أو زُره."},"ay.13":{"m":"لا تقل لوالديك «أفٍّ»، وقل لهما قولًا كريمًا.","a":"كلّم والديك اليوم برفق وادعُ لهما."},"ay.14":{"m":"لا تتبع ما ليس لك به علم؛ السمع والبصر والفؤاد كلها مسؤولة.","a":"لا تُعِد اليوم إرسال شيء دون تحقق."},"ay.15":{"m":"وقل ربِّ زدني علمًا.","a":"تعلّم اليوم شيئًا جديدًا في الدين وعلّمه غيرك."},"ay.16":{"m":"وليعفوا وليصفحوا، ألا تحبون أن يغفر الله لكم؟","a":"اخطُ اليوم الخطوة الأولى لإنهاء خصام قديم."},"ay.17":{"m":"أمرُ المؤمنين بغضّ أبصارهم، ذلك أزكى لهم.","a":"احفظ بصرك اليوم، خاصة على الهاتف."},"ay.18":{"m":"عباد الرحمن يمشون على الأرض هونًا، وإذا خاطبهم الجاهلون قالوا سلامًا.","a":"بدل الجدال اليوم قل «سلامًا» وانصرف."},"ay.19":{"m":"الصلاة تنهى عن الفحشاء والمنكر، ولذكر الله أكبر.","a":"حاول اليوم أداء كل صلاة في وقتها."},"ay.20":{"m":"لا تُصعّر خدّك للناس ولا تمشِ في الأرض مرحًا.","a":"قابل اليوم الجميع — صغارًا وكبارًا — بابتسامة واهتمام."},"ay.21":{"m":"يا أيها الذين آمنوا اذكروا الله ذكرًا كثيرًا.","a":"أبقِ لسانك رطبًا بالذكر وأنت تعمل اليوم."},"ay.22":{"m":"لا تقنطوا من رحمة الله، إن الله يغفر الذنوب جميعًا.","a":"تُب اليوم توبة صادقة — استغفر مئة مرة."},"ay.23":{"m":"إن جاءكم خبر فتبيّنوا.","a":"لا تشارك اليوم أي خبر على واتساب قبل التحقق."},"ay.24":{"m":"إنما المؤمنون إخوة، فأصلحوا بين أخويكم.","a":"حاول اليوم الإصلاح بين متخاصمين أو صالِح أنت."},"ay.25":{"m":"لا يسخر قوم من قوم، ولا تنابزوا بالألقاب.","a":"تجنّب اليوم السخرية من أحد أو تلقيبه بما يكره."},"ay.26":{"m":"اجتنبوا كثيرًا من الظن، ولا تجسّسوا، ولا يغتب بعضكم بعضًا.","a":"اجتنب الغيبة تمامًا اليوم — وإن بدأت في مجلس فغيّر الحديث."},"ay.27":{"m":"ولتنظر نفس ما قدّمت لغد (الآخرة).","a":"احرص الليلة على المحاسبة."},"ay.28":{"m":"ومن يتوكل على الله فهو حسبه.","a":"قل «حسبي الله» على همٍّ اليوم وتوكّل عليه."},"ay.29":{"m":"وأمّا بنعمة ربك فحدّث.","a":"أخبر اليوم أحدًا بنعمة أنعم الله بها عليك."},"ay.30":{"m":"إن مع العسر يسرًا.","a":"شجّع اليوم صديقًا مهمومًا بهذه الآية."},"ay.31":{"m":"إلا الذين آمنوا وعملوا الصالحات وتواصوا بالحق وتواصوا بالصبر.","a":"ذكّر اليوم أحدًا بلطف بعمل خير."},"ay.32":{"m":"أقيموا الصلاة وآتوا الزكاة واركعوا مع الراكعين.","a":"صلِّ اليوم صلاة واحدة على الأقل في جماعة."},"ay.33":{"m":"الله وملائكته يصلّون على النبي ﷺ؛ فصلّوا عليه وسلّموا.","a":"صلِّ اليوم على النبي ﷺ مئة مرة."},"ay.34":{"m":"ربنا آتنا من لدنك رحمة وهيّئ لنا من أمرنا رشدًا.","a":"اقرأ هذا الدعاء اليوم قبل أي قرار."},"nk.0":"أطعِم جائعًا","nk.1":"اتصل بوالديك أو اجلس معهما","nk.2":"تصدّق بشيء صغير — ولو قليلًا","nk.3":"اسقِ عطشانًا","nk.4":"أعدّ الشاي/الطعام لأهلك","nk.5":"اسأل عن مريض","nk.6":"امدح أحدًا مدحًا صادقًا","nk.7":"شارك في تنظيف المسجد أو الحيّ","nk.8":"ضع ماءً وحَبًّا للطيور","nk.9":"ساعد أحدًا في سداد دَين أو فاتورة","nk.10":"احكِ للأطفال قصة من قصص الأنبياء","nk.11":"حاول مصالحة قريب غاضب","nk.12":"علّم أحدًا آية من القرآن","nk.13":"اقضِ حاجة لكبير في السن","nk.14":"تبرّع بملابس/أشياء لا تستعملها","nk.15":"ادعُ لأحد من قلبك (دون أن تخبره)","nk.16":"أمِط شوكة/حجرًا عن الطريق","nk.17":"اعفُ عن أحد","nk.18":"اشكر أولادك/زوجك في البيت","nk.19":"ساعد طالبًا في دراسته","nk.20":"أعطِ العامل أجره في وقته وبإحسان","nk.21":"ابتعد عن الهاتف ساعة وامنح أسرتك وقتك","nk.22":"أرسل طعامًا لأحد — الجار أولًا","nk.23":"استُر عيب أحد","nk.24":"اخدم ضيفك","nk.25":"شجّع مهمومًا","nk.26":"ساعد يتيمًا أو انوِ كفالته","nk.27":"اصطحب أحدًا معك إلى المسجد يوم الجمعة","nk.28":"اعتذر لمن جرحت قلبه","nk.29":"صلاة جماعية أو حلقة تعليم في البيت"},"bn":{"az.kursi":{"t":"আয়াতুল কুরসি","m":"আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি চিরঞ্জীব, সবকিছুর ধারক… (আল-বাকারা ২:২৫৫)। সকালে পড়লে সন্ধ্যা পর্যন্ত, সন্ধ্যায় পড়লে সকাল পর্যন্ত হেফাজতে থাকে।"},"az.quls":{"t":"তিন কুল","m":"সূরা ইখলাস, ফালাক ও নাস — ৩ বার পড়া সবকিছুর জন্য যথেষ্ট।"},"az.mulk":{"t":"আসবাহনা ওয়া আসবাহাল মুলকু লিল্লাহ","m":"আমরা সকালে উপনীত হলাম এবং সমস্ত রাজত্ব আল্লাহর। হে রব! এই দিনের কল্যাণ চাই এবং এর অনিষ্ট, অলসতা, বার্ধক্যের মন্দ, জাহান্নাম ও কবরের আজাব থেকে আশ্রয় চাই।"},"az.bika":{"t":"আল্লাহুম্মা বিকা আসবাহনা","m":"হে আল্লাহ! তোমারই হুকুমে আমরা সকাল/সন্ধ্যা পেয়েছি, তোমারই হুকুমে বাঁচি ও মরি, আর তোমার দিকেই ফিরে যাওয়া।"},"az.sayyid":{"t":"সাইয়্যিদুল ইস্তিগফার","m":"হে আল্লাহ! তুমি আমার রব… আমি তোমার নিয়ামত স্বীকার করি ও আমার গুনাহ স্বীকার করি, আমাকে ক্ষমা করো, তুমি ছাড়া কেউ গুনাহ ক্ষমা করে না। (দৃঢ় বিশ্বাসে পড়ে সেদিন/রাতে মারা গেলে জান্নাতি।)"},"az.afini":{"t":"আল্লাহুম্মা আফিনি ফি বাদানি","m":"হে আল্লাহ! আমার দেহ, কান ও চোখে সুস্থতা দাও। কুফর, দারিদ্র্য ও কবরের আজাব থেকে তোমার আশ্রয় চাই।"},"az.hasbi":{"t":"হাসবিয়াল্লাহু","m":"আল্লাহই আমার জন্য যথেষ্ট, তিনি ছাড়া কোনো ইলাহ নেই, তাঁর উপরই ভরসা, তিনি মহান আরশের রব।"},"az.bism":{"t":"বিসমিল্লাহিল্লাজি লা ইয়াদুররু","m":"আল্লাহর নামে, যাঁর নামের সাথে আসমান ও জমিনের কোনো কিছু ক্ষতি করতে পারে না, তিনি সর্বশ্রোতা, সর্বজ্ঞ।"},"az.radi":{"t":"রাদিতু বিল্লাহি রাব্বা","m":"আমি আল্লাহকে রব, ইসলামকে দ্বীন ও মুহাম্মদ ﷺ-কে নবী হিসেবে পেয়ে সন্তুষ্ট।"},"az.hayy":{"t":"ইয়া হাইয়্যু ইয়া কাইয়্যুম","m":"হে চিরঞ্জীব, হে ধারক! তোমার রহমতের ওসিলায় সাহায্য চাই, আমার সব কাজ ঠিক করে দাও এবং চোখের পলক পরিমাণও আমাকে আমার নফসের হাতে ছেড়ে দিও না।"},"az.kalimat":{"t":"আউজু বিকালিমাতিল্লাহ","m":"আল্লাহর পরিপূর্ণ বাণীসমূহের আশ্রয় চাই, সব সৃষ্টির অনিষ্ট থেকে।"},"az.subhan":{"t":"সুবহানাল্লাহি ওয়া বিহামদিহি","m":"আল্লাহ পবিত্র, তাঁর প্রশংসাসহ। ১০০ বার পড়লে গুনাহ মাফ, যদিও তা সমুদ্রের ফেনার সমান হয়।"},"az.istighfar":{"t":"আস্তাগফিরুল্লাহা ওয়া আতুবু ইলাইহ","m":"আমি আল্লাহর কাছে ক্ষমা চাই ও তাঁর দিকে ফিরে আসি। নবী ﷺ দিনে ১০০ বার ইস্তিগফার করতেন।"},"az.durood":{"t":"দরুদ","m":"হে আল্লাহ! আমাদের নবী মুহাম্মদ ﷺ-এর উপর রহমত ও শান্তি বর্ষণ করো।"},"du.neend":{"t":"ঘুম থেকে ওঠা","m":"সমস্ত প্রশংসা সেই আল্লাহর যিনি আমাদের মৃত্যুর (ঘুমের) পর জীবিত করেছেন এবং তাঁর দিকেই পুনরুত্থান।"},"du.sona":{"t":"ঘুমানোর আগে","m":"হে আল্লাহ! তোমার নামে মরি (ঘুমাই) ও বাঁচি (জাগি)।"},"du.khana1":{"t":"খাওয়ার আগে","m":"আল্লাহর নামে। ভুলে গেলে: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ (বিসমিল্লাহি আওয়ালাহু ওয়া আখিরাহু)।"},"du.khana2":{"t":"খাওয়ার পরে","m":"প্রশংসা সেই আল্লাহর যিনি আমাকে এটি খাইয়েছেন এবং আমার কোনো শক্তি ছাড়াই দান করেছেন। (আগের গুনাহ মাফ হয়।)"},"du.nikalna":{"t":"ঘর থেকে বের হওয়া","m":"আল্লাহর নামে, আল্লাহর উপর ভরসা করলাম, আল্লাহ ছাড়া কোনো শক্তি ও ক্ষমতা নেই।"},"du.dakhil":{"t":"ঘরে প্রবেশ","m":"আল্লাহর নামে আমরা প্রবেশ করলাম ও বের হলাম, এবং আমাদের রব আল্লাহর উপর ভরসা করলাম। তারপর ঘরের লোকদের সালাম দিন।"},"du.bath1":{"t":"টয়লেটে যাওয়ার আগে","m":"আল্লাহর নামে। হে আল্লাহ! আমি নাপাক নর ও নারী জিন (শয়তান) থেকে তোমার আশ্রয় চাই। (আগে বাম পা।)"},"du.bath2":{"t":"টয়লেট থেকে বের হওয়া","m":"(হে আল্লাহ) তোমার ক্ষমা চাই। (আগে ডান পা।)"},"du.wudu":{"t":"অজুর পরে","m":"সাক্ষ্য দিচ্ছি আল্লাহ ছাড়া কোনো ইলাহ নেই… এবং মুহাম্মদ ﷺ তাঁর বান্দা ও রাসুল। জান্নাতের আটটি দরজা খুলে যায়। (অজুর আগে: বিসমিল্লাহ)"},"du.masjid1":{"t":"মসজিদে প্রবেশ","m":"হে আল্লাহ! আমার জন্য তোমার রহমতের দরজাগুলো খুলে দাও। (আগে ডান পা।)"},"du.masjid2":{"t":"মসজিদ থেকে বের হওয়া","m":"হে আল্লাহ! আমি তোমার কাছে তোমার অনুগ্রহ চাই। (আগে বাম পা।)"},"du.kapray":{"t":"কাপড় পরা","m":"প্রশংসা সেই আল্লাহর যিনি আমাকে এটি পরিয়েছেন এবং আমার শক্তি ছাড়াই দান করেছেন।"},"du.safar":{"t":"বাহন / সফর","m":"পবিত্র তিনি যিনি একে আমাদের বশীভূত করেছেন, আমরা নিজেরা একে বশ করতে পারতাম না, আর আমরা আমাদের রবের দিকেই ফিরে যাব।"},"du.azan":{"t":"আজানের পরে","m":"হে আল্লাহ, এই পরিপূর্ণ আহ্বান ও প্রতিষ্ঠিত হতে যাওয়া নামাজের রব! মুহাম্মদ ﷺ-কে ওসিলা ও মর্যাদা দান করো এবং তাঁকে প্রতিশ্রুত মাকামে মাহমুদে পৌঁছে দাও। (শাফায়াত নসিব হবে।)"},"du.cheenk":{"t":"হাঁচি এলে","m":"সমস্ত প্রশংসা আল্লাহর · আল্লাহ তোমার উপর রহম করুন · আল্লাহ তোমাদের হেদায়েত দিন ও অবস্থা সংশোধন করুন।"},"du.gussa":{"t":"রাগ এলে","m":"আমি বিতাড়িত শয়তান থেকে আল্লাহর আশ্রয় চাই। দাঁড়িয়ে থাকলে বসে পড়ুন, চুপ হয়ে যান।"},"du.fikr":{"t":"দুশ্চিন্তা / দুঃখ","m":"হে আল্লাহ! দুশ্চিন্তা, দুঃখ, অক্ষমতা, অলসতা, কৃপণতা, কাপুরুষতা, ঋণের বোঝা ও মানুষের দমন থেকে তোমার আশ্রয় চাই।"},"du.musibat":{"t":"বিপদ / ক্ষতি","m":"আমরা আল্লাহরই এবং তাঁর দিকেই ফিরে যাব।"},"du.yunus":{"t":"কঠিন সময় (দোয়া ইউনুস)","m":"তুমি ছাড়া কোনো ইলাহ নেই, তুমি পবিত্র, নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম।"},"du.majlis":{"t":"মজলিস শেষে","m":"হে আল্লাহ, তুমি পবিত্র, তোমার প্রশংসাসহ; তুমি ছাড়া কোনো ইলাহ নেই, তোমার কাছে ক্ষমা চাই ও তওবা করি। (মজলিসের ভুলের কাফফারা।)"},"du.barish":{"t":"বৃষ্টি হলে","m":"হে আল্লাহ! একে উপকারী বৃষ্টি বানাও।"},"du.iftar":{"t":"ইফতার","m":"পিপাসা দূর হলো, শিরাগুলো সিক্ত হলো এবং ইনশাআল্লাহ সওয়াব নিশ্চিত হলো।"},"du.jazak":{"t":"কেউ উপকার করলে","m":"আল্লাহ তোমাকে উত্তম প্রতিদান দিন। (এটি বলা সর্বোত্তম কৃতজ্ঞতা।)"},"du.walidain":{"t":"বাবা-মায়ের জন্য","m":"হে রব! তাঁদের উভয়ের প্রতি দয়া করো, যেমন তাঁরা শৈশবে আমাকে লালন-পালন করেছেন।"},"du.ilm":{"t":"জ্ঞানের জন্য","m":"হে আমার রব! আমার জ্ঞান বৃদ্ধি করো।"},"du.hasana":{"t":"দুনিয়া ও আখিরাতের কল্যাণ","m":"হে রব! আমাদের দুনিয়াতেও কল্যাণ দাও, আখিরাতেও কল্যাণ দাও এবং জাহান্নামের আজাব থেকে রক্ষা করো। (নবী ﷺ-এর সবচেয়ে বেশি করা দোয়া।)"},"du.dil":{"t":"দ্বীনের উপর অবিচলতা","m":"হে অন্তরসমূহের পরিবর্তনকারী! আমার অন্তরকে তোমার দ্বীনের উপর দৃঢ় রাখো।"},"su.0":"ডান হাতে খাওয়া ও পান করা","su.1":"খাওয়ার আগে “বিসমিল্লাহ” বলা","su.2":"আগে সালাম দেওয়া — যে আগে সালাম দেয় সে আল্লাহর বেশি নিকটবর্তী","su.3":"ভাইয়ের সাথে হাসিমুখে দেখা করা — এটিও সদকা","su.4":"মিসওয়াক করা (বিশেষত অজু/নামাজের আগে)","su.5":"অজুর পর ২ রাকাত তাহিয়্যাতুল অজু","su.6":"ডান কাতে ঘুমানো","su.7":"ঘুমানোর আগে অজু করা","su.8":"বসে তিন নিঃশ্বাসে পানি পান করা","su.9":"জুতা পরতে আগে ডান, খুলতে আগে বাম","su.10":"হাঁচি দিলে “আলহামদুলিল্লাহ” বলা","su.11":"আজানের জবাব দেওয়া ও পরের দোয়া পড়া","su.12":"ফজরের আগে ২ রাকাত সুন্নত — দুনিয়া ও এর সবকিছুর চেয়ে উত্তম","su.13":"ভাইয়ের অনুপস্থিতিতে তার জন্য দোয়া","su.14":"রোগী দেখতে যাওয়া (বা ফোনে খোঁজ নেওয়া)","su.15":"কাউকে উপহার দেওয়া — ভালোবাসা বাড়ে","su.16":"রাস্তা থেকে কষ্টদায়ক জিনিস সরানো","su.17":"খাওয়ার পর প্লেট পরিষ্কার করা ও আঙুল চাটা","su.18":"প্রতি ফরজ নামাজের পর আয়াতুল কুরসি","su.19":"ঘুমানোর আগে তিন কুল পড়ে হাতে ফুঁ দিয়ে শরীরে বুলানো","su.20":"ঘুমানোর আগে তাসবিহে ফাতিমা: ৩৩ সুবহানাল্লাহ, ৩৩ আলহামদুলিল্লাহ, ৩৪ আল্লাহু আকবার","su.21":"রাগ এলে চুপ থাকা / বসে পড়া","su.22":"ভালো কথা বলো, নয়তো চুপ থাকো","su.23":"ঘরে প্রবেশ করে সালাম দেওয়া","su.24":"ঘরের কাজে সাহায্য করা","su.25":"মেহমানের সম্মান করা","su.26":"সুগন্ধি ব্যবহার করা","su.27":"সোম বা বৃহস্পতিবারের নফল রোজা","su.28":"চাশত (দুহা)-এর নামাজ — ২ রাকাত","su.29":"মজলিসের শেষে কাফফারাতুল মজলিসের দোয়া","su.30":"ঘুম থেকে উঠে দোয়া “আলহামদু লিল্লাহিল্লাজি আহইয়ানা…”","su.31":"খাবারের দোষ না ধরা","su.32":"মসজিদে আগে ডান পা রাখা","su.33":"বেশি বেশি দরুদ — এক দরুদে দশ রহমত","ay.0":{"m":"তোমরা আমাকে স্মরণ করো, আমি তোমাদের স্মরণ করব, এবং আমার শোকর করো।","a":"আজ ৫ মিনিট শুধু জিকির করুন — সুবহানাল্লাহ, আলহামদুলিল্লাহ।"},"ay.1":{"m":"ধৈর্য ও নামাজের মাধ্যমে সাহায্য চাও, নিশ্চয়ই আল্লাহ ধৈর্যশীলদের সাথে আছেন।","a":"আজ কোনো দুশ্চিন্তায় অভিযোগের বদলে ২ রাকাত পড়ে দোয়া করুন।"},"ay.2":{"m":"আমি নিকটে, আহ্বানকারীর আহ্বানে সাড়া দিই।","a":"আজ নিজের ভাষায় মন খুলে আল্লাহর কাছে একটি দোয়া করুন।"},"ay.3":{"m":"আল্লাহ কারো উপর তার সাধ্যের বেশি বোঝা চাপান না।","a":"আজ আপনার একটি বোঝা আল্লাহর হাতে সঁপে দিন এবং এই আয়াতের দোয়া পড়ুন।"},"ay.4":{"m":"যারা রাগ সংবরণ করে ও মানুষকে ক্ষমা করে — আল্লাহ সৎকর্মশীলদের ভালোবাসেন।","a":"আজ একজনকে আন্তরিকভাবে ক্ষমা করে দিন।"},"ay.5":{"m":"আল্লাহর রহমতে আপনি কোমল হয়েছেন; কঠোর হলে লোকেরা দূরে সরে যেত।","a":"আজ পরিবারের সাথে নরমভাবে কথা বলুন, গলা উঁচু করবেন না।"},"ay.6":{"m":"আল্লাহর ইবাদত করো এবং বাবা-মা, আত্মীয়, এতিম ও প্রতিবেশীর সাথে সদ্ব্যবহার করো।","a":"আজ কোনো প্রতিবেশীর খোঁজ নিন বা কিছু পাঠান।"},"ay.7":{"m":"যখন তোমাদের সালাম দেওয়া হয়, তার চেয়ে উত্তম জবাব দাও।","a":"আজ প্রতিটি সালামের পূর্ণ জবাব দিন: ওয়া আলাইকুমুস সালাম ওয়া রাহমাতুল্লাহি ওয়া বারাকাতুহ।"},"ay.8":{"m":"সৎকাজ ও তাকওয়ায় একে অপরকে সাহায্য করো, পাপ ও সীমালঙ্ঘনে নয়।","a":"আজ কাউকে একটি ভালো কাজে সাহায্য করুন।"},"ay.9":{"m":"খাও ও পান করো, কিন্তু অপচয় করো না।","a":"আজ খাবার নষ্ট করবেন না — প্লেটে ততটুকুই নিন যতটুকু খাবেন।"},"ay.10":{"m":"জেনে রাখো! আল্লাহর জিকিরেই অন্তর প্রশান্তি পায়।","a":"অস্থির লাগলে ফোনের বদলে ৩৩ বার সুবহানাল্লাহ পড়ুন।"},"ay.11":{"m":"যদি শোকর করো, আমি অবশ্যই তোমাদের আরও বাড়িয়ে দেব।","a":"আজ ৩টি নিয়ামত লিখুন যার জন্য শোকর আদায় করবেন।"},"ay.12":{"m":"আল্লাহ ন্যায়, সদাচার ও আত্মীয়দের দান করার নির্দেশ দেন।","a":"আজ কোনো আত্মীয়কে ফোন করুন বা দেখা করুন।"},"ay.13":{"m":"বাবা-মাকে “উফ” পর্যন্ত বলো না, তাঁদের সাথে সম্মানের সাথে কথা বলো।","a":"আজ বাবা-মায়ের সাথে নরমভাবে কথা বলুন ও তাঁদের জন্য দোয়া করুন।"},"ay.14":{"m":"যে বিষয়ে জ্ঞান নেই তার পিছনে পড়ো না; কান, চোখ, অন্তর সবকিছুর জবাবদিহি হবে।","a":"আজ যাচাই ছাড়া কোনো কথা ফরোয়ার্ড করবেন না।"},"ay.15":{"m":"বলো: হে রব! আমার জ্ঞান বৃদ্ধি করো।","a":"আজ দ্বীনের একটি নতুন কথা শিখুন এবং কাউকে জানান।"},"ay.16":{"m":"ক্ষমা করো ও উপেক্ষা করো — তোমরা কি চাও না আল্লাহ তোমাদের ক্ষমা করুন?","a":"আজ পুরনো কোনো মনোমালিন্য মেটানোর প্রথম পদক্ষেপ নিন।"},"ay.17":{"m":"মুমিন পুরুষরা যেন তাদের দৃষ্টি নত রাখে — এটি তাদের জন্য পবিত্রতা।","a":"আজ দৃষ্টির হেফাজত করুন, বিশেষত ফোনে।"},"ay.18":{"m":"রহমানের বান্দারা জমিনে বিনয়ের সাথে চলে, আর অজ্ঞরা কথা বললে “সালাম” বলে চলে যায়।","a":"আজ কোনো তর্কে জবাব দেওয়ার বদলে “সালাম” বলে ছেড়ে দিন।"},"ay.19":{"m":"নামাজ অশ্লীলতা ও মন্দ কাজ থেকে বিরত রাখে, আর আল্লাহর জিকিরই সর্বশ্রেষ্ঠ।","a":"আজ প্রতিটি নামাজ সময়মতো পড়ার চেষ্টা করুন।"},"ay.20":{"m":"মানুষের দিক থেকে মুখ ফিরিয়ে কথা বলো না এবং দম্ভভরে চলো না।","a":"আজ সবার সাথে — ছোট-বড় — হাসিমুখে ও মনোযোগ দিয়ে দেখা করুন।"},"ay.21":{"m":"হে ঈমানদারগণ! আল্লাহকে বেশি বেশি স্মরণ করো।","a":"আজ কাজ করতে করতে মুখে জিকির চালু রাখুন।"},"ay.22":{"m":"আল্লাহর রহমত থেকে নিরাশ হয়ো না, আল্লাহ সব গুনাহ ক্ষমা করেন।","a":"আজ খাঁটি তওবা করুন — ১০০ বার ইস্তিগফার।"},"ay.23":{"m":"কেউ কোনো খবর আনলে যাচাই করে নাও।","a":"আজ যাচাই ছাড়া হোয়াটসঅ্যাপে কোনো খবর শেয়ার করবেন না।"},"ay.24":{"m":"মুমিনরা পরস্পর ভাই, তাই ভাইদের মধ্যে মীমাংসা করে দাও।","a":"আজ দুজন মনোমালিন্যকারী মানুষের মধ্যে মীমাংসার চেষ্টা করুন বা নিজে মীমাংসা করুন।"},"ay.25":{"m":"কোনো সম্প্রদায় যেন অন্য সম্প্রদায়কে উপহাস না করে, আর মন্দ নামে ডেকো না।","a":"আজ কাউকে উপহাস বা মন্দ নামে ডাকা থেকে বিরত থাকুন।"},"ay.26":{"m":"কুধারণা থেকে বাঁচো, গোয়েন্দাগিরি করো না, গিবত করো না।","a":"আজ গিবত থেকে পুরোপুরি বিরত থাকুন — মজলিসে শুরু হলে প্রসঙ্গ বদলে দিন।"},"ay.27":{"m":"প্রত্যেকে যেন দেখে, আগামীকালের (আখিরাতের) জন্য সে কী পাঠিয়েছে।","a":"আজ রাতে অবশ্যই মুহাসাবা করুন।"},"ay.28":{"m":"যে আল্লাহর উপর ভরসা করে, আল্লাহই তার জন্য যথেষ্ট।","a":"আজ একটি দুশ্চিন্তায় “হাসবিয়াল্লাহ” পড়ে ভরসা করুন।"},"ay.29":{"m":"তোমার রবের নিয়ামতের কথা বর্ণনা করো।","a":"আজ কাউকে জানান আল্লাহ আপনার উপর কী অনুগ্রহ করেছেন।"},"ay.30":{"m":"নিশ্চয়ই কষ্টের সাথে স্বস্তি আছে।","a":"আজ কোনো দুশ্চিন্তাগ্রস্ত বন্ধুকে এই আয়াত শুনিয়ে উৎসাহ দিন।"},"ay.31":{"m":"তারা ছাড়া, যারা ঈমান এনেছে, সৎকাজ করেছে, এবং পরস্পরকে সত্য ও ধৈর্যের উপদেশ দিয়েছে।","a":"আজ কাউকে ভালোবাসার সাথে একটি নেক কাজের কথা মনে করিয়ে দিন।"},"ay.32":{"m":"নামাজ কায়েম করো, জাকাত দাও এবং রুকুকারীদের সাথে রুকু করো।","a":"আজ অন্তত এক ওয়াক্ত নামাজ জামাতে পড়ুন।"},"ay.33":{"m":"আল্লাহ ও তাঁর ফেরেশতারা নবী ﷺ-এর উপর দরুদ পাঠান — তোমরাও দরুদ ও সালাম পাঠাও।","a":"আজ ১০০ বার দরুদ পড়ুন।"},"ay.34":{"m":"হে রব! আমাদের তোমার পক্ষ থেকে রহমত দাও এবং আমাদের কাজে সঠিক পথের ব্যবস্থা করো।","a":"আজ কোনো সিদ্ধান্তের আগে এই দোয়া পড়ুন।"},"nk.0":"কোনো ক্ষুধার্তকে খাবার খাওয়ান","nk.1":"বাবা-মাকে ফোন করুন বা তাঁদের কাছে বসুন","nk.2":"ছোট একটি সদকা দিন — ১০ টাকা হলেও","nk.3":"কোনো তৃষ্ণার্তকে পানি পান করান","nk.4":"পরিবারের জন্য চা/খাবার বানান","nk.5":"কোনো অসুস্থের খোঁজ নিন","nk.6":"কারো সত্যিকারের প্রশংসা করুন","nk.7":"মসজিদ বা মহল্লা পরিষ্কারে অংশ নিন","nk.8":"পাখির জন্য পানি/দানা রাখুন","nk.9":"কারো ঋণ বা বিল পরিশোধে সাহায্য করুন","nk.10":"ছোট বাচ্চাদের নবীদের একটি কাহিনি শোনান","nk.11":"রাগান্বিত কোনো আত্মীয়ের সাথে মীমাংসার চেষ্টা","nk.12":"কাউকে কুরআনের একটি আয়াত শেখান","nk.13":"কোনো বয়স্কের কাজ করে দিন","nk.14":"ব্যবহার হয় না এমন কাপড়/জিনিস দান করুন","nk.15":"কারো জন্য মন থেকে দোয়া করুন (না জানিয়ে)","nk.16":"রাস্তা থেকে কাঁটা/পাথর সরান","nk.17":"কাউকে ক্ষমা করে দিন","nk.18":"ঘরে সন্তান/স্ত্রী/স্বামীকে ধন্যবাদ দিন","nk.19":"কোনো ছাত্রের পড়াশোনায় সাহায্য করুন","nk.20":"কোনো কর্মচারী/শ্রমিককে সময়মতো ও ভালোভাবে মজুরি দিন","nk.21":"এক ঘণ্টা ফোন থেকে দূরে থেকে পরিবারকে সময় দিন","nk.22":"কাউকে খাবার পাঠান — প্রতিবেশী আগে","nk.23":"কারো দোষ গোপন রাখুন","nk.24":"মেহমানের খেদমত","nk.25":"কোনো দুশ্চিন্তাগ্রস্তকে উৎসাহ দিন","nk.26":"কোনো এতিমকে সাহায্য বা তার দায়িত্ব নেওয়ার নিয়ত","nk.27":"জুমার দিন কাউকে সাথে করে মসজিদে নিয়ে যান","nk.28":"যার মনে কষ্ট দিয়েছেন তার কাছে ক্ষমা চেয়ে নিন","nk.29":"ঘরে একসাথে নামাজ বা তালিমের হালকা"},"en":{"az.kursi":{"t":"Ayat al-Kursi","m":"Allah — there is no deity except Him, the Ever-Living, the Sustainer of all… (Al-Baqarah 2:255). Whoever reads it in the morning is protected until evening, and in the evening until morning."},"az.quls":{"t":"The Three Quls","m":"Surah al-Ikhlas, al-Falaq and an-Nas — reciting them 3 times suffices you against everything."},"az.mulk":{"t":"Asbahna wa asbahal mulku lillah","m":"We have entered the morning and all dominion belongs to Allah. O Lord! I ask You for the good of this day, and seek refuge from its evil, from laziness, the evil of old age, and from the punishment of the Fire and the grave."},"az.bika":{"t":"Allahumma bika asbahna","m":"O Allah! By Your command we enter the morning/evening, by You we live and die, and to You is the return."},"az.sayyid":{"t":"Sayyid al-Istighfar","m":"O Allah! You are my Lord… I acknowledge Your favours upon me and confess my sins, so forgive me, for none forgives sins but You. (Whoever says it with certainty and dies that day/night is among the people of Jannah.)"},"az.afini":{"t":"Allahumma 'afini fi badani","m":"O Allah! Grant me well-being in my body, my hearing and my sight. I seek Your refuge from disbelief, poverty and the punishment of the grave."},"az.hasbi":{"t":"Hasbiyallahu","m":"Allah is sufficient for me; there is no deity except Him. In Him I put my trust, and He is the Lord of the Mighty Throne."},"az.bism":{"t":"Bismillahil-ladhi la yadurru","m":"In the name of Allah, with whose name nothing on earth or in the heavens can cause harm; He is the All-Hearing, the All-Knowing."},"az.radi":{"t":"Raditu billahi Rabba","m":"I am pleased with Allah as my Lord, Islam as my religion and Muhammad ﷺ as my Prophet."},"az.hayy":{"t":"Ya Hayyu ya Qayyum","m":"O Ever-Living, O Sustainer! By Your mercy I seek help; set right all my affairs and do not leave me to myself even for the blink of an eye."},"az.kalimat":{"t":"A'udhu bi kalimatillah","m":"I seek refuge in the perfect words of Allah from the evil of all that He has created."},"az.subhan":{"t":"SubhanAllahi wa bihamdihi","m":"Glory be to Allah and praise be to Him. Whoever says it 100 times has his sins forgiven, even if they are like the foam of the sea."},"az.istighfar":{"t":"Astaghfirullaha wa atubu ilayh","m":"I seek Allah's forgiveness and turn to Him in repentance. The Prophet ﷺ sought forgiveness 100 times a day."},"az.durood":{"t":"Salawat (Durood)","m":"O Allah! Send Your mercy and peace upon our Prophet Muhammad ﷺ."},"du.neend":{"t":"Waking up","m":"All praise is for Allah who gave us life after death (sleep), and to Him is the rising."},"du.sona":{"t":"Before sleeping","m":"O Allah! In Your name I die (sleep) and live (wake)."},"du.khana1":{"t":"Before eating","m":"In the name of Allah. If you forget: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ (Bismillahi awwalahu wa akhirahu)."},"du.khana2":{"t":"After eating","m":"Praise be to Allah who fed me this and provided it without any power of mine. (Past sins are forgiven.)"},"du.nikalna":{"t":"Leaving the house","m":"In the name of Allah, I trust in Allah, and there is no might nor power except with Allah."},"du.dakhil":{"t":"Entering the house","m":"In the name of Allah we enter and leave, and upon our Lord Allah we rely. Then greet your family with salam."},"du.bath1":{"t":"Before entering the toilet","m":"In the name of Allah. O Allah! I seek Your refuge from the male and female unclean jinn (devils). (Left foot first.)"},"du.bath2":{"t":"Leaving the toilet","m":"(O Allah) I seek Your forgiveness. (Right foot first.)"},"du.wudu":{"t":"After wudu","m":"I bear witness that there is no deity except Allah… and that Muhammad ﷺ is His servant and Messenger. The 8 gates of Jannah are opened. (Before wudu: Bismillah)"},"du.masjid1":{"t":"Entering the masjid","m":"O Allah! Open for me the gates of Your mercy. (Right foot first.)"},"du.masjid2":{"t":"Leaving the masjid","m":"O Allah! I ask You of Your bounty. (Left foot first.)"},"du.kapray":{"t":"Putting on clothes","m":"Praise be to Allah who clothed me with this and provided it without any power of mine."},"du.safar":{"t":"Riding / travelling","m":"Glory be to the One who subjected this to us, for we could not have done so ourselves, and to our Lord we shall return."},"du.azan":{"t":"After the adhan","m":"O Allah, Lord of this perfect call and the prayer to be established! Grant Muhammad ﷺ al-wasilah and excellence, and raise him to the praised station You promised him. (Intercession will be granted.)"},"du.cheenk":{"t":"When sneezing","m":"All praise is for Allah · May Allah have mercy on you · May Allah guide you and set your affairs right."},"du.gussa":{"t":"When angry","m":"I seek refuge in Allah from the accursed Shaytan. If standing, sit down; and stay silent."},"du.fikr":{"t":"Worry / grief","m":"O Allah! I seek Your refuge from anxiety, grief, helplessness, laziness, miserliness, cowardice, the burden of debt and being overpowered by people."},"du.musibat":{"t":"Calamity / loss","m":"Indeed we belong to Allah and to Him we shall return."},"du.yunus":{"t":"Hard times (Dua of Yunus)","m":"There is no deity except You; glory be to You; indeed I have been among the wrongdoers."},"du.majlis":{"t":"End of a gathering","m":"Glory be to You, O Allah, and praise; there is no deity except You; I seek Your forgiveness and repent to You. (Expiation for the gathering's mistakes.)"},"du.barish":{"t":"When it rains","m":"O Allah! Make it beneficial rain."},"du.iftar":{"t":"Breaking the fast","m":"The thirst is gone, the veins are moistened, and the reward is confirmed, InshaAllah."},"du.jazak":{"t":"When someone does you good","m":"May Allah reward you with goodness. (Saying this is the best thanks.)"},"du.walidain":{"t":"For parents","m":"My Lord! Have mercy on them both as they raised me when I was small."},"du.ilm":{"t":"For knowledge","m":"My Lord! Increase me in knowledge."},"du.hasana":{"t":"Good in this world and the next","m":"Our Lord! Give us good in this world and good in the Hereafter, and save us from the punishment of the Fire. (The dua the Prophet ﷺ made most often.)"},"du.dil":{"t":"Steadfastness in faith","m":"O Turner of hearts! Keep my heart firm upon Your religion."},"su.0":"Eating and drinking with the right hand","su.1":"Saying “Bismillah” before eating","su.2":"Being first to give salam — the one who greets first is closer to Allah","su.3":"Meeting your brother with a smile — that too is charity","su.4":"Using the miswak (especially before wudu/salah)","su.5":"2 rak'ahs of Tahiyyat al-Wudu after wudu","su.6":"Sleeping on the right side","su.7":"Making wudu before sleeping","su.8":"Drinking water sitting down, in 3 breaths","su.9":"Putting on the right shoe first, and taking off the left first","su.10":"Saying “Alhamdulillah” after sneezing","su.11":"Responding to the adhan and reading the dua after it","su.12":"2 sunnah before Fajr — better than the world and all in it","su.13":"Making dua for a brother in his absence","su.14":"Visiting a sick person (or asking after them by phone)","su.15":"Giving someone a gift — love increases","su.16":"Removing something harmful from the path","su.17":"Cleaning the plate and licking the fingers after eating","su.18":"Ayat al-Kursi after every fard prayer","su.19":"Before sleeping, reciting the three Quls, blowing into the hands and wiping over the body","su.20":"Tasbih of Fatimah before sleeping: 33 SubhanAllah, 33 Alhamdulillah, 34 Allahu Akbar","su.21":"Staying quiet / sitting down when angry","su.22":"Speak good or remain silent","su.23":"Giving salam on entering the home","su.24":"Helping with the housework","su.25":"Honouring the guest","su.26":"Wearing perfume","su.27":"A voluntary fast on Monday or Thursday","su.28":"The Duha (Chasht) prayer — 2 rak'ahs","su.29":"The kaffarat al-majlis dua at the end of a gathering","su.30":"On waking, the dua “Alhamdulillahil-ladhi ahyana…”","su.31":"Not finding fault with food","su.32":"Entering the masjid with the right foot first","su.33":"Abundant salawat — 10 mercies for each one","ay.0":{"m":"Remember Me; I will remember you. And be grateful to Me.","a":"Spend 5 minutes today only in dhikr — SubhanAllah, Alhamdulillah."},"ay.1":{"m":"Seek help through patience and prayer; indeed Allah is with the patient.","a":"Today, instead of complaining about a worry, pray 2 rak'ahs and make dua."},"ay.2":{"m":"I am near; I answer the call of the caller when he calls Me.","a":"Today, ask Allah for something from your heart in your own language."},"ay.3":{"m":"Allah does not burden a soul beyond its capacity.","a":"Today, hand one of your burdens over to Allah and read the dua of this ayah."},"ay.4":{"m":"Those who restrain anger and pardon people — Allah loves the doers of good.","a":"Today, sincerely forgive one person."},"ay.5":{"m":"By the mercy of Allah you were gentle with them; had you been harsh, they would have left you.","a":"Today, speak gently with your family; don't raise your voice."},"ay.6":{"m":"Worship Allah, and do good to parents, relatives, orphans and neighbours.","a":"Today, check on a neighbour or send them something."},"ay.7":{"m":"When you are greeted, respond with a better greeting.","a":"Today, answer every salam in full: Wa alaikumus-salam wa rahmatullahi wa barakatuh."},"ay.8":{"m":"Help one another in righteousness and piety, not in sin and aggression.","a":"Today, help someone in a good deed."},"ay.9":{"m":"Eat and drink, but do not be wasteful.","a":"Don't waste food today — take only as much as you will eat."},"ay.10":{"m":"Verily, in the remembrance of Allah do hearts find rest.","a":"When restless, say SubhanAllah 33 times instead of reaching for the phone."},"ay.11":{"m":"If you are grateful, I will surely increase you.","a":"Today, write down 3 blessings to be grateful for."},"ay.12":{"m":"Allah commands justice, excellence and giving to relatives.","a":"Today, call or visit a relative."},"ay.13":{"m":"Do not say “uff” to your parents; speak to them with honour.","a":"Today, speak gently with your parents and make dua for them."},"ay.14":{"m":"Do not pursue what you have no knowledge of; hearing, sight and heart will all be questioned.","a":"Today, don't forward anything without checking it."},"ay.15":{"m":"Say: My Lord, increase me in knowledge.","a":"Today, learn one new thing about the deen and tell someone."},"ay.16":{"m":"Let them pardon and overlook — do you not love that Allah should forgive you?","a":"Today, take the first step to end an old grudge."},"ay.17":{"m":"Tell the believing men to lower their gaze — that is purer for them.","a":"Today, guard your gaze, especially on your phone."},"ay.18":{"m":"The servants of the Most Merciful walk humbly on the earth, and when the ignorant address them, they say “peace”.","a":"Today, instead of arguing back, say “salam” and let it go."},"ay.19":{"m":"Prayer restrains from indecency and wrongdoing, and the remembrance of Allah is greatest.","a":"Today, try to pray every salah on time."},"ay.20":{"m":"Do not turn your cheek away from people, nor walk arrogantly.","a":"Today, meet everyone — young and old — with a smile and attention."},"ay.21":{"m":"O you who believe! Remember Allah abundantly.","a":"Today, keep dhikr on your tongue while you work."},"ay.22":{"m":"Do not despair of the mercy of Allah; Allah forgives all sins.","a":"Make sincere tawbah today — 100 times istighfar."},"ay.23":{"m":"If someone brings you news, verify it.","a":"Today, don't share any news on WhatsApp without verifying it."},"ay.24":{"m":"The believers are brothers, so make peace between your brothers.","a":"Today, try to reconcile two people who are upset — or reconcile yourself."},"ay.25":{"m":"Let no people mock another people, nor call each other by offensive names.","a":"Today, avoid mocking anyone or calling them names."},"ay.26":{"m":"Avoid suspicion, do not spy, and do not backbite.","a":"Completely avoid backbiting today — if it starts in a gathering, change the topic."},"ay.27":{"m":"Let every soul look to what it has sent forth for tomorrow (the Hereafter).","a":"Be sure to do your night reflection tonight."},"ay.28":{"m":"Whoever relies on Allah, He is sufficient for him.","a":"Today, say “Hasbiyallah” over one worry and trust Him."},"ay.29":{"m":"And proclaim the blessing of your Lord.","a":"Today, tell someone about a favour Allah has done for you."},"ay.30":{"m":"Indeed, with hardship comes ease.","a":"Today, encourage a troubled friend by sharing this ayah."},"ay.31":{"m":"Except those who believe, do good deeds, and urge one another to truth and patience.","a":"Today, lovingly remind someone of a good deed."},"ay.32":{"m":"Establish prayer, give zakah, and bow with those who bow.","a":"Today, pray at least one salah in congregation."},"ay.33":{"m":"Allah and His angels send blessings upon the Prophet ﷺ — you too send blessings and peace upon him.","a":"Today, send salawat 100 times."},"ay.34":{"m":"Our Lord! Grant us mercy from Yourself and provide guidance for us in our affair.","a":"Today, read this dua before making a decision."},"nk.0":"Feed someone who is hungry","nk.1":"Call your parents or sit with them","nk.2":"Give a small charity — even 10 rupees","nk.3":"Give water to someone who is thirsty","nk.4":"Make tea/food for your family","nk.5":"Ask after someone who is ill","nk.6":"Give someone a sincere compliment","nk.7":"Help clean the masjid or neighbourhood","nk.8":"Put out water/grain for birds","nk.9":"Help someone pay a debt or bill","nk.10":"Tell young children a story of the Prophets","nk.11":"Try to reconcile with an upset relative","nk.12":"Teach someone an ayah of the Quran","nk.13":"Do a task for an elderly person","nk.14":"Donate clothes/things you don't use","nk.15":"Make heartfelt dua for someone (without telling them)","nk.16":"Remove a thorn/stone from the path","nk.17":"Forgive someone","nk.18":"Thank your children/spouse at home","nk.19":"Help a student with their studies","nk.20":"Pay a worker on time and generously","nk.21":"Spend an hour away from your phone with family","nk.22":"Send food to someone — neighbours first","nk.23":"Cover someone's fault","nk.24":"Serve a guest","nk.25":"Encourage someone who is troubled","nk.26":"Help an orphan or intend to sponsor one","nk.27":"Take someone with you to the masjid on Friday","nk.28":"Apologise to someone whose heart you hurt","nk.29":"A family salah or study circle at home"},"hi":{"az.kursi":{"t":"आयतुल कुर्सी","m":"अल्लाह के सिवा कोई माबूद नहीं, वह ज़िंदा और सबको थामने वाला है… (अल-बक़रह 2:255)। सुबह पढ़ने वाला शाम तक, शाम को पढ़ने वाला सुबह तक हिफ़ाज़त में।"},"az.quls":{"t":"तीन क़ुल","m":"सूरह इख़्लास, फ़लक़ और नास — 3 बार पढ़ना हर चीज़ के लिए काफ़ी है।"},"az.mulk":{"t":"अस्बह्ना व अस्बहल मुल्कु लिल्लाह","m":"हमने सुबह की और सारी बादशाही अल्लाह की है। ऐ रब! इस दिन की भलाई माँगता हूँ और इसकी बुराई, सुस्ती, बुढ़ापे की बुराई, आग और क़ब्र के अज़ाब से पनाह माँगता हूँ।"},"az.bika":{"t":"अल्लाहुम्म बिका अस्बह्ना","m":"ऐ अल्लाह! तेरे ही हुक्म से हमने सुबह/शाम की, तेरे ही हुक्म से जीते और मरते हैं, और तेरी ही तरफ़ लौटना है।"},"az.sayyid":{"t":"सय्यिदुल इस्तिग़फ़ार","m":"ऐ अल्लाह! तू मेरा रब है… मैं तेरे एहसानों का इक़रार और अपने गुनाह का एतराफ़ करता हूँ, मुझे माफ़ कर दे, तेरे सिवा कोई गुनाह माफ़ नहीं करता। (यक़ीन से पढ़ने वाला उस दिन/रात फ़ौत हो तो जन्नती है।)"},"az.afini":{"t":"अल्लाहुम्म आफ़िनी फ़ी बदनी","m":"ऐ अल्लाह! मेरे जिस्म, कान और आँखों में आफ़ियत दे। कुफ़्र, ग़ुरबत और क़ब्र के अज़ाब से तेरी पनाह।"},"az.hasbi":{"t":"हस्बियल्लाहु","m":"मुझे अल्लाह काफ़ी है, उसके सिवा कोई माबूद नहीं, उसी पर भरोसा है और वह अर्श-ए-अज़ीम का रब है।"},"az.bism":{"t":"बिस्मिल्लाहिल्लज़ी ला यज़ुर्रु","m":"अल्लाह के नाम से जिसके नाम के साथ ज़मीन और आसमान में कोई चीज़ नुक़सान नहीं दे सकती, वह सुनने वाला जानने वाला है।"},"az.radi":{"t":"रज़ीतु बिल्लाहि रब्बा","m":"मैं अल्लाह को रब, इस्लाम को दीन और मुहम्मद ﷺ को नबी मानकर राज़ी हूँ।"},"az.hayy":{"t":"या हय्यु या क़य्यूम","m":"ऐ ज़िंदा, ऐ थामने वाले! तेरी रहमत से मदद माँगता हूँ, मेरा हर काम ठीक कर दे और मुझे पलक झपकने के बराबर भी मेरे नफ़्स के हवाले न कर।"},"az.kalimat":{"t":"अऊज़ु बि कलिमातिल्लाह","m":"अल्लाह के कामिल कलिमात की पनाह, हर मख़लूक़ के शर से।"},"az.subhan":{"t":"सुब्हानल्लाहि व बि हम्दिही","m":"अल्लाह पाक है अपनी तारीफ़ के साथ। 100 बार पढ़ने वाले के गुनाह माफ़, चाहे समुंदर के झाग के बराबर हों।"},"az.istighfar":{"t":"अस्तग़फ़िरुल्लाह व अतूबु इलैह","m":"मैं अल्लाह से माफ़ी माँगता हूँ और उसकी तरफ़ रुजू करता हूँ। नबी ﷺ दिन में 100 बार इस्तिग़फ़ार करते थे।"},"az.durood":{"t":"दुरूद","m":"ऐ अल्लाह! हमारे नबी मुहम्मद ﷺ पर रहमत और सलामती नाज़िल फ़रमा।"},"du.neend":{"t":"नींद से उठना","m":"तमाम तारीफ़ उस अल्लाह की जिसने हमें मौत (नींद) के बाद ज़िंदा किया और उसी की तरफ़ उठकर जाना है।"},"du.sona":{"t":"सोने से पहले","m":"ऐ अल्लाह! तेरे नाम से मरता (सोता) और जीता (जागता) हूँ।"},"du.khana1":{"t":"खाने से पहले","m":"अल्लाह के नाम से। भूल जाएँ तो: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ (बिस्मिल्लाहि अव्वलहू व आख़िरहू)।"},"du.khana2":{"t":"खाने के बाद","m":"तारीफ़ उस अल्लाह की जिसने मुझे यह खिलाया और मेरी किसी ताक़त के बग़ैर अता किया। (पिछले गुनाह माफ़ होते हैं।)"},"du.nikalna":{"t":"घर से निकलना","m":"अल्लाह के नाम से, अल्लाह पर भरोसा किया, और न कोई ताक़त है न क़ुव्वत मगर अल्लाह से।"},"du.dakhil":{"t":"घर में दाख़िल होना","m":"अल्लाह के नाम से हम दाख़िल हुए और निकले, और अपने रब अल्लाह पर भरोसा किया। फिर घर वालों को सलाम करें।"},"du.bath1":{"t":"बाथरूम जाने से पहले","m":"अल्लाह के नाम से। ऐ अल्लाह! मैं नापाक जिन्न मर्द व औरत (शैतानों) से तेरी पनाह माँगता हूँ। (पहले बायाँ पाँव।)"},"du.bath2":{"t":"बाथरूम से निकलना","m":"(ऐ अल्लाह) तेरी बख़्शिश चाहता हूँ। (पहले दायाँ पाँव।)"},"du.wudu":{"t":"वुज़ू के बाद","m":"गवाही देता हूँ कि अल्लाह के सिवा कोई माबूद नहीं… और मुहम्मद ﷺ उसके बंदे और रसूल हैं। जन्नत के आठ दरवाज़े खुल जाते हैं। (वुज़ू से पहले: बिस्मिल्लाह)"},"du.masjid1":{"t":"मस्जिद में दाख़िल","m":"ऐ अल्लाह! मेरे लिए अपनी रहमत के दरवाज़े खोल दे। (दायाँ पाँव पहले।)"},"du.masjid2":{"t":"मस्जिद से निकलना","m":"ऐ अल्लाह! मैं तुझसे तेरा फ़ज़्ल माँगता हूँ। (बायाँ पाँव पहले।)"},"du.kapray":{"t":"कपड़े पहनना","m":"तारीफ़ उस अल्लाह की जिसने मुझे यह पहनाया और मेरी ताक़त के बग़ैर अता किया।"},"du.safar":{"t":"सवारी / सफ़र","m":"पाक है वह जिसने इसे हमारे क़ाबू में दिया, हम ख़ुद इसे क़ाबू न कर सकते थे, और हम अपने रब की तरफ़ लौटने वाले हैं।"},"du.azan":{"t":"अज़ान के बाद","m":"ऐ अल्लाह, इस कामिल पुकार और क़ायम होने वाली नमाज़ के रब! मुहम्मद ﷺ को वसीला और फ़ज़ीलत अता कर और उन्हें मक़ाम-ए-महमूद पर उठा जिसका तूने वादा किया। (शफ़ाअत नसीब होगी।)"},"du.cheenk":{"t":"छींक आए","m":"तमाम तारीफ़ अल्लाह की · अल्लाह तुम पर रहम करे · अल्लाह तुम्हें हिदायत दे और तुम्हारा हाल दुरुस्त करे।"},"du.gussa":{"t":"ग़ुस्सा आए","m":"मैं मरदूद शैतान से अल्लाह की पनाह माँगता हूँ। खड़े हों तो बैठ जाएँ, ख़ामोश हो जाएँ।"},"du.fikr":{"t":"परेशानी / ग़म","m":"ऐ अल्लाह! फ़िक्र, ग़म, आजिज़ी, सुस्ती, कंजूसी, बुज़दिली, क़र्ज़ के बोझ और लोगों के ग़लबे से तेरी पनाह।"},"du.musibat":{"t":"मुसीबत / नुक़सान","m":"हम अल्लाह ही के हैं और उसी की तरफ़ लौटने वाले हैं।"},"du.yunus":{"t":"मुश्किल वक़्त (दुआ-ए-यूनुस)","m":"तेरे सिवा कोई माबूद नहीं, तू पाक है, बेशक मैं ही ज़ालिमों में से था।"},"du.majlis":{"t":"मजलिस ख़त्म होने पर","m":"ऐ अल्लाह तू पाक है अपनी तारीफ़ के साथ, तेरे सिवा कोई माबूद नहीं, तुझसे माफ़ी माँगता और तौबा करता हूँ। (मजलिस की ग़लतियों का कफ़्फ़ारा।)"},"du.barish":{"t":"बारिश हो","m":"ऐ अल्लाह! इसे फ़ायदा देने वाली बारिश बना।"},"du.iftar":{"t":"रोज़ा इफ़्तार","m":"प्यास चली गई, रगें तर हो गईं और इंशाअल्लाह अज्र पक्का हो गया।"},"du.jazak":{"t":"कोई भलाई करे","m":"अल्लाह तुम्हें बेहतरीन बदला दे। (यह कहना बेहतरीन शुक्रिया है।)"},"du.walidain":{"t":"वालिदैन के लिए","m":"ऐ रब! उन दोनों पर रहम फ़रमा जैसे उन्होंने बचपन में मेरी परवरिश की।"},"du.ilm":{"t":"इल्म के लिए","m":"ऐ मेरे रब! मेरे इल्म में इज़ाफ़ा फ़रमा।"},"du.hasana":{"t":"दुनिया और आख़िरत की भलाई","m":"ऐ रब! हमें दुनिया में भी भलाई दे और आख़िरत में भी, और आग के अज़ाब से बचा। (नबी ﷺ की सबसे ज़्यादा माँगी जाने वाली दुआ।)"},"du.dil":{"t":"दीन पर साबित क़दमी","m":"ऐ दिलों को फेरने वाले! मेरा दिल अपने दीन पर जमा दे।"},"su.0":"दाएँ हाथ से खाना और पीना","su.1":"खाने से पहले “बिस्मिल्लाह” कहना","su.2":"सलाम में पहल करना — पहले सलाम करने वाला अल्लाह के ज़्यादा क़रीब","su.3":"भाई से मुस्कुराकर मिलना — यह भी सदक़ा है","su.4":"मिस्वाक करना (ख़ासकर वुज़ू/नमाज़ से पहले)","su.5":"वुज़ू के बाद 2 रकअत तहिय्यतुल वुज़ू","su.6":"दाईं करवट पर सोना","su.7":"सोने से पहले वुज़ू करना","su.8":"बैठकर पानी पीना, तीन साँस में","su.9":"जूता पहले दायाँ पहनना, उतारते वक़्त पहले बायाँ","su.10":"छींक पर “अल्हम्दुलिल्लाह” कहना","su.11":"अज़ान का जवाब देना और बाद की दुआ पढ़ना","su.12":"फ़ज्र से पहले 2 सुन्नत — दुनिया और उसकी हर चीज़ से बेहतर","su.13":"किसी भाई के लिए उसकी ग़ैरमौजूदगी में दुआ","su.14":"किसी मरीज़ की अयादत (या फ़ोन पर हाल पूछना)","su.15":"किसी को तोहफ़ा देना — मोहब्बत बढ़ती है","su.16":"रास्ते से तकलीफ़देह चीज़ हटा देना","su.17":"खाने के बाद प्लेट साफ़ करना और उँगलियाँ चाटना","su.18":"हर फ़र्ज़ नमाज़ के बाद आयतुल कुर्सी","su.19":"सोने से पहले तीनों क़ुल पढ़कर हाथों पर फूँककर जिस्म पर फेरना","su.20":"सोने से पहले तस्बीह-ए-फ़ातिमा: 33 सुब्हानल्लाह, 33 अल्हम्दुलिल्लाह, 34 अल्लाहु अकबर","su.21":"ग़ुस्सा आए तो ख़ामोश हो जाना / बैठ जाना","su.22":"अच्छी बात कहो या ख़ामोश रहो","su.23":"घर में दाख़िल होकर सलाम करना","su.24":"घर के काम में हाथ बँटाना","su.25":"मेहमान की इज़्ज़त करना","su.26":"ख़ुशबू लगाना","su.27":"पीर या जुमेरात का नफ़्ली रोज़ा","su.28":"चाश्त (ज़ुहा) की नमाज़ — 2 रकअत","su.29":"मजलिस के आख़िर में कफ़्फ़ारा-ए-मजलिस की दुआ","su.30":"नींद से उठकर दुआ “अल्हम्दु लिल्लाहिल्लज़ी अह्याना…”","su.31":"खाने में ऐब न निकालना","su.32":"मस्जिद में दायाँ पाँव पहले रखना","su.33":"कसरत से दुरूद — एक दुरूद पर दस रहमतें","ay.0":{"m":"तुम मुझे याद करो, मैं तुम्हें याद करूँगा, और मेरा शुक्र करो।","a":"आज 5 मिनट सिर्फ़ ज़िक्र करें — सुब्हानल्लाह, अल्हम्दुलिल्लाह।"},"ay.1":{"m":"सब्र और नमाज़ से मदद लो, बेशक अल्लाह सब्र करने वालों के साथ है।","a":"आज किसी परेशानी पर शिकायत के बजाय 2 रकअत पढ़कर दुआ करें।"},"ay.2":{"m":"मैं क़रीब हूँ, पुकारने वाले की पुकार सुनता हूँ।","a":"आज अपनी ज़बान में अल्लाह से दिल खोलकर एक दुआ माँगें।"},"ay.3":{"m":"अल्लाह किसी पर उसकी ताक़त से ज़्यादा बोझ नहीं डालता।","a":"आज अपने एक बोझ को अल्लाह के हवाले करें और इस आयत की दुआ पढ़ें।"},"ay.4":{"m":"जो ग़ुस्सा पी जाते और लोगों को माफ़ कर देते हैं — अल्लाह मोहसिनों से मोहब्बत करता है।","a":"आज किसी एक शख़्स को दिल से माफ़ कर दें।"},"ay.5":{"m":"अल्लाह की रहमत से आप नर्मदिल हुए; सख़्त होते तो लोग दूर हो जाते।","a":"आज घर वालों से नर्मी से बात करें, आवाज़ ऊँची न करें।"},"ay.6":{"m":"अल्लाह की इबादत करो, वालिदैन, रिश्तेदारों, यतीमों और पड़ोसियों से भलाई करो।","a":"आज किसी पड़ोसी का हाल पूछें या कुछ भेजें।"},"ay.7":{"m":"जब तुम्हें सलाम किया जाए तो उससे बेहतर जवाब दो।","a":"आज हर सलाम का पूरा जवाब दें: व अलैकुमुस्सलाम व रहमतुल्लाहि व बरकातुहू।"},"ay.8":{"m":"नेकी और तक़वा में एक-दूसरे की मदद करो, गुनाह और ज़ुल्म में नहीं।","a":"आज किसी की एक नेक काम में मदद करें।"},"ay.9":{"m":"खाओ-पियो मगर फ़ुज़ूलख़र्ची न करो।","a":"आज खाना ज़ाया न करें — प्लेट में उतना लें जितना खाना है।"},"ay.10":{"m":"सुनो! अल्लाह के ज़िक्र से ही दिलों को इत्मीनान मिलता है।","a":"बेचैनी हो तो फ़ोन के बजाय 33 बार सुब्हानल्लाह पढ़ें।"},"ay.11":{"m":"अगर शुक्र करोगे तो मैं तुम्हें और ज़्यादा दूँगा।","a":"आज 3 नेमतें लिखें जिनका शुक्र अदा करना है।"},"ay.12":{"m":"अल्लाह अद्ल, एहसान और रिश्तेदारों को देने का हुक्म देता है।","a":"आज किसी रिश्तेदार को फ़ोन करें या मिलें।"},"ay.13":{"m":"वालिदैन को “उफ़” तक न कहो, उनसे इज़्ज़त से बात करो।","a":"आज वालिदैन से नर्मी से बात करें और उनके लिए दुआ करें।"},"ay.14":{"m":"जिस बात का इल्म न हो उसके पीछे न पड़ो; कान, आँख, दिल सबसे सवाल होगा।","a":"आज कोई बात बिना तहक़ीक़ आगे फ़ॉरवर्ड न करें।"},"ay.15":{"m":"कहो: ऐ रब! मेरे इल्म में इज़ाफ़ा फ़रमा।","a":"आज दीन की एक नई बात सीखें और किसी को बताएँ।"},"ay.16":{"m":"माफ़ करो और दरगुज़र करो — क्या तुम नहीं चाहते कि अल्लाह तुम्हें माफ़ करे?","a":"आज किसी पुरानी नाराज़गी को ख़त्म करने का पहला क़दम उठाएँ।"},"ay.17":{"m":"मोमिन मर्द अपनी निगाहें नीची रखें — यह उनके लिए पाकीज़गी है।","a":"आज निगाह की हिफ़ाज़त करें, ख़ासकर फ़ोन पर।"},"ay.18":{"m":"रहमान के बंदे ज़मीन पर आजिज़ी से चलते हैं, जाहिलों को सलाम कहकर गुज़र जाते हैं।","a":"आज किसी बहस में जवाब देने के बजाय “सलाम” कहकर छोड़ दें।"},"ay.19":{"m":"नमाज़ बेहयाई और बुराई से रोकती है, और अल्लाह का ज़िक्र सबसे बड़ा है।","a":"आज हर नमाज़ वक़्त पर पढ़ने की कोशिश करें।"},"ay.20":{"m":"लोगों से मुँह फेरकर बात न करो और अकड़कर न चलो।","a":"आज सबसे — छोटे-बड़े — मुस्कुराकर और ध्यान से मिलें।"},"ay.21":{"m":"ऐ ईमान वालो! अल्लाह को कसरत से याद करो।","a":"आज काम करते हुए ज़बान पर ज़िक्र जारी रखें।"},"ay.22":{"m":"अल्लाह की रहमत से मायूस न हो, अल्लाह सारे गुनाह माफ़ कर देता है।","a":"आज सच्ची तौबा करें — 100 बार इस्तिग़फ़ार।"},"ay.23":{"m":"कोई ख़बर लाए तो तहक़ीक़ कर लो।","a":"आज व्हाट्सऐप पर कोई ख़बर बिना तसदीक़ शेयर न करें।"},"ay.24":{"m":"मोमिन आपस में भाई हैं, अपने भाइयों में सुलह करवाओ।","a":"आज दो नाराज़ लोगों में सुलह की कोशिश या ख़ुद सुलह करें।"},"ay.25":{"m":"कोई क़ौम दूसरी क़ौम का मज़ाक़ न उड़ाए, न बुरे नाम रखो।","a":"आज किसी का मज़ाक़ या बुरा नाम लेने से बचें।"},"ay.26":{"m":"बदगुमानी से बचो, जासूसी न करो, ग़ीबत न करो।","a":"आज ग़ीबत से पूरा परहेज़ — मजलिस में हो तो बात बदल दें।"},"ay.27":{"m":"हर जान देखे कि उसने कल (आख़िरत) के लिए क्या आगे भेजा।","a":"आज रात मुहासबा ज़रूर करें।"},"ay.28":{"m":"जो अल्लाह पर भरोसा करे, अल्लाह उसे काफ़ी है।","a":"आज एक फ़िक्र पर “हस्बियल्लाह” पढ़कर भरोसा करें।"},"ay.29":{"m":"अपने रब की नेमत का ज़िक्र करो।","a":"आज किसी को बताएँ कि अल्लाह ने आप पर क्या एहसान किया।"},"ay.30":{"m":"बेशक मुश्किल के साथ आसानी है।","a":"आज किसी परेशान दोस्त को यह आयत सुनाकर हौसला दें।"},"ay.31":{"m":"सिवाय उनके जो ईमान लाए, नेक अमल किए, हक़ और सब्र की तलक़ीन की।","a":"आज किसी को प्यार से एक नेकी की याद-दिहानी करें।"},"ay.32":{"m":"नमाज़ क़ायम करो, ज़कात दो और रुकू करने वालों के साथ रुकू करो।","a":"आज कम से कम एक नमाज़ जमाअत के साथ पढ़ें।"},"ay.33":{"m":"अल्लाह और उसके फ़रिश्ते नबी ﷺ पर दुरूद भेजते हैं — तुम भी दुरूद और सलाम भेजो।","a":"आज 100 बार दुरूद पढ़ें।"},"ay.34":{"m":"ऐ रब! हमें अपने पास से रहमत दे और हमारे काम में हिदायत मुहैया कर।","a":"आज किसी फ़ैसले से पहले यह दुआ पढ़ें।"},"nk.0":"किसी भूखे को खाना खिलाएँ","nk.1":"वालिदैन को फ़ोन करें या उनके पास बैठें","nk.2":"छोटा-सा सदक़ा दें — 10 रुपये भी","nk.3":"किसी प्यासे को पानी पिलाएँ","nk.4":"घर वालों के लिए चाय/खाना बनाएँ","nk.5":"किसी बीमार का हाल पूछें","nk.6":"किसी की सच्ची तारीफ़ करें","nk.7":"मस्जिद या मोहल्ले की सफ़ाई में हिस्सा","nk.8":"परिंदों के लिए पानी/दाना रखें","nk.9":"किसी का क़र्ज़ या बिल अदा करने में मदद","nk.10":"छोटे बच्चों को नबियों का एक क़िस्सा सुनाएँ","nk.11":"किसी नाराज़ रिश्तेदार से सुलह की कोशिश","nk.12":"किसी को क़ुरआन की एक आयत सिखाएँ","nk.13":"किसी बुज़ुर्ग का काम कर दें","nk.14":"अपने कपड़े/चीज़ें जो इस्तेमाल नहीं, दान करें","nk.15":"किसी के लिए दिल से दुआ करें (बिना बताए)","nk.16":"रास्ते से काँटा/पत्थर हटाएँ","nk.17":"किसी को माफ़ कर दें","nk.18":"घर में बच्चों/बीवी/शौहर का शुक्रिया अदा करें","nk.19":"किसी छात्र की पढ़ाई में मदद","nk.20":"किसी नौकर/मज़दूर को वक़्त पर और अच्छी तरह उजरत दें","nk.21":"एक घंटा फ़ोन से दूर रहकर फ़ैमिली को वक़्त दें","nk.22":"किसी को खाना भेज दें — पड़ोसी पहले","nk.23":"किसी के ऐब पर पर्दा डालें","nk.24":"मेहमान की ख़िदमत","nk.25":"किसी परेशान को हौसला दें","nk.26":"किसी यतीम की मदद या किफ़ालत की नीयत","nk.27":"जुमा को किसी को मस्जिद साथ ले जाएँ","nk.28":"किसी से माफ़ी माँग लें जिसका दिल दुखाया","nk.29":"घर में एक साथ नमाज़ या तालीम का हल्क़ा"},"id":{"az.kursi":{"t":"Ayat Kursi","m":"Allah, tiada tuhan selain Dia, Yang Maha Hidup lagi terus-menerus mengurus makhluk… (Al-Baqarah 2:255). Yang membacanya di pagi hari terjaga hingga petang, dan di petang hari terjaga hingga pagi."},"az.quls":{"t":"Tiga Qul","m":"Surah Al-Ikhlas, Al-Falaq dan An-Nas — dibaca 3 kali mencukupi dari segala sesuatu."},"az.mulk":{"t":"Ashbahna wa ashbahal mulku lillah","m":"Kami memasuki pagi dan seluruh kerajaan milik Allah. Ya Rabb! Aku memohon kebaikan hari ini, dan berlindung dari keburukannya, dari kemalasan, buruknya usia tua, serta azab neraka dan kubur."},"az.bika":{"t":"Allahumma bika ashbahna","m":"Ya Allah! Dengan-Mu kami memasuki pagi/petang, dengan-Mu kami hidup dan mati, dan kepada-Mu tempat kembali."},"az.sayyid":{"t":"Sayyidul Istighfar","m":"Ya Allah! Engkau Rabbku… aku mengakui nikmat-Mu dan mengakui dosaku, maka ampunilah aku, karena tiada yang mengampuni dosa selain Engkau. (Siapa membacanya dengan yakin lalu wafat pada hari/malam itu, termasuk penghuni surga.)"},"az.afini":{"t":"Allahumma 'afini fi badani","m":"Ya Allah! Berilah kesehatan pada badanku, pendengaranku dan penglihatanku. Aku berlindung kepada-Mu dari kekufuran, kefakiran dan azab kubur."},"az.hasbi":{"t":"Hasbiyallahu","m":"Cukuplah Allah bagiku, tiada tuhan selain Dia; kepada-Nya aku bertawakal, dan Dia Rabb 'Arsy yang agung."},"az.bism":{"t":"Bismillahil-ladzi la yadhurru","m":"Dengan nama Allah yang bersama nama-Nya tiada sesuatu pun di bumi dan di langit yang dapat membahayakan; Dia Maha Mendengar lagi Maha Mengetahui."},"az.radi":{"t":"Radhitu billahi Rabba","m":"Aku ridha Allah sebagai Rabb, Islam sebagai agama, dan Muhammad ﷺ sebagai Nabi."},"az.hayy":{"t":"Ya Hayyu ya Qayyum","m":"Wahai Yang Maha Hidup, wahai Yang terus-menerus mengurus! Dengan rahmat-Mu aku memohon pertolongan; perbaikilah seluruh urusanku dan jangan serahkan aku kepada diriku walau sekejap mata."},"az.kalimat":{"t":"A'udzu bi kalimatillah","m":"Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan makhluk-Nya."},"az.subhan":{"t":"Subhanallahi wa bihamdihi","m":"Maha Suci Allah dan segala puji bagi-Nya. Yang membacanya 100 kali diampuni dosanya walau sebanyak buih di lautan."},"az.istighfar":{"t":"Astaghfirullaha wa atubu ilaih","m":"Aku memohon ampun kepada Allah dan bertaubat kepada-Nya. Nabi ﷺ beristighfar 100 kali sehari."},"az.durood":{"t":"Shalawat","m":"Ya Allah! Limpahkan rahmat dan keselamatan kepada Nabi kami Muhammad ﷺ."},"du.neend":{"t":"Bangun tidur","m":"Segala puji bagi Allah yang menghidupkan kami setelah mematikan (menidurkan) kami, dan kepada-Nya kami dibangkitkan."},"du.sona":{"t":"Sebelum tidur","m":"Ya Allah! Dengan nama-Mu aku mati (tidur) dan hidup (bangun)."},"du.khana1":{"t":"Sebelum makan","m":"Dengan nama Allah. Jika lupa: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ (Bismillahi awwalahu wa akhirahu)."},"du.khana2":{"t":"Sesudah makan","m":"Segala puji bagi Allah yang memberiku makanan ini dan merezekikannya tanpa daya dan kekuatan dariku. (Dosa yang lalu diampuni.)"},"du.nikalna":{"t":"Keluar rumah","m":"Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan kecuali dengan Allah."},"du.dakhil":{"t":"Masuk rumah","m":"Dengan nama Allah kami masuk dan keluar, dan kepada Rabb kami Allah kami bertawakal. Lalu ucapkan salam kepada keluarga."},"du.bath1":{"t":"Sebelum masuk kamar mandi","m":"Dengan nama Allah. Ya Allah! Aku berlindung kepada-Mu dari setan laki-laki dan perempuan. (Kaki kiri dahulu.)"},"du.bath2":{"t":"Keluar kamar mandi","m":"(Ya Allah) aku memohon ampunan-Mu. (Kaki kanan dahulu.)"},"du.wudu":{"t":"Setelah wudhu","m":"Aku bersaksi tiada tuhan selain Allah… dan Muhammad ﷺ hamba dan utusan-Nya. Delapan pintu surga dibukakan. (Sebelum wudhu: Bismillah)"},"du.masjid1":{"t":"Masuk masjid","m":"Ya Allah! Bukakanlah untukku pintu-pintu rahmat-Mu. (Kaki kanan dahulu.)"},"du.masjid2":{"t":"Keluar masjid","m":"Ya Allah! Aku memohon karunia-Mu. (Kaki kiri dahulu.)"},"du.kapray":{"t":"Memakai pakaian","m":"Segala puji bagi Allah yang memakaikan pakaian ini kepadaku dan merezekikannya tanpa daya dariku."},"du.safar":{"t":"Naik kendaraan / safar","m":"Maha Suci Dia yang menundukkan ini untuk kami, padahal kami tidak mampu menguasainya, dan sungguh kami akan kembali kepada Rabb kami."},"du.azan":{"t":"Setelah azan","m":"Ya Allah, Rabb panggilan yang sempurna ini dan shalat yang akan didirikan! Berikanlah kepada Muhammad ﷺ wasilah dan keutamaan, dan bangkitkanlah beliau ke kedudukan terpuji yang Engkau janjikan. (Mendapat syafaat.)"},"du.cheenk":{"t":"Saat bersin","m":"Segala puji bagi Allah · Semoga Allah merahmatimu · Semoga Allah memberimu petunjuk dan memperbaiki keadaanmu."},"du.gussa":{"t":"Saat marah","m":"Aku berlindung kepada Allah dari setan yang terkutuk. Jika berdiri, duduklah; dan diamlah."},"du.fikr":{"t":"Gelisah / sedih","m":"Ya Allah! Aku berlindung kepada-Mu dari kegelisahan, kesedihan, kelemahan, kemalasan, kekikiran, sifat pengecut, lilitan utang dan penindasan orang."},"du.musibat":{"t":"Musibah / kehilangan","m":"Sesungguhnya kami milik Allah dan kepada-Nya kami kembali."},"du.yunus":{"t":"Masa sulit (Doa Nabi Yunus)","m":"Tiada tuhan selain Engkau, Maha Suci Engkau, sungguh aku termasuk orang-orang yang zalim."},"du.majlis":{"t":"Penutup majelis","m":"Maha Suci Engkau ya Allah dan segala puji bagi-Mu; tiada tuhan selain Engkau; aku memohon ampun dan bertaubat kepada-Mu. (Kafarat kesalahan dalam majelis.)"},"du.barish":{"t":"Saat hujan","m":"Ya Allah! Jadikanlah hujan yang bermanfaat."},"du.iftar":{"t":"Berbuka puasa","m":"Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap, InsyaAllah."},"du.jazak":{"t":"Ketika diberi kebaikan","m":"Semoga Allah membalasmu dengan kebaikan. (Ucapan ini adalah terima kasih terbaik.)"},"du.walidain":{"t":"Untuk orang tua","m":"Ya Rabb! Sayangilah keduanya sebagaimana mereka mendidikku di waktu kecil."},"du.ilm":{"t":"Untuk ilmu","m":"Ya Rabbku! Tambahkanlah ilmuku."},"du.hasana":{"t":"Kebaikan dunia dan akhirat","m":"Ya Rabb! Berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka. (Doa yang paling sering dipanjatkan Nabi ﷺ.)"},"du.dil":{"t":"Keteguhan dalam agama","m":"Wahai Yang membolak-balikkan hati! Teguhkanlah hatiku di atas agama-Mu."},"su.0":"Makan dan minum dengan tangan kanan","su.1":"Mengucapkan “Bismillah” sebelum makan","su.2":"Mendahului salam — yang memberi salam lebih dulu lebih dekat kepada Allah","su.3":"Menemui saudara dengan senyum — itu juga sedekah","su.4":"Bersiwak (terutama sebelum wudhu/shalat)","su.5":"2 rakaat Tahiyyatul Wudhu setelah wudhu","su.6":"Tidur di sisi kanan","su.7":"Berwudhu sebelum tidur","su.8":"Minum sambil duduk, dalam 3 tegukan","su.9":"Memakai sandal mulai kanan, melepas mulai kiri","su.10":"Mengucapkan “Alhamdulillah” saat bersin","su.11":"Menjawab azan dan membaca doa setelahnya","su.12":"2 rakaat sunnah sebelum Subuh — lebih baik dari dunia dan isinya","su.13":"Mendoakan saudara tanpa sepengetahuannya","su.14":"Menjenguk orang sakit (atau menanyakan kabarnya lewat telepon)","su.15":"Memberi hadiah — menumbuhkan rasa cinta","su.16":"Menyingkirkan gangguan dari jalan","su.17":"Membersihkan piring dan menjilat jari setelah makan","su.18":"Ayat Kursi setelah setiap shalat fardhu","su.19":"Sebelum tidur membaca tiga Qul, meniup kedua telapak tangan dan mengusapkannya ke tubuh","su.20":"Tasbih Fatimah sebelum tidur: 33 Subhanallah, 33 Alhamdulillah, 34 Allahu Akbar","su.21":"Diam / duduk saat marah","su.22":"Berkata baik atau diam","su.23":"Mengucapkan salam saat masuk rumah","su.24":"Membantu pekerjaan rumah","su.25":"Memuliakan tamu","su.26":"Memakai wewangian","su.27":"Puasa sunnah Senin atau Kamis","su.28":"Shalat Dhuha — 2 rakaat","su.29":"Doa kafaratul majelis di akhir majelis","su.30":"Doa bangun tidur “Alhamdulillahil-ladzi ahyana…”","su.31":"Tidak mencela makanan","su.32":"Masuk masjid dengan kaki kanan dahulu","su.33":"Memperbanyak shalawat — sepuluh rahmat untuk setiap shalawat","ay.0":{"m":"Ingatlah Aku, niscaya Aku ingat kepadamu, dan bersyukurlah kepada-Ku.","a":"Luangkan 5 menit hari ini hanya untuk dzikir — Subhanallah, Alhamdulillah."},"ay.1":{"m":"Mohonlah pertolongan dengan sabar dan shalat; sungguh Allah bersama orang-orang yang sabar.","a":"Hari ini, alih-alih mengeluh, shalat 2 rakaat lalu berdoa."},"ay.2":{"m":"Aku dekat; Aku mengabulkan doa orang yang berdoa apabila ia berdoa kepada-Ku.","a":"Hari ini, mintalah kepada Allah dari hati dengan bahasa Anda sendiri."},"ay.3":{"m":"Allah tidak membebani seseorang melainkan sesuai kesanggupannya.","a":"Hari ini, serahkan satu beban Anda kepada Allah dan baca doa dari ayat ini."},"ay.4":{"m":"Orang-orang yang menahan amarah dan memaafkan manusia — Allah mencintai orang-orang yang berbuat baik.","a":"Hari ini, maafkan satu orang dengan tulus."},"ay.5":{"m":"Karena rahmat Allah engkau berlaku lemah lembut; sekiranya engkau kasar, tentu mereka menjauh.","a":"Hari ini, bicaralah lembut kepada keluarga; jangan meninggikan suara."},"ay.6":{"m":"Sembahlah Allah, dan berbuat baiklah kepada orang tua, kerabat, anak yatim dan tetangga.","a":"Hari ini, tanyakan kabar seorang tetangga atau kirimi sesuatu."},"ay.7":{"m":"Apabila kamu diberi salam, balaslah dengan yang lebih baik.","a":"Hari ini, jawab setiap salam dengan lengkap: Wa'alaikumussalam wa rahmatullahi wa barakatuh."},"ay.8":{"m":"Tolong-menolonglah dalam kebaikan dan takwa, bukan dalam dosa dan permusuhan.","a":"Hari ini, bantu seseorang dalam satu amal baik."},"ay.9":{"m":"Makan dan minumlah, tetapi jangan berlebihan.","a":"Jangan membuang makanan hari ini — ambil secukupnya."},"ay.10":{"m":"Ingatlah, hanya dengan mengingat Allah hati menjadi tenteram.","a":"Saat gelisah, ucapkan Subhanallah 33 kali alih-alih membuka ponsel."},"ay.11":{"m":"Jika kamu bersyukur, niscaya Aku tambahkan nikmat kepadamu.","a":"Hari ini, tulis 3 nikmat yang perlu disyukuri."},"ay.12":{"m":"Allah memerintahkan berlaku adil, berbuat ihsan dan memberi kepada kerabat.","a":"Hari ini, telepon atau kunjungi seorang kerabat."},"ay.13":{"m":"Jangan katakan “ah” kepada orang tua; ucapkanlah perkataan yang mulia.","a":"Hari ini, bicaralah lembut kepada orang tua dan doakan mereka."},"ay.14":{"m":"Jangan mengikuti sesuatu yang tidak kamu ketahui; pendengaran, penglihatan dan hati akan dimintai tanggung jawab.","a":"Hari ini, jangan meneruskan kabar apa pun tanpa memeriksanya."},"ay.15":{"m":"Katakanlah: Ya Rabbku, tambahkanlah ilmuku.","a":"Hari ini, pelajari satu hal baru tentang agama dan sampaikan kepada orang lain."},"ay.16":{"m":"Hendaklah mereka memaafkan dan berlapang dada — tidakkah kamu ingin Allah mengampunimu?","a":"Hari ini, ambil langkah pertama untuk mengakhiri perselisihan lama."},"ay.17":{"m":"Katakan kepada laki-laki beriman agar menundukkan pandangan — itu lebih suci bagi mereka.","a":"Hari ini, jaga pandangan, terutama di ponsel."},"ay.18":{"m":"Hamba-hamba Ar-Rahman berjalan di bumi dengan rendah hati, dan bila orang jahil menyapa mereka, mereka mengucapkan “salam”.","a":"Hari ini, alih-alih membalas debat, ucapkan “salam” lalu tinggalkan."},"ay.19":{"m":"Shalat mencegah dari perbuatan keji dan mungkar, dan mengingat Allah lebih besar.","a":"Hari ini, usahakan setiap shalat tepat waktu."},"ay.20":{"m":"Jangan memalingkan wajah dari manusia dan jangan berjalan dengan angkuh.","a":"Hari ini, sambut semua orang — kecil maupun besar — dengan senyum dan perhatian."},"ay.21":{"m":"Wahai orang-orang beriman! Ingatlah Allah sebanyak-banyaknya.","a":"Hari ini, basahi lisan dengan dzikir sambil bekerja."},"ay.22":{"m":"Jangan berputus asa dari rahmat Allah; Allah mengampuni semua dosa.","a":"Bertaubatlah dengan sungguh-sungguh hari ini — 100 kali istighfar."},"ay.23":{"m":"Jika datang kepadamu suatu berita, periksalah kebenarannya.","a":"Hari ini, jangan bagikan berita apa pun di WhatsApp tanpa verifikasi."},"ay.24":{"m":"Orang-orang beriman itu bersaudara, maka damaikanlah saudara-saudaramu.","a":"Hari ini, cobalah mendamaikan dua orang yang berselisih — atau berdamailah sendiri."},"ay.25":{"m":"Janganlah suatu kaum mengolok-olok kaum lain, dan jangan saling memanggil dengan gelar buruk.","a":"Hari ini, hindari mengolok-olok atau memanggil orang dengan julukan buruk."},"ay.26":{"m":"Jauhilah prasangka, jangan memata-matai, dan jangan bergunjing.","a":"Hindari ghibah sepenuhnya hari ini — jika muncul di majelis, alihkan pembicaraan."},"ay.27":{"m":"Hendaklah setiap jiwa memperhatikan apa yang telah diperbuatnya untuk hari esok (akhirat).","a":"Pastikan bermuhasabah malam ini."},"ay.28":{"m":"Siapa bertawakal kepada Allah, Allah mencukupinya.","a":"Hari ini, ucapkan “Hasbiyallah” atas satu kekhawatiran dan bertawakallah."},"ay.29":{"m":"Dan nikmat Rabbmu, hendaklah engkau siarkan.","a":"Hari ini, ceritakan kepada seseorang nikmat yang Allah berikan kepada Anda."},"ay.30":{"m":"Sesungguhnya bersama kesulitan ada kemudahan.","a":"Hari ini, semangati teman yang sedang susah dengan ayat ini."},"ay.31":{"m":"Kecuali orang-orang yang beriman, beramal saleh, serta saling menasihati dalam kebenaran dan kesabaran.","a":"Hari ini, ingatkan seseorang dengan lembut akan satu kebaikan."},"ay.32":{"m":"Dirikanlah shalat, tunaikan zakat, dan rukuklah bersama orang-orang yang rukuk.","a":"Hari ini, kerjakan minimal satu shalat berjamaah."},"ay.33":{"m":"Allah dan para malaikat-Nya bershalawat kepada Nabi ﷺ — bershalawatlah kalian dan ucapkan salam kepadanya.","a":"Hari ini, bershalawatlah 100 kali."},"ay.34":{"m":"Ya Rabb kami! Berikanlah rahmat dari sisi-Mu dan sempurnakanlah petunjuk dalam urusan kami.","a":"Hari ini, bacalah doa ini sebelum mengambil keputusan."},"nk.0":"Beri makan orang yang lapar","nk.1":"Telepon orang tua atau duduk bersama mereka","nk.2":"Bersedekah kecil — walau sedikit","nk.3":"Beri minum orang yang haus","nk.4":"Buatkan teh/makanan untuk keluarga","nk.5":"Tanyakan kabar orang sakit","nk.6":"Puji seseorang dengan tulus","nk.7":"Ikut membersihkan masjid atau lingkungan","nk.8":"Sediakan air/biji-bijian untuk burung","nk.9":"Bantu seseorang melunasi utang atau tagihan","nk.10":"Ceritakan kisah para Nabi kepada anak-anak","nk.11":"Coba berdamai dengan kerabat yang sedang marah","nk.12":"Ajarkan satu ayat Al-Qur'an kepada seseorang","nk.13":"Bantu pekerjaan orang tua/lansia","nk.14":"Sumbangkan pakaian/barang yang tidak terpakai","nk.15":"Doakan seseorang dari hati (tanpa memberitahunya)","nk.16":"Singkirkan duri/batu dari jalan","nk.17":"Maafkan seseorang","nk.18":"Ucapkan terima kasih kepada anak/istri/suami di rumah","nk.19":"Bantu belajar seorang pelajar","nk.20":"Bayar upah pekerja tepat waktu dan dengan baik","nk.21":"Satu jam jauh dari ponsel untuk keluarga","nk.22":"Kirim makanan kepada seseorang — tetangga dahulu","nk.23":"Tutupi aib seseorang","nk.24":"Layani tamu","nk.25":"Semangati orang yang sedang susah","nk.26":"Bantu anak yatim atau berniat menanggungnya","nk.27":"Ajak seseorang ke masjid pada hari Jumat","nk.28":"Minta maaf kepada orang yang pernah Anda sakiti","nk.29":"Shalat berjamaah atau halaqah ilmu bersama di rumah"},"ur":{"az.kursi":{"t":"آیت الکرسی","m":"اللہ کے سوا کوئی معبود نہیں، وہ زندہ اور سب کو تھامنے والا ہے… (البقرہ 2:255)۔ صبح پڑھنے والا شام تک، شام کو پڑھنے والا صبح تک حفاظت میں۔"},"az.quls":{"t":"تین قل","m":"سورۂ اخلاص، فلق اور ناس — 3 مرتبہ پڑھنا ہر چیز کے لیے کافی ہے۔"},"az.mulk":{"t":"اَصْبَحْنَا وَاَصْبَحَ الْمُلْكُ لِلّٰهِ","m":"ہم نے صبح کی اور ساری بادشاہی اللہ کی ہے۔ اے رب! اس دن کی بھلائی مانگتا ہوں اور اس کی برائی، سستی، بڑھاپے کی برائی، آگ اور قبر کے عذاب سے پناہ مانگتا ہوں۔"},"az.bika":{"t":"اَللّٰهُمَّ بِكَ اَصْبَحْنَا","m":"اے اللہ! تیرے ہی حکم سے ہم نے صبح/شام کی، تیرے ہی حکم سے جیتے اور مرتے ہیں، اور تیری ہی طرف لوٹنا ہے۔"},"az.sayyid":{"t":"سید الاستغفار","m":"اے اللہ! تو میرا رب ہے… میں تیرے احسانات کا اقرار اور اپنے گناہ کا اعتراف کرتا ہوں، مجھے معاف کر دے، تیرے سوا کوئی گناہ معاف نہیں کرتا۔ (یقین سے پڑھنے والا اس دن/رات فوت ہو تو جنتی ہے۔)"},"az.afini":{"t":"اَللّٰهُمَّ عَافِنِيْ فِيْ بَدَنِيْ","m":"اے اللہ! میرے جسم، کان اور آنکھوں میں عافیت دے۔ کفر، غربت اور قبر کے عذاب سے تیری پناہ۔"},"az.hasbi":{"t":"حَسْبِيَ اللّٰهُ","m":"مجھے اللہ کافی ہے، اس کے سوا کوئی معبود نہیں، اسی پر بھروسہ ہے اور وہ عرشِ عظیم کا رب ہے۔"},"az.bism":{"t":"بِسْمِ اللّٰهِ الَّذِيْ لَا يَضُرُّ","m":"اللہ کے نام سے جس کے نام کے ساتھ زمین و آسمان میں کوئی چیز نقصان نہیں دے سکتی، وہ سننے والا جاننے والا ہے۔"},"az.radi":{"t":"رَضِيْتُ بِاللّٰهِ رَبًّا","m":"میں اللہ کو رب، اسلام کو دین اور محمد ﷺ کو نبی مان کر راضی ہوں۔"},"az.hayy":{"t":"يَا حَيُّ يَا قَيُّوْمُ","m":"اے زندہ، اے تھامنے والے! تیری رحمت سے مدد مانگتا ہوں، میرا ہر کام ٹھیک کر دے اور مجھے پلک جھپکنے کے برابر بھی میرے نفس کے حوالے نہ کر۔"},"az.kalimat":{"t":"اَعُوْذُ بِكَلِمَاتِ اللّٰهِ","m":"اللہ کے کامل کلمات کی پناہ، ہر مخلوق کے شر سے۔"},"az.subhan":{"t":"سُبْحَانَ اللّٰهِ وَبِحَمْدِهٖ","m":"اللہ پاک ہے اپنی تعریف کے ساتھ۔ 100 مرتبہ پڑھنے والے کے گناہ معاف، چاہے سمندر کی جھاگ کے برابر ہوں۔"},"az.istighfar":{"t":"اَسْتَغْفِرُ اللّٰهَ وَاَتُوْبُ اِلَيْهِ","m":"میں اللہ سے معافی مانگتا ہوں اور اس کی طرف رجوع کرتا ہوں۔ نبی ﷺ دن میں 100 مرتبہ استغفار کرتے۔"},"az.durood":{"t":"درود","m":"اے اللہ! ہمارے نبی محمد ﷺ پر رحمت اور سلامتی نازل فرما۔"},"du.neend":{"t":"نیند سے اٹھنا","m":"تمام تعریف اس اللہ کی جس نے ہمیں موت (نیند) کے بعد زندہ کیا اور اسی کی طرف اٹھ کر جانا ہے۔"},"du.sona":{"t":"سونے سے پہلے","m":"اے اللہ! تیرے نام سے مرتا (سوتا) اور جیتا (جاگتا) ہوں۔"},"du.khana1":{"t":"کھانے سے پہلے","m":"اللہ کے نام سے۔ بھول جائیں تو: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ۔"},"du.khana2":{"t":"کھانے کے بعد","m":"تعریف اس اللہ کی جس نے مجھے یہ کھلایا اور میری کسی طاقت کے بغیر عطا کیا۔ (پچھلے گناہ معاف ہوتے ہیں۔)"},"du.nikalna":{"t":"گھر سے نکلنا","m":"اللہ کے نام سے، اللہ پر بھروسہ کیا، اور نہ کوئی طاقت ہے نہ قوت مگر اللہ سے۔"},"du.dakhil":{"t":"گھر میں داخل ہونا","m":"اللہ کے نام سے ہم داخل ہوئے اور نکلے، اور اپنے رب اللہ پر بھروسہ کیا۔ پھر گھر والوں کو سلام کریں۔"},"du.bath1":{"t":"بیت الخلاء جانے سے پہلے","m":"اللہ کے نام سے۔ اے اللہ! میں ناپاک جن مرد و عورت (شیاطین) سے تیری پناہ مانگتا ہوں۔ (پہلے بایاں پاؤں۔)"},"du.bath2":{"t":"بیت الخلاء سے نکلنا","m":"(اے اللہ) تیری بخشش چاہتا ہوں۔ (پہلے دایاں پاؤں۔)"},"du.wudu":{"t":"وضو کے بعد","m":"گواہی دیتا ہوں اللہ کے سوا کوئی معبود نہیں… اور محمد ﷺ اس کے بندے اور رسول ہیں۔ جنت کے آٹھ دروازے کھل جاتے ہیں۔ (وضو سے پہلے: بسم اللہ)"},"du.masjid1":{"t":"مسجد میں داخل","m":"اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔ (دایاں پاؤں پہلے۔)"},"du.masjid2":{"t":"مسجد سے نکلنا","m":"اے اللہ! میں تجھ سے تیرا فضل مانگتا ہوں۔ (بایاں پاؤں پہلے۔)"},"du.kapray":{"t":"کپڑے پہننا","m":"تعریف اس اللہ کی جس نے مجھے یہ پہنایا اور میری طاقت کے بغیر عطا کیا۔"},"du.safar":{"t":"سواری / سفر","m":"پاک ہے وہ جس نے اسے ہمارے قابو میں دیا، ہم خود اسے قابو نہ کر سکتے تھے، اور ہم اپنے رب کی طرف لوٹنے والے ہیں۔"},"du.azan":{"t":"اذان کے بعد","m":"اے اللہ، اس کامل پکار اور قائم ہونے والی نماز کے رب! محمد ﷺ کو وسیلہ اور فضیلت عطا کر اور انہیں مقامِ محمود پر اٹھا جس کا تو نے وعدہ کیا۔ (شفاعت نصیب ہوگی۔)"},"du.cheenk":{"t":"چھینک آئے","m":"تمام تعریف اللہ کی · اللہ تم پر رحم کرے · اللہ تمہیں ہدایت دے اور تمہارا حال درست کرے۔"},"du.gussa":{"t":"غصہ آئے","m":"میں مردود شیطان سے اللہ کی پناہ مانگتا ہوں۔ کھڑے ہوں تو بیٹھ جائیں، خاموش ہو جائیں۔"},"du.fikr":{"t":"پریشانی / غم","m":"اے اللہ! فکر، غم، عاجزی، سستی، کنجوسی، بزدلی، قرض کے بوجھ اور لوگوں کے غلبے سے تیری پناہ۔"},"du.musibat":{"t":"مصیبت / نقصان","m":"ہم اللہ ہی کے ہیں اور اسی کی طرف لوٹنے والے ہیں۔"},"du.yunus":{"t":"مشکل وقت (دعائے یونس)","m":"تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ہی ظالموں میں سے تھا۔"},"du.majlis":{"t":"مجلس ختم ہونے پر","m":"اے اللہ تو پاک ہے اپنی تعریف کے ساتھ، تیرے سوا کوئی معبود نہیں، تجھ سے معافی مانگتا اور توبہ کرتا ہوں۔ (مجلس کی غلطیوں کا کفارہ۔)"},"du.barish":{"t":"بارش ہو","m":"اے اللہ! اسے فائدہ دینے والی بارش بنا۔"},"du.iftar":{"t":"روزہ افطار","m":"پیاس چلی گئی، رگیں تر ہو گئیں اور ان شاءاللہ اجر پکا ہو گیا۔"},"du.jazak":{"t":"کوئی بھلائی کرے","m":"اللہ تمہیں بہترین بدلہ دے۔ (یہ کہنا بہترین شکریہ ہے۔)"},"du.walidain":{"t":"والدین کے لیے","m":"اے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔"},"du.ilm":{"t":"علم کے لیے","m":"اے میرے رب! میرے علم میں اضافہ فرما۔"},"du.hasana":{"t":"دنیا و آخرت کی بھلائی","m":"اے رب! ہمیں دنیا میں بھی بھلائی دے اور آخرت میں بھی، اور آگ کے عذاب سے بچا۔ (نبی ﷺ کی سب سے زیادہ مانگی جانے والی دعا۔)"},"du.dil":{"t":"دین پر ثابت قدمی","m":"اے دلوں کو پھیرنے والے! میرا دل اپنے دین پر جما دے۔"},"su.0":"دائیں ہاتھ سے کھانا اور پینا","su.1":"کھانے سے پہلے ”بسم اللہ“ کہنا","su.2":"سلام میں پہل کرنا — پہلے سلام کرنے والا اللہ کے زیادہ قریب","su.3":"بھائی سے مسکرا کر ملنا — یہ بھی صدقہ ہے","su.4":"مسواک کرنا (خاص کر وضو/نماز سے پہلے)","su.5":"وضو کے بعد 2 رکعت تحیۃ الوضو","su.6":"دائیں کروٹ پر سونا","su.7":"سونے سے پہلے وضو کرنا","su.8":"بیٹھ کر پانی پینا، تین سانس میں","su.9":"جوتا پہلے دایاں پہننا، اتارتے وقت پہلے بایاں","su.10":"چھینک پر ”الحمدللہ“ کہنا","su.11":"اذان کا جواب دینا اور بعد کی دعا پڑھنا","su.12":"فجر سے پہلے 2 سنت — دنیا و مافیہا سے بہتر","su.13":"کسی بھائی کے لیے اس کی غیر موجودگی میں دعا","su.14":"کسی مریض کی عیادت (یا فون پر حال پوچھنا)","su.15":"کسی کو تحفہ دینا — محبت بڑھتی ہے","su.16":"راستے سے تکلیف دہ چیز ہٹا دینا","su.17":"کھانے کے بعد پلیٹ صاف کرنا اور انگلیاں چاٹنا","su.18":"ہر فرض نماز کے بعد آیت الکرسی","su.19":"سونے سے پہلے تینوں قل پڑھ کر ہاتھوں پر پھونک کر جسم پر پھیرنا","su.20":"سونے سے پہلے تسبیحِ فاطمہ: 33 سبحان اللہ، 33 الحمدللہ، 34 اللہ اکبر","su.21":"غصہ آئے تو خاموش ہو جانا / بیٹھ جانا","su.22":"اچھی بات کہو یا خاموش رہو","su.23":"گھر میں داخل ہو کر سلام کرنا","su.24":"گھر کے کام میں ہاتھ const wd=d=>L==='ru'?WD[d.getDay()]:d.toLocaleDateString(LG().loc+'-u-ca-gregory',{weekday:'short'});
const EMO=['🌙','⭐','🌿','🌸','🕊️','🌻','🍃','💎','🌊','🔥'];

// ---------- state ----------
function fresh(name){return{name:name||'Main',emo:'🌙',days:{},habits:[],prog:null,bonus:0}}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.profiles){const id=uid();S={v:1,profiles:{[id]:fresh('')},active:id,remote:{},onb:false,set:{lat:24.8607,lng:67.0011,city:'Karachi',method:'karachi',asr:'hanafi',lang:'ru',rem:{on:false,s:'07:00',e:'17:30',nz:false}}}}
  S.set=S.set||{};S.set.rem=S.set.rem||{on:false,s:'07:00',e:'17:30',nz:false};S.remote=S.remote||{};if(!LANGS[S.set.lang])S.set.lang='ru';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast(t('ts.storageFull'))}}
const P=()=>S.profiles[S.active];
function day(k=dk(),p=P()){return p.days[k]||(p.days[k]={n:{}})}
const peek=(k,p=P())=>p.days[k]||{n:{}};

// ---------- scoring ----------
// qaza: log per din days[k].qz={f,z,a,m,i,w}; profile.qaza={on,total:{..},goal,witr,since,last:[[date,key]],chk}
const QK=[['f','🌄'],['z','☀️'],['a','🌤️'],['m','🌇'],['i','🌙'],['w','✨']];
const QZP=5,QZCAP=10;
const qzOf=d=>d&&d.qz?QK.reduce((a,[k])=>a+(+d.qz[k]||0),0):0;
function dayPts(d){if(!d)return 0;let p=0;
  p+=Object.values(d.n||{}).filter(Boolean).length*10;
  if(d.su)p+=10; if(d.az&&d.az.Sd)p+=15; if(d.az&&d.az.Ed)p+=15;
  p+=Math.min((d.deeds||[]).length,5)*5; if(d.mu&&(d.mu.a||d.mu.b||d.mu.c))p+=10;
  p+=Math.min(Math.floor((d.ist||0)/33)*3,30); if(d.amal)p+=10;
  if(d.jm)p+=Object.entries(d.jm).filter(([k,v])=>k!=='dc'&&v).length*5;
  p+=Math.min(qzOf(d),QZCAP)*QZP;
  return p}
function points(p=P()){return Object.values(p.days).reduce((a,d)=>a+dayPts(d),0)+(p.bonus||0)}
const LV=[0,100,300,600,1000,1600,2400,3400,4600,6000];
function level(pts){let i=0;while(i<LV.length-1&&pts>=LV[i+1])i++;const nx=LV[i+1];return{n:i+1,name:t('lv.'+i),pct:nx?(pts-LV[i])/(nx-LV[i])*100:100,next:nx||null}}
const nzCount=d=>NZ.filter(([k])=>d&&d.n&&d.n[k]).length;
const active=d=>d&&(nzCount(d)||d.su||(d.az&&(d.az.Sd||d.az.Ed))||(d.deeds||[]).length||d.amal||d.ist||qzOf(d)||(d.mu&&(d.mu.a||d.mu.b||d.mu.c)));
function streak(test,p=P()){let n=0,d=new Date();if(!test(p.days[dk(d)]))d=addD(d,-1);while(test(p.days[dk(d)])){n++;d=addD(d,-1)}return n}
const deenStreak=p=>streak(active,p), nzStreak=p=>streak(d=>nzCount(d)===5,p), suStreak=p=>streak(d=>d&&d.su,p);

// ---------- prayer times (PrayTimes-style astronomical calc) ----------
const METHODS={karachi:{n:'University of Islamic Sciences, Karachi',f:18,i:18},mwl:{n:'Muslim World League',f:18,i:17},isna:{n:'ISNA (N. America)',f:15,i:15},egypt:{n:'Egyptian Authority',f:19.5,i:17.5},makkah:{n:'Umm al-Qura, Makkah',f:18.5,im:90}};
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*Math.sin(rad(g))+.02*Math.sin(rad(2*g)),360),e=23.439-.00000036*D;
  const RA=fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15,24);return{dec:deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))),eqt:q/15-RA}}
function prayerTimes(date=new Date()){
  const {lat,lng,method,asr}=S.set,m=METHODS[method]||METHODS.karachi;
  const y=date.getFullYear(),mo=date.getMonth()+1,dd=date.getDate();
  let Y=y,M=mo;if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+dd+B-1524.5-lng/(15*24);
  const tz=-new Date(y,mo-1,dd,12).getTimezoneOffset()/60;
  const at=t=>sunPos(jd+t/24);
  const noon=t=>fix(12-at(t).eqt,24);
  const ang=(a,t,ccw)=>{const s=at(t),T=deg(Math.acos((-Math.sin(rad(a))-Math.sin(rad(s.dec))*Math.sin(rad(lat)))/(Math.cos(rad(s.dec))*Math.cos(rad(lat)))))/15;return noon(t)+(ccw?-T:T)};
  const asrA=(f,t)=>{const s=at(t);return -deg(Math.atan(1/(f+Math.tan(rad(Math.abs(lat-s.dec))))))};
  let t={f:5,s:6,z:12,a:13,m:18,i:18};
  for(let k=0;k<2;k++){t={f:ang(m.f,t.f,1),s:ang(.833,t.s,1),z:noon(t.z),a:ang(asrA(asr==='hanafi'?2:1,t.a),t.a),m:ang(.833,t.m),i:m.im?null:ang(m.i,t.i)}}
  t.z+=1/60; if(m.im)t.i=t.m+m.im/60;
  const out={};for(const k in t){const h=t[k]+tz-lng/15;if(isNaN(h)){out[k]=null;continue}const d=new Date(y,mo-1,dd,0,0,0);d.setMinutes(Math.round(h*60));out[k]=d}
  return out}
// RTL mein waqt ko bidi-isolate karein taake "7:20 PM" ulat kar "PM7:20" na dikhe
const fmtT=d=>{if(!d)return'—';const s=d.toLocaleTimeString(LG().tloc||LG().loc,{hour:'numeric',minute:'2-digit'});return LG().dir==='rtl'?'\u2068'+s+'\u2069':s};
function nextPrayer(){const now=new Date(),t=prayerTimes(now);for(const [k] of NZ){if(t[k]&&t[k]>now)return{k,t:t[k]}}const t2=prayerTimes(addD(now,1));return{k:'f',t:t2.f}}
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?t('dur.hm',{h:N(Math.floor(m/60)),m:N(m%60)}):t('dur.m',{m:N(m)})};

// ---------- Benamazi se Namazi program ----------
const STAGES=[{g:['m'],d:7},{g:['m','i'],d:7},{g:['f','m','i'],d:7},{g:['f','a','m','i'],d:7},{g:['f','z','a','m','i'],d:7},{g:['f','z','a','m','i'],d:40},{g:['f','z','a','m','i'],d:30,sm:1}];
const stT=i=>t('st.'+i+'.t'),stTip=i=>t('st.'+i+'.tip');
function progState(p=P()){const g=p.prog;if(!g)return null;const st=STAGES[g.s];if(!st)return{done:true};
  const ok=d=>d&&st.g.every(k=>d.n&&d.n[k])&&(!st.sm||d.sm);let n=0,d=new Date();const start=new Date(g.since);start.setHours(0,0,0,0);
  if(!ok(p.days[dk(d)]))d=addD(d,-1);while(d>=start&&ok(p.days[dk(d)])){n++;d=addD(d,-1)}
  return{st,i:g.s,n,todayOk:ok(p.days[dk()])}}
function progCheck(){const p=P();const ps=progState(p);if(!ps||ps.done)return;if(ps.n>=ps.st.d){p.bonus=(p.bonus||0)+50;p.prog.s++;p.prog.since=Date.now();save();
  const nx=STAGES[p.prog.s];modal(`<div style="text-align:center"><div style="font-size:54px">🎉</div><p class="big">${t('pg.done',{t:esc(stT(ps.i))})}</p><p class="mute">${nx?t('pg.next',{t:esc(stT(p.prog.s))})+'<br>'+esc(stTip(p.prog.s)):t('pg.all')}</p><p class="mute">${t('pg.plus50')}</p><button class="btn full" data-act="mclose">${t('u.alhamdulillah')}</button></div>`)}}

// ---------- HOME ----------
function azMode(){const now=new Date(),t=prayerTimes(now),d=day();if(t.z&&now<t.z)return'S';if(t.a&&now>=t.a)return'E';return d.az&&d.az.Sd?'E':'S'}
function azList(m){return D.azkar.filter(z=>!(z.only&&z.only!==m))}
function azProg(m,d=day()){const L=azList(m),a=(d.az&&d.az[m])||{};let done=0;L.forEach(z=>{if((a[z.k]||0)>=z.n)done++});return{done,total:L.length}}
function renderHome(){
  const p=P(),d=day(),pts=points(),lv=level(pts),tm=prayerTimes(),nx=nextPrayer(),ps=progState();
  const si=dayNo()%D.sunnah.length,su=D.sunnah[si],m=azMode(),ap=azProg(m),azDone=d.az&&d.az[m+'d'];
  let h=`<div class="strip">
   <div class="pill"><b>🔥 ${N(deenStreak())}</b><span>${t('home.deenStreak')}</span></div>
   <div class="pill"><b>${N(nzStreak())} <small style="font-size:13px;font-weight:500">${t('u.days')}</small></b><span>${t('home.nzStreak')}</span></div>
   <div class="pill" data-act="go" data-a="safar"><b style="font-size:15px">${t('lv.short',{n:N(lv.n)})}</b><span>${esc(lv.name)}</span><div class="bar"><i style="width:${lv.pct}%"></i></div></div></div>`;
  h+=`<div class="card"><h2>${t('home.todayNz')} <em>${fr(nzCount(d),5)}</em></h2><div class="namaz">`+
   NZ.map(([k,e])=>`<button class="nz ${d.n[k]?'on':''} ${ps&&ps.st&&ps.st.g.includes(k)&&!d.n[k]?'goal':''}" data-act="nz" data-a="${k}" aria-label="${nzN(k)}"><div class="c">${d.n[k]?'✓':e}</div><b>${nzN(k)}</b><span>${fmtT(tm[k])}</span></button>`).join('')+
   `</div><div class="next"><span>${t('home.next')}: <b>${nzN(nx.k)}</b> · ${fmtT(nx.t)}</span><span>${t('home.left',{d:dur(nx.t-new Date())})}</span></div>`+
   (ps&&ps.st?`<div class="next" style="border:0;padding-top:4px;margin-top:4px"><span>🎯 ${esc(stT(ps.i))}</span><span>${t('u.daysFrac',{a:N(ps.n),b:N(ps.st.d)})}</span></div>`:'')+`</div>`;
  h+=qzHome();
  h+=`<div class="card"><h2>${t('home.sunnah')} <em>${suStreak()?'🔥 '+N(suStreak()):''}</em></h2><p class="big">${esc(suText(si))}</p><p class="ref">${esc(su.ref)}</p><div style="margin-top:16px">`+
   (d.su?`<button class="btn done" data-act="su">${t('home.suDone')}</button>`:`<button class="btn" data-act="su">${t('home.suBtn')}</button>`)+`</div></div>`;
  h+=`<div class="card"><h2>${m==='S'?t('az.morningH'):t('az.eveningH')} <em>${fr(ap.done,ap.total)}</em></h2>
   <div class="row"><div class="sp"><p class="big" style="margin:0">${azDone?t('home.azDone'):m==='S'?t('home.azS'):t('home.azE')}</p><p class="mute" style="margin:4px 0 0">${m==='S'?t('home.azSTime'):t('home.azETime')}</p></div>
   <div class="ring" style="width:56px;height:56px">${ring(ap.done/ap.total,56)}<span style="font-size:14px">${N(Math.round(ap.done/ap.total*100))}%</span></div></div>
   <div style="margin-top:16px"><button class="btn ${azDone?'ghost':''}" data-act="az" data-a="${m}">${azDone?t('home.azAgain'):ap.done?t('home.azCont'):t('home.azStart')}</button></div></div>`;
  if(isFri())h+=jummaCard(true);
  h+=NOTE();$('#v-home').innerHTML=h}

const JM=[['ghusl','Bukhari 877'],['kapre','Bukhari 883'],['kahf','Hakim, Bayhaqi'],['durood','Abu Dawud 1047'],['jaldi','Bukhari 881, 934'],['dua','Abu Dawud 1048']];
function jummaCard(home){const d=day(),j=d.jm||{},n=JM.filter(([k])=>j[k]).length;

// ---------- QAZA ----------
const qzKeys=q=>QK.filter(([k])=>k!=='w'||(q&&q.witr));
function qzDone(p=P()){const o={f:0,z:0,a:0,m:0,i:0,w:0};Object.values(p.days).forEach(d=>{if(d&&d.qz)QK.forEach(([k])=>o[k]+=(+d.qz[k]||0))});return o}
function qzSum(p,n){let s=0;for(let i=0;i<n;i++)s+=qzOf(p.days[dk(addD(new Date(),-i))]);return s}
function qzStats(p=P()){const q=p.qaza;if(!q||!q.on)return null;q.total=q.total||{};const done=qzDone(p),keys=qzKeys(q),rem={};let left=0,Dn=0;
  keys.forEach(([k])=>{rem[k]=Math.max(0,(+q.total[k]||0)-done[k]);left+=rem[k];Dn+=done[k]});
  const span=Math.max(1,Math.min(14,dayNo()-dayNo(new Date(q.since||Date.now()))+1));
  const today=qzOf(p.days[dk()]),week=qzSum(p,7),rate=qzSum(p,span)/span;return{q,done,rem,keys,left,Dn,T:left+Dn,today,week,rate,perDay:keys.length}}
const qzSpan=d=>d<=45?t('qz.days',{n:N(Math.max(1,Math.round(d)))}):d<730?t('qz.months',{n:N(Math.round(d/30.44))}):t('qz.years',{n:N(d<3650?Math.round(d/365*10)/10:Math.round(d/365))});
function qzEta(st){if(!st.left)return'';if(st.rate>0)return t('qz.eta',{s:qzSpan(st.left/st.rate)});
  const g=st.q.goal||st.perDay;return t('qz.etaGoal',{g:N(g),s:qzSpan(st.left/g)})}
function qzMissed(p=P()){const q=p.qaza;if(!q||!q.on)return[];const out=[];
  for(let i=1;i<=14;i++){const k=dk(addD(new Date(),-i));if(q.chk&&k<=q.chk)break;const d=p.days[k];if(!d)continue;
    const ms=NZ.filter(([x])=>!(d.n&&d.n[x])).map(x=>x[0]);if(ms.length)out.push([k,ms])}return out}
const qzMissN=Lx=>Lx.reduce((a,x)=>a+x[1].length,0);
const fmtDay=k=>{const [y,m,d]=k.split('-').map(Number);const x=new Date(y,m-1,d);return wd(x)+', '+x.toLocaleDateString(LG().loc+'-u-ca-gregory',{day:'numeric',month:'short'})};
function qzNote(){const tm=prayerTimes(),o=(k,mn)=>tm[k]?new Date(tm[k].getTime()+mn*6e4):null,r=(a,b)=>a&&b?fmtT(a)+'–'+fmtT(b):'—';
